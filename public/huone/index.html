<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#16202c">
<title>Huone · AI-pelit</title>
<style>
  /* The room page (#388): the room's connection and the voice calls live here, and the game plays
     in the frame under the room bar. Switching games changes only the frame. rooms.js draws the 🎤 chip here, over
     the frame, where it sits in the game alone: a finger on it stays through a switch (#394). */
  html, body { margin: 0; height: 100%; background: #000; color: #eef2f7; font: 14px system-ui, sans-serif; overflow: hidden; }
  /* No text selection on a long press (#457), as in every game (back.js); text fields still edit. */
  :where(html, html *) { -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
  :where(input, textarea, [contenteditable]:not([contenteditable="false"]), [contenteditable]:not([contenteditable="false"]) *) { -webkit-user-select: text !important; user-select: text !important; -webkit-touch-callout: default !important; }
  :root { --bar: 44px; }
  @media (orientation: landscape) and (max-height: 500px) { :root { --bar: 34px; } }
  #bar { position: fixed; top: 0; left: 0; right: 0; z-index: 2; box-sizing: border-box;
         height: calc(env(safe-area-inset-top, 0px) + var(--bar));
         padding: env(safe-area-inset-top, 0px) calc(env(safe-area-inset-right, 0px) + 6px) 0 calc(env(safe-area-inset-left, 0px) + 10px);
         display: flex; align-items: center; gap: 10px; background: #16202c; border-bottom: 1px solid #2a3a4e;
         -webkit-user-select: none; user-select: none; }
  #code { flex: none; font-weight: 800; font-size: 15px; letter-spacing: 1px; color: #ffd166; }
  #code small { font-weight: 600; font-size: 11px; letter-spacing: 0; color: #9fb3c8; margin-right: 4px; }
  #who { flex: 1; min-width: 0; display: flex; gap: 10px; overflow: hidden; white-space: nowrap; }
  #who span { display: inline-flex; align-items: center; gap: 4px; min-width: 0; color: #cfd9e5; }
  #who span.off { opacity: .45; }
  #who i { flex: none; width: 9px; height: 9px; border-radius: 50%; }
  #who span.talk { color: #fff; font-weight: 700; }
  #who span.talk i { box-shadow: 0 0 0 3px rgba(255, 255, 255, .35); }
  #who em { font-style: normal; overflow: hidden; text-overflow: ellipsis; max-width: 7.5em; }
  #state { flex: none; color: #ffd166; font-size: 12px; }
  #stage { position: fixed; left: 0; right: 0; bottom: 0; top: calc(env(safe-area-inset-top, 0px) + var(--bar));
           padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
           box-sizing: border-box; }
  #game { width: 100%; height: 100%; border: 0; display: block; background: #000; }
</style>
</head>
<body>
<div id="bar">
  <span id="code"><small>Huone</small><b></b></span>
  <span id="who"></span>
  <span id="state" hidden>Yhdistetään…</span>
</div>
<div id="stage"><iframe id="game" title="Peli" allow="autoplay; fullscreen"></iframe></div>
<script src="../rooms.js" data-shell></script>
<script>
(function () {
  'use strict';
  var S = window.AiPelitRoomShell;
  var YLOS = 'ai-pelit:_huone:ylos', VIRHE = 'ai-pelit:_huone:virhe';
  var q = new URLSearchParams(location.search);
  var code = String(q.get('koodi') || '').toUpperCase(), peli = String(q.get('peli') || ''), v = Number(q.get('v'));
  if (!S || !/^[A-Z]{4}$/.test(code) || !/^[a-z0-9-]{1,40}$/.test(peli) || !(Number.isInteger(v) && v > 0)) {
    location.replace('../');
    return;
  }
  // The shelf's page of the game the room was made in, when it is below this page (#68): back and
  // leaving go through it, as from a game page.
  try {
    var below = sessionStorage.getItem(YLOS);
    if (below) {
      sessionStorage.removeItem(YLOS);
      history.replaceState({ aiPelitUp: true, below: below }, '');
    }
  } catch (e) {}
  function stateOf() { return history.state && typeof history.state === 'object' ? history.state : {}; }

  var frame = document.getElementById('game');
  frame.src = '../games/' + peli + '/v' + v + '/?huone=' + code;
  function remember() {
    var s = new URLSearchParams({ koodi: code, peli: peli, v: v });
    history.replaceState(history.state, '', '?' + s);
  }
  frame.addEventListener('load', function () {
    try {
      var w = frame.contentWindow;
      var m = w.location.pathname.match(/\/games\/([a-z0-9-]+)\/v(\d+)\//);
      if (m) { peli = m[1]; v = Number(m[2]); remember(); }
      document.title = (w.document.title || 'Peli') + ' · Huone ' + code;
    } catch (e) {}
  });

  // Away from the room page: to a game's page, so that back still goes up (#68), as rooms.js and
  // kaverit.js do from a game page.
  var going = false;
  function goGame(href) {
    going = true;
    var url = new URL(href, location.href);
    var m = url.pathname.match(/\/games\/([a-z0-9-]+)\/v\d+\//), st = stateOf();
    try {
      if (st.aiPelitUp && st.below && m && m[1] === st.below) sessionStorage.setItem('ai-pelit:_ylos', url.pathname);
      if (st.aiPelitUp && st.below && m && m[1] !== st.below) {
        sessionStorage.setItem('ai-pelit:_avaa', JSON.stringify({ from: '#/' + st.below, page: '#/' + m[1], game: url.href }));
        history.back();
        return;
      }
    } catch (e) {}
    location.replace(url.href);
  }
  // The player left the room, or the room closed: the game alone, with the reason on its room screen.
  S.onleft = function (why) {
    if (going) return;
    try { if (why) sessionStorage.setItem(VIRHE, JSON.stringify(why)); } catch (e) {}
    goGame('../games/' + peli + '/v' + v + '/');
  };
  // A friend's invite into another room (kaverit.js).
  S.go = function (href) { goGame(href); };
  // The back chip in the game: up to the shelf, past this page.
  S.up = function (href) {
    going = true;
    if (stateOf().aiPelitUp) history.back();
    else location.replace(href);
  };
  // A new code (the first one was taken) or a room typed in the game.
  S.onroom = function (c) { if (c && c !== code) { code = c; remember(); render(); } };

  var el = {
    code: document.querySelector('#code b'), who: document.getElementById('who'),
    state: document.getElementById('state'),
  };
  var drawn = '';
  function render() {
    var s = S.state;
    var key = JSON.stringify([code, s.members, s.connected]);
    if (key === drawn) return;
    drawn = key;
    el.code.textContent = code;
    el.who.textContent = '';
    s.members.forEach(function (m) {
      var span = document.createElement('span'), dot = document.createElement('i'), name = document.createElement('em');
      dot.style.background = m.color;
      name.textContent = m.id === s.me ? m.name + ' (sinä)' : m.name;
      span.className = (m.on ? '' : 'off') + (m.talking ? ' talk' : '');
      span.appendChild(dot);
      span.appendChild(name);
      if (m.talking) span.appendChild(document.createTextNode('🔊'));
      el.who.appendChild(span);
    });
    el.state.hidden = s.connected || !s.on;
  }
  S.watch(window, render);
  render();
})();
</script>
</body>
</html>
