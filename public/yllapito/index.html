<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ylläpito · AI-pelit</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../app.css">
<style>
  .player { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .player .who { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .player button { padding: 8px 12px; }
  .tag { font-size: 12px; padding: 2px 6px; border-radius: 6px; background: #3a4570; }
  .tag.pending { background: #8a6d12; }
  .tag.rejected { background: #7a2b2b; }
  form { display: flex; gap: 8px; }
  form[hidden] { display: none; }
  button { font-family: inherit; }
  .palaute { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.1); }
  .palaute p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  form input { flex: 1; min-width: 0; padding: 10px; border-radius: 10px; border: 0; font: 16px system-ui, sans-serif; }
</style>
</head>
<body>
<header class="top"><a class="brand" href="../">AI-pelit</a></header>
<main>
  <h1>Nimimerkit</h1>
  <p class="muted">Uusi tai vaihdettu nimimerkki näkyy tuloslistoilla vasta, kun hyväksyt sen.</p>
  <form id="login" hidden>
    <input id="key" type="password" autocomplete="current-password" placeholder="Ylläpidon avain" aria-label="Ylläpidon avain">
    <button class="button" type="submit">Avaa</button>
  </form>
  <p id="msg" class="muted"></p>
  <div id="list"></div>
  <h1 id="feedback-title" hidden>Palautteet</h1>
  <p id="feedback-note" class="muted" hidden>Pelaajien palautteet peleistä. Kerran päivässä uudet kootaan GitHubiin, ja agentti kysyy sinulta, mitkä korjataan.</p>
  <div id="feedback"></div>
</main>
<script>
// The admin's page for nicknames (#25). The key is the ADMIN_KEY secret on Cloudflare; it is
// kept on this phone only, so the shelf can show how many names wait.
(function () {
  'use strict';
  var KEY = 'ai-pelit:_yllapito:avain';
  // A link with #avain=<key> saves the key on this phone and drops it from the address.
  function keyFromLink() {
    var m = location.hash.match(/avain=([^&]+)/);
    if (!m) return false;
    localStorage.setItem(KEY, decodeURIComponent(m[1]));
    history.replaceState(null, '', location.pathname);
    return true;
  }
  keyFromLink();
  var login = document.getElementById('login'), msg = document.getElementById('msg'), list = document.getElementById('list');
  var note = ''; // said once above the list after it reloads
  var LABEL = { pending: 'odottaa', approved: 'hyväksytty', rejected: 'hylätty' };

  function call(method, body, path) {
    return fetch('../api/admin/' + (path || 'players'), {
      method: method,
      headers: { 'content-type': 'application/json', 'x-admin-key': localStorage.getItem(KEY) || '' },
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      if (r.status === 403) { localStorage.removeItem(KEY); throw new Error('avain'); }
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) { throw new Error(r.status + ' ' + (b.error || '')); });
      return r.json();
    });
  }

  function button(text, status, id, name) {
    var b = document.createElement('button');
    b.type = 'button'; b.textContent = text; b.className = status === 'approved' ? 'button' : 'secondary';
    b.dataset.status = status;
    b.onclick = function () { call('POST', { id: id, name: name, status: status }).then(show, fail); };
    return b;
  }

  function show() {
    login.hidden = true;
    msg.textContent = 'Haetaan…';
    call('GET').then(function (b) {
      list.textContent = '';
      var waiting = b.players.filter(function (p) { return p.status === 'pending'; }).length;
      msg.textContent = (note ? note + ' ' : '') + (waiting ? waiting + ' odottaa hyväksyntää.' : 'Kaikki nimet on käsitelty.');
      note = '';
      b.players.forEach(function (p) {
        var row = document.createElement('div');
        row.className = 'player'; row.dataset.status = p.status;
        var who = document.createElement('div'); who.className = 'who';
        var name = document.createElement('strong'); name.textContent = p.name;
        var tag = document.createElement('span'); tag.className = 'tag ' + p.status; tag.textContent = LABEL[p.status];
        who.appendChild(name); who.appendChild(document.createTextNode(' ')); who.appendChild(tag);
        row.appendChild(who);
        if (p.status !== 'approved') row.appendChild(button('Hyväksy', 'approved', p.id, p.name));
        if (p.status !== 'rejected') row.appendChild(button('Hylkää', 'rejected', p.id, p.name));
        list.appendChild(row);
      });
    }, fail);
    showFeedback();
  }

  // The players' feedback, newest first, with the GitHub issue each was filed in (#184).
  function showFeedback() {
    var box = document.getElementById('feedback');
    var titles = {};
    Promise.all([
      call('GET', undefined, 'feedback'),
      fetch('../catalog.json').then(function (r) { return r.json(); }).then(function (c) {
        c.games.forEach(function (g) { titles[g.slug] = g.title; });
      }).catch(function () {}),
    ]).then(function (all) {
      var b = all[0];
      document.getElementById('feedback-title').hidden = false;
      document.getElementById('feedback-note').hidden = false;
      box.textContent = '';
      if (!b.feedback.length) { box.textContent = 'Ei vielä palautteita.'; return; }
      b.feedback.forEach(function (f) {
        var row = document.createElement('div'); row.className = 'palaute';
        var head = document.createElement('div'); head.className = 'muted';
        var at = new Date(f.at).toLocaleString('fi-FI', { day: 'numeric', month: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
        head.textContent = (titles[f.game] || f.game) + (f.version ? ' v' + f.version : '') + ' · ' + f.name + ' · ' + at + ' · ';
        if (f.issue) {
          var a = document.createElement('a');
          a.href = 'https://github.com/eerovil/ai-pelit/issues/' + f.issue; a.textContent = '#' + f.issue;
          head.appendChild(a);
        } else head.appendChild(document.createTextNode('uusi'));
        var text = document.createElement('p'); text.textContent = f.text;
        row.appendChild(head); row.appendChild(text);
        box.appendChild(row);
      });
    }, function () { box.textContent = ''; });
  }

  function fail(e) {
    list.textContent = '';
    if (e && e.message === 'avain') { login.hidden = false; msg.textContent = localStorage.getItem(KEY) === null ? 'Väärä avain.' : ''; }
    else if (e && e.message === '409 name changed') { note = 'Pelaaja vaihtoi nimeään: katso uusi nimi.'; show(); }
    else if (e && e.message.indexOf('409') === 0) { note = 'Nimi on jo toisella pelaajalla: hyväksy vasta, kun pelaaja on valinnut uuden.'; show(); }
    else msg.textContent = 'Ei yhteyttä palvelimeen.';
  }

  login.addEventListener('submit', function (e) {
    e.preventDefault();
    localStorage.setItem(KEY, document.getElementById('key').value.trim());
    show();
  });

  window.addEventListener('hashchange', function () { if (keyFromLink()) show(); });
  if (localStorage.getItem(KEY)) show(); else { login.hidden = false; }
})();
</script>
</body>
</html>
