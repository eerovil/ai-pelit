<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#06223a">
<title>Jään alla</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06223a; color: #e8f6ff;
    font-family: system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100vw; height: 100dvh; touch-action: none; }
  .hidden { display: none !important; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top) + 8px) 10px 0 10px; pointer-events: none; }
  #meters { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 0 50px 0 78px; min-height: 36px; align-items: center; }
  .m { display: flex; align-items: center; gap: 2px; font-size: 13px; }
  .m i { display: block; width: 24px; height: 8px; border-radius: 4px; background: rgba(255,255,255,.18); overflow: hidden; }
  .m s { display: block; height: 100%; width: 100%; background: #7fe0ff; border-radius: 4px; }
  .m.low s { background: #ff6b6b; }
  .m.low { animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: .45; } }
  #goalbar { margin-top: 8px; display: flex; align-items: center; gap: 8px; background: rgba(2,16,30,.62);
    border: 1px solid rgba(127,224,255,.25); border-radius: 12px; padding: 6px 10px; font-size: 14px; line-height: 1.3; }
  #arrow { flex: none; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #7fffd4; transition: transform .1s linear; }
  #goal { flex: 1; }
  #goal b { color: #7fffd4; font-weight: 700; }
  #where { flex: none; text-align: right; font-size: 12px; color: #a8cfe6; white-space: nowrap; }
  #bag { position: fixed; top: calc(env(safe-area-inset-top) + 6px); right: 8px; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(255,214,90,.7); background: rgba(2,16,30,.7); font-size: 22px; padding: 0; touch-action: manipulation; }
  #toast { position: fixed; left: 16px; right: 16px; top: 30dvh; text-align: center; font-size: 22px; font-weight: 800;
    color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.8); pointer-events: none; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end;
    padding: 0 14px calc(env(safe-area-inset-bottom) + 14px); pointer-events: none; }
  #stick { position: relative; width: 140px; height: 140px; border-radius: 50%; background: rgba(127,224,255,.1);
    border: 2px solid rgba(127,224,255,.4); touch-action: none; pointer-events: auto; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(200,240,255,.55); pointer-events: none; }
  #stick span { position: absolute; font-size: 12px; color: rgba(200,240,255,.6); pointer-events: none; }
  #right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; pointer-events: none; }
  #act { pointer-events: auto; touch-action: manipulation; font: inherit; font-size: 17px; font-weight: 800; color: #2b1d00;
    background: #ffd65a; border: 0; border-radius: 14px; padding: 12px 14px; max-width: 180px; box-shadow: 0 4px 0 #b88a00; }
  #act:active { transform: translateY(3px); box-shadow: 0 1px 0 #b88a00; }
  .ud { display: flex; gap: 10px; }
  .ud button { pointer-events: auto; touch-action: none; width: 64px; height: 64px; border-radius: 50%; font-size: 26px;
    color: #e8f6ff; background: rgba(127,224,255,.16); border: 2px solid rgba(127,224,255,.45); padding: 0; }
  .ud button.on { background: rgba(127,224,255,.45); }
  .ud small { display: block; font-size: 11px; }
  #panel, #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 18px;
    box-sizing: border-box; background: rgba(1,10,20,.55); touch-action: manipulation; }
  .card { width: 100%; max-width: 340px; max-height: 88dvh; overflow-y: auto; background: rgba(6,30,52,.95); border-radius: 18px;
    border: 1px solid rgba(127,224,255,.35); padding: 18px 16px; box-sizing: border-box; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .card h2 { margin: 0 0 8px; font-size: 22px; color: #7fffd4; }
  .card p { margin: 0 0 10px; font-size: 16px; line-height: 1.45; }
  .card p.log { font-style: italic; background: rgba(255,255,255,.06); border-left: 3px solid #ffd65a; padding: 8px 10px; border-radius: 6px; }
  .card p.msg { color: #ffd65a; font-weight: 700; }
  .card button { display: block; width: 100%; margin-top: 8px; font: inherit; font-size: 16px; font-weight: 700; text-align: left;
    color: #e8f6ff; background: rgba(127,224,255,.12); border: 1px solid rgba(127,224,255,.35); border-radius: 12px; padding: 11px 12px; }
  .card button:disabled { opacity: .45; }
  .card button.go { text-align: center; color: #2b1d00; background: #ffd65a; border: 0; box-shadow: 0 4px 0 #b88a00; font-size: 18px; }
  #menu { background: linear-gradient(rgba(1,10,20,.1), rgba(1,10,20,.75)); align-items: flex-end; padding-bottom: calc(env(safe-area-inset-bottom) + 28px); }
  #menu .card { background: rgba(6,30,52,.82); }
  #menu h1 { margin: 0; font-size: 40px; letter-spacing: 2px; color: #e8f6ff; text-shadow: 0 3px 12px #000; }
  #menu .sub { margin: 0 0 12px; font-size: 13px; letter-spacing: 2px; color: #7fe0ff; }
  #menu .help { font-size: 13px; color: #a8cfe6; margin-top: 10px; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; }
  #fade.on { opacity: 1; transition: none; }
  #ei { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="meters">
    <span class="m" id="mAir"><b>🫁</b><i><s></s></i></span>
    <span class="m" id="mPower"><b>⚡</b><i><s></s></i></span>
    <span class="m" id="mFood"><b>🍖</b><i><s></s></i></span>
    <span class="m" id="mHull"><b>🛡️</b><i><s></s></i></span>
  </div>
  <div id="goalbar"><span id="arrow">⬆</span><span id="goal"></span><span id="where"></span></div>
</div>
<button id="bag" class="hidden" aria-label="SISU">🎒</button>
<div id="toast" class="hidden"></div>
<div id="pad" class="hidden">
  <div id="stick"><div id="knob"></div></div>
  <div id="right">
    <button id="act" class="hidden"></button>
    <div class="ud"><button id="down">▼<small>sukella</small></button><button id="up">▲<small>nouse</small></button></div>
  </div>
</div>
<div id="fade"></div>
<div id="panel" class="hidden"><div class="card" id="card"></div></div>
<div id="menu" class="hidden"><div class="card">
  <h1>JÄÄN ALLA</h1>
  <p class="sub">SELVIYTYMISSEIKKAILU · LUKU 1</p>
  <p id="menuText">Aurora-asema on vaiennut. Ohjaa SISU-sukellusvene jään alle ja selvitä, mitä tapahtui.</p>
  <button class="go hidden" id="jatka">Jatka</button>
  <button class="go" id="uusi">Uusi peli</button>
  <p class="help">Vasen ohjain kääntää ja vie eteen. Oikealla nouset ja sukellat. Pidä huolta ilmasta, virrasta, ruoasta ja rungosta.</p>
</div></div>
<div id="ei" class="card" style="position:fixed;inset:30% 20px auto"><p>Tämä puhelin ei osaa piirtää 3D-kuvaa.</p></div>
<!-- Jään alla v1 (#106): a story survival game under the arctic ice, on the shared three.js. -->
<script type="module">
import * as THREE from '../../../lib/three-r187/three.module.js';

const KEY = 'ai-pelit:jaan-alla:';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const c = $('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true });
} catch (e) {
  c.style.display = 'none';
  $('ei').style.display = 'block';
  window.noWebgl = true;
}

if (renderer) {
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

// ---- The sea floor and the places in it -------------------------------------------------------
// World units are metres; the ice is at y = 0, down is negative.
function floorY(x, z) {
  let y = -62 + 9 * Math.sin(x * 0.011 + 1.3) * Math.cos(z * 0.013) + 4 * Math.sin(x * 0.037 + z * 0.029)
    + 2 * Math.cos(x * 0.071 - z * 0.053);
  const cd = Math.hypot(x + 60, z + 330), sd = Math.hypot(x, z);
  y -= 45 * Math.exp(-cd * cd / 9800);    // the deep canyon round the crystal cave
  y += 18 * Math.exp(-sd * sd / 7200);    // the shallow shelf under the station
  return y;
}
const CEIL = -4;                       // SISU's top under the ice
const BOUND = { x0: -320, x1: 320, z0: -440, z1: 220 };
const DOCK = { x: 0, y: -10, z: 0 };   // the moon pool under Aurora station
const START = { x: 0, y: -14, z: 34, yaw: 0 };
const NX = -140, NZ = -160, NY = floorY(NX, NZ);
const LX = 110, LZ = -40, LY = floorY(LX, LZ);
const KX = -60, KZ = -306, KY = floorY(KX, KZ);

// Inside places: a grid of 4 m cells. # wall, . water, E the airlock back to SISU,
// R scrap, F food, L a log to read, X the radio antenna, K the crystal, A an air pocket.
const SITES = {
  nordlys: {
    name: 'RV Nordlys', theme: 'wreck', door: { x: NX - 14, y: NY + 16, z: NZ },
    map: ['#################',
          '#F..#..R..#..L..#',
          '#...#.....#.....#',
          '#E..............#',
          '#...#.....#.....#',
          '##.###.#####.####',
          '#.R.#.F.#..R....#',
          '#...#...#.......#',
          '#################'],
    labels: [[2, 1, 'KANTTIINI'], [7, 1, 'TYÖPAJA'], [13, 1, 'KOMENTOSILTA'], [2, 6, 'VARASTO'], [6, 6, 'LABORATORIO'], [12, 6, 'LASTIRUUMA']],
    logTitle: 'Kapteenin loki – RV Nordlys',
    log: 'Jäävuori repi kylkeen reiän, ja laiva uppoaa. Kaikki kaksitoista ihmistä pääsivät jäävuoren luoliin: siellä on ilmatasku, jossa voi hengittää. Otimme radion antennin mukaan. – Kapteeni Lund',
  },
  lumikki: {
    name: 'Troolari Lumikki', theme: 'wreck', door: { x: LX, y: LY + 11, z: LZ },
    map: ['#########',
          '#E..#..R#',
          '#.....#.#',
          '#F#R....#',
          '#########'],
    labels: [[2, 2, 'KANSI'], [6, 3, 'RUUMA']],
  },
  jaavuori: {
    name: 'Jäävuoren luola', theme: 'ice', door: { x: 150, y: -32, z: -210 },
    map: ['###########',
          '#####..A###',
          '##E....####',
          '###..#..###',
          '###.##..A##',
          '##..#..L.##',
          '##.###.X.##',
          '##R...#####',
          '###########'],
    labels: [[7, 1, 'ILMATASKU'], [8, 4, 'ILMATASKU']],
    logTitle: 'Viesti jään seinässä',
    log: 'Meitä on kaksitoista, ja kaikki ovat kunnossa! Ruoka loppui, joten kiipesimme jäävuoren huipun ilmaraosta ulos ja kävelemme jään yli pohjoisen vuorten rannalle. Jätimme antennin tähän. Radio tarvitsee virtaa – kristalliluolan kristallit hehkuvat energiaa. – Aino, Aurora-aseman päällikkö',
  },
  kristalli: {
    name: 'Kristalliluola', theme: 'crystal', door: { x: KX, y: KY + 9, z: KZ },
    map: ['###########',
          '#E...######',
          '##.#...####',
          '##...#..A##',
          '####.#.R..#',
          '#K....##..#',
          '##.####..F#',
          '###########'],
    labels: [[8, 3, 'ILMATASKU']],
  },
};
for (const id in SITES) SITES[id].id = id;
const STATION_LOG = 'Päivä 41. Myrsky katkaisi radiomaston antennin, emmekä saa yhteyttä mantereelle. Koko aseman väki siirtyy tutkimusalus RV Nordlysiin odottamaan apua. Nordlys on ankkurissa asemasta lounaaseen. – Aino, aseman päällikkö';

// ---- The saved game (shared by every version) ------------------------------------------------
function fresh() {
  return { v: 1, t: 0, flags: {}, inv: { ruoka: 2, romu: 0, antenni: 0, kristalli: 0 },
    m: { power: 100, food: 80, hull: 100, air: 100 }, taken: {}, cool: {},
    sub: { ...START }, farmAt: -999, storeAt: -999, varasto: false, hungry: false };
}
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(KEY + 'peli')); return s && s.v ? Object.assign(fresh(), s) : null; } catch (e) { return null; }
}
function saveGame() {
  if (G.mode === 'sub') Object.assign(G.s.sub, { x: sub.pos.x, y: sub.pos.y, z: sub.pos.z, yaw: sub.yaw });
  try { localStorage.setItem(KEY + 'peli', JSON.stringify(G.s)); } catch (e) {}
}

const G = { mode: 'menu', s: fresh(), site: null, paused: false, hold: false, saveT: 0, warnT: 0, pingT: 3 };
const input = { x: 0, y: 0, up: false, down: false };

// ---- Scenes -----------------------------------------------------------------------------------
const world = new THREE.Scene();
const inside = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 700);
const camLight = new THREE.PointLight(0xd8eeff, 30, 30, 1);
camera.add(camLight);
world.add(camera);
world.fog = new THREE.FogExp2(0x0d4566, 0.012);
world.background = new THREE.Color(0x0d4566);
world.add(new THREE.HemisphereLight(0x9fdcff, 0x0a1a28, 1.6));
const sunDown = new THREE.DirectionalLight(0xcfefff, 1.2);
sunDown.position.set(30, 100, 20);
world.add(sunDown);

function rng(seed) { return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
function textTexture(text, w, h, font, color, bg) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.font = font; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h / 2);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function label(text, scale, color = '#cfefff') {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTexture(text, 512, 96, 'bold 54px system-ui, sans-serif', color),
    transparent: true, depthWrite: false }));
  s.scale.set(scale, scale * 96 / 512, 1);
  return s;
}
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.8, ...o });

// Sea floor: a displaced plane, coloured by depth.
{
  const geo = new THREE.PlaneGeometry(700, 720, 120, 120);
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, 0, -110);
  const p = geo.attributes.position, col = [], a = new THREE.Color(0x3c6466), b = new THREE.Color(0x14202e), t = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const y = floorY(p.getX(i), p.getZ(i));
    p.setY(i, y);
    t.copy(a).lerp(b, clamp((-y - 45) / 70, 0, 1));
    col.push(t.r, t.g, t.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  geo.computeVertexNormals();
  world.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, flatShading: true })));
}
// The ice overhead, lit from above, with cracks.
{
  const cv = document.createElement('canvas');
  cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#bfe4f7'; g.fillRect(0, 0, 256, 256);
  const r = rng(7);
  g.strokeStyle = '#eaf9ff'; g.lineWidth = 2;
  for (let i = 0; i < 14; i++) {
    g.beginPath(); let x = r() * 256, y = r() * 256; g.moveTo(x, y);
    for (let k = 0; k < 5; k++) { x += (r() - 0.5) * 90; y += (r() - 0.5) * 90; g.lineTo(x, y); }
    g.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(14, 14); tex.colorSpace = THREE.SRGBColorSpace;
  const ice = new THREE.Mesh(new THREE.PlaneGeometry(700, 720), new THREE.MeshStandardMaterial({ map: tex, emissive: 0x2f7fae, emissiveIntensity: 0.6, roughness: 1 }));
  ice.rotation.x = Math.PI / 2;
  ice.position.set(0, -1.2, -110);
  world.add(ice);
}

// Things SISU can bump into: spheres [x, y, z, r] and upright columns [x, z, r, y0, y1].
const SPHERES = [], COLUMNS = [];

// Aurora station from below: its legs, the moon pool and the fish farm nets.
{
  const st = new THREE.Group();
  const legMat = mat(0x5a4a42, { metalness: 0.5 });
  for (const [x, z] of [[-16, -10], [16, -10], [-16, 10], [16, 10]]) {
    const fy = floorY(x, z);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.2, -fy, 12), legMat);
    leg.position.set(x, fy / 2, z);
    st.add(leg);
    COLUMNS.push([x, z, 2.2, fy, 0]);
  }
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ color: 0xffe9a8 }));
  pool.rotation.x = Math.PI / 2; pool.position.y = -1.3;
  st.add(pool);
  const rim = new THREE.Mesh(new THREE.BoxGeometry(11, 1, 11), mat(0x8a3b24, { metalness: 0.4 }));
  rim.position.y = -1.6; st.add(rim);
  const ladder = new THREE.Mesh(new THREE.BoxGeometry(0.6, 9, 0.2), mat(0x999999));
  ladder.position.set(3.5, -6, -4.5); st.add(ladder);
  const glow = new THREE.PointLight(0xffd98a, 40, 40, 1);
  glow.position.set(0, -4, 0); st.add(glow);
  const netMat = new THREE.MeshBasicMaterial({ color: 0x9fd8e8, wireframe: true, transparent: true, opacity: 0.35 });
  for (const x of [-14, 14]) {
    const net = new THREE.Mesh(new THREE.CylinderGeometry(7, 7, 18, 16, 4, true), netMat);
    net.position.set(x, -12, 16); st.add(net);
    COLUMNS.push([x, 16, 7, -21, -3]);
  }
  const name = label('AURORA-ASEMA A-3', 14, '#ffe9a8');
  name.position.set(0, -5, -8); st.add(name);
  world.add(st);
}

// RV Nordlys, sunk on the floor south-west of the station.
function rustyWindowMat() { return new THREE.MeshStandardMaterial({ color: 0x223, emissive: 0x6fb7c9, emissiveIntensity: 0.5 }); }
{
  const w = new THREE.Group();
  const hullMat = mat(0x4a3830, { metalness: 0.4 }), deckMat = mat(0x3a3f45, { metalness: 0.4 });
  const hull = new THREE.Mesh(new THREE.BoxGeometry(56, 10, 13), hullMat);
  hull.position.y = 5; w.add(hull);
  const bow = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 6.5, 10, 3), hullMat);
  bow.rotation.z = Math.PI / 2; bow.rotation.x = Math.PI / 2; bow.position.set(31, 5, 0); w.add(bow);
  const sup = new THREE.Mesh(new THREE.BoxGeometry(18, 7, 10), deckMat);
  sup.position.set(8, 13.5, 0); w.add(sup);
  const bridge = new THREE.Mesh(new THREE.BoxGeometry(10, 4, 9), deckMat);
  bridge.position.set(10, 19, 0); w.add(bridge);
  const win = new THREE.Mesh(new THREE.BoxGeometry(10.2, 1, 9.2), rustyWindowMat());
  win.position.set(10, 19.5, 0); w.add(win);
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 14), deckMat);
  mast.position.set(14, 27, 0); w.add(mast);
  const crane = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 16), mat(0xb59324));
  crane.position.set(-18, 16, 3); crane.rotation.x = -0.6; w.add(crane);
  const name = new THREE.Mesh(new THREE.PlaneGeometry(14, 2.5), new THREE.MeshBasicMaterial({
    map: textTexture('RV NORDLYS', 512, 96, 'bold 70px system-ui, sans-serif', '#d9d2c4'), transparent: true }));
  name.position.set(20, 7, 6.6); w.add(name);
  w.position.set(NX, NY - 1, NZ);
  w.rotation.x = 0.12;
  world.add(w);
  for (let x = -24; x <= 24; x += 8) SPHERES.push([NX + x, NY + 5, NZ, 7]);
  SPHERES.push([NX + 9, NY + 15, NZ, 7]);
}
// Troolari Lumikki, a small fishing boat.
{
  const w = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(22, 6, 7), mat(0x6b2c22, { metalness: 0.3 }));
  hull.position.y = 3; w.add(hull);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 5), mat(0xc8c2b0));
  cab.position.set(-4, 8, 0); w.add(cab);
  w.position.set(LX, LY - 0.5, LZ); w.rotation.set(0.25, 0.6, 0.1);
  world.add(w);
  SPHERES.push([LX - 6, LY + 3, LZ, 4.5], [LX + 6, LY + 3, LZ, 4.5]);
}
// The iceberg hangs from the ice; the cave mouth faces the station.
const icebergMat = new THREE.MeshStandardMaterial({ color: 0xbfe8ff, emissive: 0x1d5a80, emissiveIntensity: 0.5, roughness: 0.4, flatShading: true });
function lump(x, y, z, r, m, seed) {
  const geo = new THREE.IcosahedronGeometry(r, 2), p = geo.attributes.position, rr = rng(seed);
  const bend = new Map();
  for (let i = 0; i < p.count; i++) {
    const k = p.getX(i).toFixed(2) + p.getY(i).toFixed(2) + p.getZ(i).toFixed(2);
    if (!bend.has(k)) bend.set(k, 0.86 + rr() * 0.22);
    const f = bend.get(k);
    p.setXYZ(i, p.getX(i) * f, p.getY(i) * f, p.getZ(i) * f);
  }

// ---- Inside a place --------------------------------------------------------------------------
const S = 4, HGT = 4.4;
const THEMES = {
  wreck: { fog: 0x061219, wall: 0x4a4440, floor: 0x2c2a28, amb: 0x8fb4c8, ambI: 1.5 },
  ice: { fog: 0x0b3f5e, wall: 0xa8daf2, floor: 0x7fb6d2, amb: 0xbfe8ff, ambI: 1.3 },
  crystal: { fog: 0x120a26, wall: 0x2e2648, floor: 0x1e1a30, amb: 0xb090ff, ambI: 1.0 },
};
let room = null, items = [];
const geos = {
  R: new THREE.TorusGeometry(0.35, 0.14, 8, 12), F: new THREE.CylinderGeometry(0.3, 0.3, 0.55, 12),
  L: new THREE.BoxGeometry(0.7, 0.9, 0.12), X: new THREE.CylinderGeometry(0.06, 0.06, 1.6, 6),
  K: new THREE.OctahedronGeometry(0.6, 0), A: new THREE.SphereGeometry(1.5, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
  E: new THREE.TorusGeometry(1.1, 0.12, 8, 24),
};
const mats = {
  R: mat(0x9aa4ad, { metalness: 0.8, roughness: 0.3, emissive: 0x202830 }),
  F: mat(0xe0702a, { emissive: 0x401800 }),
  L: new THREE.MeshStandardMaterial({ color: 0x1c3, emissive: 0x3cff9a, emissiveIntensity: 1.2 }),
  X: mat(0xdddddd, { metalness: 0.8, emissive: 0x335566 }),
  K: crystalMat,
  A: new THREE.MeshStandardMaterial({ color: 0xe6f6ff, metalness: 0.9, roughness: 0.05, transparent: true, opacity: 0.7, side: THREE.DoubleSide }),
  E: new THREE.MeshBasicMaterial({ color: 0xffd65a }),
};
function cellAt(site, x, z) {
  const c = Math.floor(x / S), r = Math.floor(z / S);
  return (site.map[r] && site.map[r][c]) || '#';
}
const isWall = (site, x, z) => cellAt(site, x, z) === '#';
function findCell(site, ch) {
  for (let r = 0; r < site.map.length; r++) { const c = site.map[r].indexOf(ch); if (c >= 0) return [c, r]; }
  return null;
}
function buildRoom(site) {
  if (room) { inside.remove(room); room.traverse(o => { if (o.geometry && !Object.values(geos).includes(o.geometry)) o.geometry.dispose(); }); }
  room = new THREE.Group();
  const th = THEMES[site.theme], rows = site.map.length, cols = site.map[0].length, rr = rng(site.id.length * 97 + 3);
  inside.fog = new THREE.FogExp2(th.fog, site.theme === 'ice' ? 0.05 : 0.07);
  inside.background = new THREE.Color(th.fog);
  room.add(new THREE.AmbientLight(th.amb, th.ambI));
  const open = (c, r) => site.map[r] && site.map[r][c] && site.map[r][c] !== '#';
  const walls = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (open(c, r)) continue;
    let near = false;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (open(c + dc, r + dr)) near = true;
    if (near) walls.push([c, r]);
  }
  const rough = site.theme !== 'wreck';
  const wm = new THREE.InstancedMesh(new THREE.BoxGeometry(S, HGT + 1, S), mat(th.wall, { flatShading: true, roughness: rough ? 0.5 : 0.8, metalness: rough ? 0 : 0.4 }), walls.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  walls.forEach(([c, r], i) => {
    const j = rough ? 1 : 0;
    q.setFromEuler(e.set(0, rough ? rr() * 0.5 : 0, 0));
    wm.setMatrixAt(i, m.compose(v.set(c * S + S / 2, HGT / 2, r * S + S / 2), q, sc.set(1 + j * rr() * 0.15, 1, 1 + j * rr() * 0.15)));
  });
  room.add(wm);
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(cols * S, rows * S), mat(th.floor, { roughness: 1 }));
  fl.rotation.x = -Math.PI / 2; fl.position.set(cols * S / 2, 0, rows * S / 2); room.add(fl);
  const ce = fl.clone(); ce.rotation.x = Math.PI / 2; ce.position.y = HGT; room.add(ce);
  // Decoration: crates and pipes in wrecks, icicles in the ice, crystals in the crystal cave.
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    if (site.map[r][c] !== '.' || rr() > 0.45) continue;
    const x = c * S + 0.8 + rr() * 2.4, z = r * S + 0.8 + rr() * 2.4;
    let d;
    if (site.theme === 'wreck') {
      d = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.9), mat(rr() < 0.5 ? 0x6b4a2a : 0x34506a));
      d.position.set(x, 0.35, z); d.rotation.y = rr();
      if (rr() < 0.5) {
        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, S), mat(0x6a5a50, { metalness: 0.6 }));
        pipe.rotation.z = Math.PI / 2; pipe.position.set(c * S + S / 2, HGT - 0.3, z); room.add(pipe);
      }
    } else if (site.theme === 'ice') {
      d = new THREE.Mesh(new THREE.ConeGeometry(0.25 + rr() * 0.2, 0.8 + rr() * 1.2, 6), mat(0xe8f8ff, { roughness: 0.2, emissive: 0x204a66 }));
      d.rotation.x = Math.PI; d.position.set(x, HGT - 0.6, z);
    } else {
      d = new THREE.Mesh(crystalGeo, crystalMat);
      d.scale.set(0.3, 0.7 + rr() * 0.8, 0.3); d.position.set(x, 0.6, z); d.rotation.set(rr() - 0.5, 0, rr() - 0.5);
    }
    room.add(d);
  }
  if (site.theme !== 'wreck') {
    const pl = new THREE.PointLight(site.theme === 'ice' ? 0x7fd8ff : 0xa070ff, 30, 30, 1);
    pl.position.set(cols * S / 2, HGT - 0.5, rows * S / 2); room.add(pl);
  }
  for (const [c, r, t] of site.labels || []) {
    const l = label(t, 3.6, '#ffe9a8');
    l.position.set(c * S + S / 2, HGT - 0.7, r * S + S / 2); room.add(l);
  }
  items = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const k = site.map[r][c];
    if ('RFLXKAE'.indexOf(k) < 0) continue;
    const id = site.id + ':' + c + ',' + r;
    if (G.s.taken[id]) continue;
    const me = new THREE.Mesh(geos[k], mats[k]);
    const x = c * S + S / 2, z = r * S + S / 2;
    if (k === 'A') { me.position.set(x, HGT - 0.05, z); me.rotation.x = Math.PI; }
    else if (k === 'E') { me.position.set(x, 1.8, z); }
    else me.position.set(x, 1.3, z);
    if (k === 'K' || k === 'L' || k === 'X') {
      const pl = new THREE.PointLight(k === 'K' ? 0xb07bff : 0x7fffd4, 14, 10, 1);
      pl.position.set(x, 2, z); room.add(pl);
      me.userData.light = pl;
    }
    if (k === 'E') { const l = label('SISU', 2.4, '#ffd65a'); l.position.set(x, 3.4, z); room.add(l); }
    room.add(me);
    items.push({ id, k, c, r, x, z, mesh: me });
  }
  inside.add(room);
}

// ---- Panels, toasts and sounds ------------------------------------------------------------------
function panel(title, parts, buttons) {
  const card = $('card');
  card.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = title; card.appendChild(h);
  for (const p of parts) {
    if (!p) continue;
    const el = document.createElement('p');
    if (typeof p === 'string') el.textContent = p; else { el.textContent = p.t; el.className = p.cls; }
    card.appendChild(el);
  }
  for (const b of buttons) {
    const el = document.createElement('button');
    el.textContent = b.t; if (b.cls) el.className = b.cls; el.disabled = !!b.off;
    el.addEventListener('click', () => { sfx('tap'); if (b.keep) b.fn(); else { closePanel(); b.fn && b.fn(); } });
    card.appendChild(el);
  }
  $('panel').classList.remove('hidden');
  card.scrollTop = 0;
  G.paused = true;
}
function closePanel() { $('panel').classList.add('hidden'); G.paused = false; }
let toastT = 0;
function toast(t, secs = 2.2) { $('toast').textContent = t; $('toast').classList.remove('hidden'); toastT = secs; }
function flash() { const f = $('fade'); f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on'))); }

let ac = null;
function sfx(kind) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.connect(g); g.connect(ac.destination);
  const tone = (type, f0, f1, vol, len) => {
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len); o.start(t); o.stop(t + len + 0.02);
  };
  if (kind === 'ping') tone('sine', 1400, 1350, 0.05, 1.2);
  else if (kind === 'pick') tone('triangle', 660, 1320, 0.12, 0.25);
  else if (kind === 'bump') tone('sine', 120, 40, 0.3, 0.4);
  else if (kind === 'alarm') tone('square', 520, 380, 0.05, 0.35);
  else if (kind === 'story') tone('sine', 440, 880, 0.12, 0.8);
  else tone('sine', 700, 600, 0.04, 0.08);
}

// ---- Moving between SISU and a place ------------------------------------------------------------
function enterSite(id) {
  const site = SITES[id];
  if (G.mode === 'sub') saveGame();   // keep SISU where it is now, outside this place
  G.site = site; G.mode = 'dive';
  G.s.m.air = 100;
  buildRoom(site);
  const [c, r] = findCell(site, 'E');
  diver.pos.set(c * S + S / 2, 1.8, r * S + S / 2);
  for (const [dc, dr] of [[1, 0], [0, 1], [-1, 0], [0, -1]]) {
    if (site.map[r + dr] && site.map[r + dr][c + dc] === '.') {
      diver.yaw = Math.atan2(-dc, -dr);
      diver.pos.x += dc * S * 0.8; diver.pos.z += dr * S * 0.8;
      break;
    }
  }
  saveGame();
  flash();
  toast(site.name, 2.5);
}
function leaveSite() {
  G.mode = 'sub'; G.site = null;
  flash();
  saveGame();
}
function currentAction() {
  if (G.mode === 'sub') {
    const p = sub.pos;
    if (Math.hypot(p.x - DOCK.x, p.z - DOCK.z) < 12 && p.y > -20) return { t: 'Telakoidu asemalle', fn: dock };
    for (const id in SITES) {
      const d = SITES[id].door;
      if (p.distanceTo(d) < 15) return { t: 'Sukella ulos: ' + SITES[id].name, fn: () => enterSite(id) };
    }
  } else if (G.mode === 'dive') {
    const e = items.find(i => i.k === 'E');
    if (e && Math.hypot(diver.pos.x - e.x, diver.pos.z - e.z) < 2.2) return { t: 'Palaa SISUun', fn: leaveSite };
  }
  return null;
}
function take(it) {
  const s = G.s, site = G.site;
  if (it.k === 'A' || it.k === 'E') return;
  s.taken[it.id] = true;
  room.remove(it.mesh);
  if (it.mesh.userData.light) room.remove(it.mesh.userData.light);
  items.splice(items.indexOf(it), 1);
  if (it.k === 'R') { s.inv.romu++; toast('+1 romu 🔩'); sfx('pick'); }
  else if (it.k === 'F') { s.inv.ruoka++; toast('+1 ruoka 🥫'); sfx('pick'); }
  else if (it.k === 'L') {
    s.flags[site.id + 'Log'] = true; sfx('story');
    panel(site.logTitle, [{ t: site.log, cls: 'log' }, goal().t], [{ t: 'Jatka', cls: 'go' }]);
  } else if (it.k === 'X') {
    s.inv.antenni = 1; sfx('story');
    panel('Radion antenni', ['Löysit Aurora-aseman radiomaston antennin. Sen voi kiinnittää takaisin mastoon.'], [{ t: 'Jatka', cls: 'go' }]);
  } else if (it.k === 'K') {
    s.inv.kristalli = 1; sfx('story');
    panel('Hehkuva kristalli', ['Kristalli on lämmin ja hehkuu violettia valoa. Tällä radio saa virtaa! Vie se Aurora-asemalle.'], [{ t: 'Jatka', cls: 'go' }]);
  }
  saveGame();
}

function hullOut() {

// ---- The world step ---------------------------------------------------------------------------
const tmp = new THREE.Vector3(), tmp2 = new THREE.Vector3();
function hurt(amount, why) {
  G.s.m.hull = Math.max(0, G.s.m.hull - amount);
  sfx('bump'); toast(why);
  if (G.s.m.hull <= 0) hullOut();
}
function collideSub() {
  const p = sub.pos, v = sub.vel, R = 2.4;
  let impact = 0;
  const push = (nx, ny, nz, depth) => {
    p.x += nx * depth; p.y += ny * depth; p.z += nz * depth;
    const vn = v.x * nx + v.y * ny + v.z * nz;
    if (vn < 0) { impact = Math.max(impact, -vn); v.x -= vn * nx; v.y -= vn * ny; v.z -= vn * nz; }
  };
  const fy = floorY(p.x, p.z) + R;
  if (p.y < fy) push(0, 1, 0, fy - p.y);
  if (p.y > CEIL) { if (v.y > 0) v.y = 0; p.y = CEIL; }
  for (const [x, y, z, r] of SPHERES) {
    tmp.set(p.x - x, p.y - y, p.z - z);
    const d = tmp.length();
    if (d < r + R && d > 0.001) push(tmp.x / d, tmp.y / d, tmp.z / d, r + R - d);
  }
  for (const [x, z, r, y0, y1] of COLUMNS) {
    if (p.y < y0 - R || p.y > y1 + R) continue;
    const dx = p.x - x, dz = p.z - z, d = Math.hypot(dx, dz);
    if (d < r + R && d > 0.001) push(dx / d, 0, dz / d, r + R - d);
  }
  if (p.x < BOUND.x0 || p.x > BOUND.x1 || p.z < BOUND.z0 || p.z > BOUND.z1) {
    p.x = clamp(p.x, BOUND.x0, BOUND.x1); p.z = clamp(p.z, BOUND.z0, BOUND.z1); v.multiplyScalar(0.3);
    if (G.warnT <= 0) { toast('Liian kaukana – käänny takaisin'); G.warnT = 3; }
  }
  if (impact > 5) hurt(Math.round((impact - 5) * 3), 'Kolahdus! Runko kärsii');
}
function stepSub(dt) {
  const s = G.s, m = s.m;
  const slow = (m.power <= 0 ? 0.35 : 1) * (m.food <= 0 ? 0.7 : 1);
  sub.yaw -= input.x * 1.3 * dt;
  const fx = -Math.sin(sub.yaw), fz = -Math.cos(sub.yaw), thrust = input.y * 12 * slow;
  const k = Math.min(1, 1.4 * dt);
  sub.vel.x += (fx * thrust - sub.vel.x) * k;
  sub.vel.z += (fz * thrust - sub.vel.z) * k;
  const vy = ((input.up ? 1 : 0) - (input.down ? 1 : 0)) * 6 * slow;
  sub.vel.y += (vy - sub.vel.y) * Math.min(1, 2.5 * dt);
  sub.pos.addScaledVector(sub.vel, dt);
  collideSub();
  if (G.mode !== 'sub') return;
  m.power = clamp(m.power - (Math.abs(input.y) * 0.35 + (vy ? 0.12 : 0)) * dt + 0.12 * dt, 0, 100);
  // Food: a school of fish or the kelp forest fills the larder.
  for (const sc of SCHOOLS) {
    if (sub.pos.distanceTo(sc) < 10 && (s.cool[sc.id] || 0) <= s.t) {
      s.cool[sc.id] = s.t + 60; s.inv.ruoka++; toast('Kalaverkko: +1 ruoka 🐟'); sfx('pick');
    }
  }
  if (Math.hypot(sub.pos.x - KELP.x, sub.pos.z - KELP.z) < KELP.r && sub.pos.y < floorY(sub.pos.x, sub.pos.z) + 22 && (s.cool.kelp || 0) <= s.t) {
    s.cool.kelp = s.t + 45; s.inv.ruoka++; toast('Merilevää: +1 ruoka 🌿'); sfx('pick');
  }
  stepSquid(dt);
  G.saveT -= dt;
  if (G.saveT <= 0) { G.saveT = 20; saveGame(); }
}
function stepSquid(dt) {
  const q = squid, d = q.pos.distanceTo(sub.pos);
  q.t -= dt;
  if (q.state === 'patrol') {
    q.a += 0.15 * dt;
    tmp.set(q.home.x + Math.cos(q.a) * 38, q.home.y + Math.sin(q.a * 2) * 4, q.home.z + Math.sin(q.a) * 38);
    if (d < 28 && sub.pos.distanceTo(q.home) < 90) q.state = 'chase';
  } else if (q.state === 'chase') {
    tmp.copy(sub.pos);
    if (sub.pos.distanceTo(q.home) > 90 || d > 45) q.state = 'patrol';
    if (d < 6.5) {
      tmp2.subVectors(sub.pos, q.pos).normalize();
      sub.vel.addScaledVector(tmp2, 12);
      q.state = 'back'; q.t = 6;
      hurt(20, 'Jättikalmari tarrasi SISUun! Runko -20');
    }
  } else {
    tmp.copy(q.home);
    if (q.t <= 0) q.state = 'patrol';
  }
  const speed = q.state === 'chase' ? 8 : q.state === 'back' ? 10 : 5;
  tmp2.subVectors(tmp, q.pos);
  const len = tmp2.length();
  if (len > 0.1) q.pos.addScaledVector(tmp2, Math.min(len, speed * dt) / len);
  if (d < 70 && G.warnT <= 0 && q.state !== 'back') { toast('Varo jättikalmaria!'); sfx('alarm'); G.warnT = 6; }
}
function stepDive(dt) {
  const s = G.s, site = G.site, slow = s.m.food <= 0 ? 0.7 : 1;
  diver.yaw -= input.x * 2.0 * dt;
  const sp = input.y * 3.4 * slow, R = 0.55;
  const nx = diver.pos.x - Math.sin(diver.yaw) * sp * dt, nz = diver.pos.z - Math.cos(diver.yaw) * sp * dt;
  const free = (x, z) => !isWall(site, x - R, z - R) && !isWall(site, x + R, z - R) && !isWall(site, x - R, z + R) && !isWall(site, x + R, z + R);
  if (free(nx, diver.pos.z)) diver.pos.x = nx;
  if (free(diver.pos.x, nz)) diver.pos.z = nz;
  diver.pos.y = clamp(diver.pos.y + ((input.up ? 1 : 0) - (input.down ? 1 : 0)) * 2.2 * dt, 0.5, HGT - 0.5);
  const cell = cellAt(site, diver.pos.x, diver.pos.z);
  if (cell === 'A') {
    if (s.m.air < 99 && G.warnT <= 0) { toast('Ilmatasku: hengität vapaasti 🫧'); G.warnT = 3; }
    s.m.air = Math.min(100, s.m.air + 40 * dt);
  } else {
    s.m.air -= (s.m.food <= 0 ? 2 : 1.3) * dt;
  }
  for (const it of items.slice()) {
    if ('AE'.includes(it.k)) continue;
    if (Math.hypot(diver.pos.x - it.x, diver.pos.z - it.z) < 1.5 && Math.abs(diver.pos.y - 1.3) < 1.8) take(it);
  }
  if (s.m.air < 25 && G.warnT <= 0) { toast('Ilma vähissä! Palaa SISUun 🫁'); sfx('alarm'); G.warnT = 5; }
  if (s.m.air <= 0) { s.m.air = 0; airOut(); }
}
function step(dt) {
  const s = G.s;
  s.t += dt;
  G.warnT -= dt;
  s.m.food = Math.max(0, s.m.food - 0.18 * dt);
  if (s.m.food <= 0 && !s.hungry) { s.hungry = true; toast('Nälkä! Syö jotain 🎒', 3); }
  if (G.mode === 'sub') stepSub(dt); else if (G.mode === 'dive') stepDive(dt);
}

// ---- Drawing ----------------------------------------------------------------------------------
const deep = new THREE.Color(0x020b16), shallow = new THREE.Color(0x1a6f96), fogC = new THREE.Color();
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let clock = 0, menuA = 0;
function animateWorld(dt) {
  // Kelp sway, fish circling, the door lights, the squid's arms, the goal beacon, marine snow.
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v = new THREE.Vector3(), sc = new THREE.Vector3();
  kelp.forEach((k, i) => {
    q.setFromEuler(e.set(Math.sin(clock * 0.8 + k.ph) * 0.12, k.yaw, Math.cos(clock * 0.6 + k.ph) * 0.12));
    kelpMesh.setMatrixAt(i, m.compose(v.set(k.x, k.y, k.z), q, sc.set(1, k.h, 1)));
  });
  kelpMesh.instanceMatrix.needsUpdate = true;
  SCHOOLS.forEach((s, j) => {
    for (let i = 0; i < FISH; i++) {
      const a = clock * 0.5 + i * 0.7 + j, r = 3 + (i % 5) * 0.9;
      v.set(s.x + Math.cos(a) * r, s.y + Math.sin(i * 1.7 + clock) * 1.5, s.z + Math.sin(a) * r);
      q.setFromEuler(e.set(0, -a, 0));
      fishMesh.setMatrixAt(j * FISH + i, m.compose(v, q, sc.set(1, 1, 1)));
    }
  });
  fishMesh.instanceMatrix.needsUpdate = true;
  const blink = Math.sin(clock * 4) > 0;
  doorLights.forEach(d => { d.visible = blink; });
  squid.group.position.copy(squid.pos);
  tmp.set(squid.pos.x + (squid.pos.x - (squid.prev || squid.pos).x), squid.pos.y, squid.pos.z + (squid.pos.z - (squid.prev || squid.pos).z));
  if (squid.prev && squid.prev.distanceToSquared(squid.pos) > 1e-6) squid.group.lookAt(tmp);
  squid.prev = squid.pos.clone();
  squid.arms.forEach((a, i) => { a.rotation.x = -Math.PI / 2 + Math.sin(clock * 3 + i) * 0.25; });
  const gl = goal();
  beacon.visible = !!gl.at && G.mode !== 'menu';
  if (gl.at) beacon.position.set(gl.at.x, gl.at.y + 10, gl.at.z);
  beacon.material.opacity = 0.2 + Math.sin(clock * 3) * 0.08;
  for (let i = 0; i < SNOW; i++) {
    for (let k = 0; k < 3; k++) {
      const cp = k === 0 ? camera.position.x : k === 1 ? camera.position.y : camera.position.z;
      const drift = k === 1 ? -clock * 0.3 : clock * 0.2;
      snowPos[i * 3 + k] = cp + ((((snowBase[i * 3 + k] + drift - cp) % 60) + 60) % 60) - 30;
    }
  }
  snowGeo.attributes.position.needsUpdate = true;
  fogC.copy(shallow).lerp(deep, clamp(-camera.position.y / 110, 0, 1));
  world.fog.color.copy(fogC); world.background.copy(fogC);
}
function drawSub(dt) {
  const g = sub.group;
  g.position.copy(sub.pos);
  g.rotation.set(clamp(sub.vel.y * 0.05, -0.3, 0.3), sub.yaw, -input.x * 0.15 * Math.min(1, Math.abs(input.y) + 0.3), 'YXZ');
  sub.prop.rotation.z += dt * (2 + Math.abs(input.y) * 14);
  const fx = -Math.sin(sub.yaw), fz = -Math.cos(sub.yaw);
  camPos.set(sub.pos.x - fx * 17, sub.pos.y + 6.5, sub.pos.z - fz * 17);
  camPos.y = Math.max(camPos.y, floorY(camPos.x, camPos.z) + 1.5);
  camPos.y = Math.min(camPos.y, -1.8);
  camera.position.lerp(camPos, Math.min(1, dt * 4));
  camLook.set(sub.pos.x + fx * 22, sub.pos.y - 1, sub.pos.z + fz * 22);
  camera.lookAt(camLook);
}
function drawDiver(dt) {
  const site = G.site;
  diver.group.position.copy(diver.pos);
  diver.group.rotation.set(0, diver.yaw, 0);
  diver.legs.forEach((l, i) => { l.rotation.x = Math.PI / 2 + Math.sin(clock * (4 + Math.abs(input.y) * 6) + i * Math.PI) * 0.3; });
  const fx = -Math.sin(diver.yaw), fz = -Math.cos(diver.yaw);
  // The camera stays behind the diver but never inside a wall.
  let dist = 0;
  while (dist < 3.4) {
    const nd = dist + 0.2;
    if (isWall(site, diver.pos.x - fx * nd, diver.pos.z - fz * nd)) break;
    dist = nd;
  }
  dist = Math.max(0.6, dist - 0.4);
  camPos.set(diver.pos.x - fx * dist, clamp(diver.pos.y + 1.4, 0.4, HGT - 0.3), diver.pos.z - fz * dist);
  camera.position.lerp(camPos, Math.min(1, dt * 6));
  camLook.set(diver.pos.x + fx * 6, diver.pos.y + 0.2, diver.pos.z + fz * 6);
  camera.lookAt(camLook);
  for (const it of items) {
    if (it.k === 'A') continue;
    if (it.k === 'E') it.mesh.rotation.y = clock;
    else { it.mesh.rotation.y = clock * 1.5; it.mesh.position.y = 1.3 + Math.sin(clock * 2 + it.c) * 0.15; }
  }
}

let hudT = 0;

  setMeter('mPower', m.power); setMeter('mFood', m.food); setMeter('mHull', m.hull);
  $('goal').innerHTML = '';
  const b = document.createElement('b'); b.textContent = 'Tavoite: '; $('goal').append(b, gl.t);
  const arrow = $('arrow');
  if (diving) {
    arrow.textContent = '🤿'; arrow.style.transform = '';
    $('where').textContent = G.site.name;
  } else if (gl.at) {
    const dx = gl.at.x - sub.pos.x, dz = gl.at.z - sub.pos.z, fx = -Math.sin(sub.yaw), fz = -Math.cos(sub.yaw);
    const ang = Math.atan2(dx * -fz + dz * fx, dx * fx + dz * fz);
    arrow.textContent = '⬆'; arrow.style.transform = `rotate(${ang}rad)`;
    const dy = gl.at.y - sub.pos.y;
    $('where').textContent = `${Math.round(Math.hypot(dx, dz))} m` + (Math.abs(dy) > 6 ? (dy < 0 ? ' ▼' : ' ▲') : '') + `\nsyvyys ${Math.round(-sub.pos.y)} m`;
  } else {
    arrow.textContent = '★'; arrow.style.transform = '';
    $('where').textContent = `syvyys ${Math.round(-sub.pos.y)} m`;
  }
  $('where').style.whiteSpace = 'pre';
  const a = G.paused ? null : currentAction();
  $('act').classList.toggle('hidden', !a);
  if (a) $('act').textContent = a.t;
  $('bag').classList.toggle('hidden', G.mode !== 'sub');
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

// ---- Controls ---------------------------------------------------------------------------------
{
  const st = $('stick'), knob = $('knob');
  let id = null;
  const move = e => {
    const r = st.getBoundingClientRect(), R = r.width / 2 - 14;
    let x = (e.clientX - r.left - r.width / 2) / R, y = (e.clientY - r.top - r.height / 2) / R;
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    input.x = Math.abs(x) < 0.12 ? 0 : x; input.y = Math.abs(y) < 0.12 ? 0 : -y;
    knob.style.transform = `translate(${x * R}px, ${y * R}px)`;
  };
  const end = e => { if (e.pointerId !== id) return; id = null; input.x = input.y = 0; knob.style.transform = ''; };
  st.addEventListener('pointerdown', e => { id = e.pointerId; st.setPointerCapture(id); move(e); });
  st.addEventListener('pointermove', e => { if (e.pointerId === id) move(e); });
  st.addEventListener('pointerup', end); st.addEventListener('pointercancel', end);
  for (const [bid, key] of [['up', 'up'], ['down', 'down']]) {
    const b = $(bid);
    const on = v => e => { e.preventDefault(); input[key] = v; b.classList.toggle('on', v); };
    b.addEventListener('pointerdown', on(true));
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, on(false));
  }
  const keys = {};
  const kb = () => {
    input.x = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    input.y = (keys.ArrowUp || keys.w ? 1 : 0) - (keys.ArrowDown || keys.s ? 1 : 0);
    input.up = !!(keys.e || keys[' ']); input.down = !!(keys.q || keys.Shift);
  };
  addEventListener('keydown', e => { keys[e.key] = true; kb(); if (e.key === 'Enter') act(); });
  addEventListener('keyup', e => { keys[e.key] = false; kb(); });
}
function act() { const a = currentAction(); if (a && !G.paused) { sfx('tap'); a.fn(); } }
$('act').addEventListener('click', act);
$('bag').addEventListener('click', () => { if (G.mode === 'sub' && !G.paused) bagPanel(); });

function startAudio() {
  if (ac) return;
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
}
function play() {
  $('menu').classList.add('hidden');
  ['hud', 'pad'].forEach(id => $(id).classList.remove('hidden'));
  G.mode = 'sub'; G.paused = false;
  const p = G.s.sub;
  sub.pos.set(p.x, p.y, p.z); sub.yaw = p.yaw; sub.vel.set(0, 0, 0);
  camera.position.set(p.x + Math.sin(p.yaw) * 13, p.y + 4, p.z + Math.cos(p.yaw) * 13);
}
function newGame() {
  startAudio();
  G.s = fresh();
  play();
  saveGame();
  sfx('story');
  panel('Jään alla – Luku 1', [
    'Olet SISU-sukellusveneen ainoa miehistön jäsen. Aurora-asema A-3 lakkasi vastaamasta radioon viikko sitten, ja sinut lähetettiin selvittämään, mitä tapahtui.',
    'SISUn reaktori antaa virtaa, mutta pidä huolta ruoasta ja rungosta. Sukeltaessasi hylkyihin ja luoliin seuraa ilmaa!',
    'Seuraa valopatsasta ja ylälaidan nuolta. Asema on aivan edessäsi.',
  ], [{ t: 'Sukella!', cls: 'go' }]);
}
function continueGame() { startAudio(); G.s = loadSave() || fresh(); play(); }
function showMenu() {
  G.mode = 'menu';
  const saved = loadSave();
  $('jatka').classList.toggle('hidden', !saved);
  $('uusi').textContent = 'Uusi peli';
  $('uusi').dataset.sure = saved ? '' : '1';
  $('menuText').textContent = saved && saved.flags.radio
    ? 'Luku 1 on pelattu läpi. Voit jatkaa merellä tai aloittaa alusta.'
    : 'Aurora-asema on vaiennut. Ohjaa SISU-sukellusvene jään alle ja selvitä, mitä tapahtui.';
  $('menu').classList.remove('hidden');
}
$('jatka').addEventListener('click', continueGame);
$('uusi').addEventListener('click', () => {
  if (!$('uusi').dataset.sure) { $('uusi').dataset.sure = '1'; $('uusi').textContent = 'Aloitetaanko alusta? Paina uudelleen'; return; }
  newGame();
});

let last = performance.now();
showMenu();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  clock += dt;
  if (G.mode !== 'menu' && !G.paused && !G.hold) step(dt);
  if (toastT > 0) { toastT -= dt; if (toastT <= 0) $('toast').classList.add('hidden'); }
  if (G.mode === 'dive') {
    drawDiver(dt);
    camera.updateMatrixWorld();   // the camera lives in the sea scene, so update it by hand here
    renderer.render(inside, camera);
  } else {
    if (G.mode === 'menu') drawMenu(dt); else drawSub(dt);
    animateWorld(dt);
    renderer.render(world, camera);
  }
  hudT -= dt;
  if (G.mode !== 'menu' && hudT <= 0) { hudT = 0.1; drawHud(); }
  window.drawn = true;
});

// For tests and the curious: the game as it is.
Object.assign(window, { G, input, sub, diver, squid, SITES, DOCK, step, goal, act, currentAction, enterSite, leaveSite,
  dock, newGame, continueGame, saveGame, loadSave, isWall, floorY, drawHud, SCHOOLS, KELP });
Object.defineProperty(window, 'items', { get: () => items });
}
</script>
