<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Marjakori</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#17352b;color:#fff;font-family:system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:50px 22px 25px;background:rgba(13,42,31,.88);text-align:center;touch-action:manipulation}#menu.hidden{display:none}h1{margin:0;font-size:42px;color:#ffdb73;text-shadow:0 3px #855a2d}p{margin:0}.result{font-weight:800;font-size:22px}.help{max-width:340px;line-height:1.45;color:#d2e5cb}.go,.levels button{border:0;border-radius:15px;background:#ffcf57;color:#3b2a12;font:800 21px system-ui;padding:14px 28px;box-shadow:0 4px #a67524}.go:active,.levels button:active{transform:translateY(3px);box-shadow:0 1px #a67524}.levels{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:350px}.levels button{font-size:15px;padding:8px 11px}.small{font-size:14px;color:#c9ddc7}@media (orientation:landscape) and (max-height:520px){#menu{display:grid;grid-template-columns:minmax(250px,1fr) minmax(250px,1fr);align-content:center;gap:8px 35px;padding:32px 35px}h1{font-size:36px}.help{grid-row:1/6;grid-column:2}.levels{max-width:300px}.go{padding:10px 23px}}
</style></head>
<body>
<canvas id="c"></canvas><div id="menu"><h1>🧺 Marjakori</h1><p class="result" id="result"></p><p id="progress"></p><button class="go" id="go">Aloita</button><div class="levels" id="levels"></div><p class="help">Pyyhkäise kuvio viereisen kanssa paikkaa vaihtamaan. Kerää tavoite ennen kuin siirrot loppuvat. Neljä tekee puuskan, viisi tai risteys kimalluksen.</p><p class="small">Napauta myös kahta vierekkäistä kuviota.</p></div>
<script src="../../../lib/aanet-5/aanet.js"></script><script src="../../../scores.js" data-game="marjakori" data-order="high" data-corner="bottom-right"></script><script src="logiikka.js"></script><script src="piirto.js"></script>
<script>
'use strict';
var c=document.getElementById('c'),ctx=c.getContext('2d'),menu=document.getElementById('menu'),result=document.getElementById('result'),progress=document.getElementById('progress'),go=document.getElementById('go'),levels=document.getElementById('levels');
var KEY='ai-pelit:marjakori:',state=null,selected=-1,pointer=null,boardBox=null,W=0,H=0,DPR=1;
function load(k,d){try{var v=localStorage.getItem(KEY+k);return v===null?d:JSON.parse(v)}catch(e){return d}}function save(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
var level=Math.max(1,Math.floor(load('taso',1)||1)),best=load('parhaat',{});function resize(){var r=c.getBoundingClientRect();DPR=devicePixelRatio||1;W=r.width;H=r.height;c.width=W*DPR;c.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function sound(name,o){if(window.AiPelitAanet)AiPelitAanet.play(name,o||{vol:.18})}if(window.AiPelitAanet)AiPelitAanet.load(['valinta','onnistui']);
function saveRound(){if(state)save('kierros',{level:state.level,seed:state.seed,randomState:state.random.state(),board:state.board,moss:state.moss,goals:state.goals,moves:state.moves,target:state.target,left:state.left,mossLeft:state.mossLeft,score:state.score,phase:state.phase})}function restore(){var r=load('kierros',null);if(r&&r.phase==='play'){state=Marjakori.newLevel(r.level,r.seed);Object.assign(state,r);if(r.randomState!==undefined)state.random.set(r.randomState);return true}return false}function totalBest(){return Object.keys(best).reduce(function(n,k){return n+(+best[k]||0)},0)}
function openMenu(message){menu.classList.remove('hidden');result.textContent=message||'';progress.textContent='Jatka: taso '+level+' · paras yhteensä '+totalBest()+' p';go.textContent=restore()?'Jatka peliä':'Aloita taso '+level;levels.innerHTML='';for(var n=1;n<=Math.min(level,12);n++){var b=document.createElement('button');b.textContent='Taso '+n;b.onclick=(function(q){return function(){start(q)}})(n);levels.appendChild(b)}}function start(n){state=Marjakori.newLevel(n||level,((Date.now()^((n||level)*7919))>>>0));selected=-1;menu.classList.add('hidden');saveRound();sound('valinta',{vol:.14})}
function cellAt(px,py){if(!boardBox)return-1;var x=Math.floor((px-boardBox.x)/boardBox.size),y=Math.floor((py-boardBox.y)/boardBox.size);return x>=0&&x<7&&y>=0&&y<7?y*7+x:-1}function finish(){var won=state.phase==='win';if(won){best[state.level]=Math.max(best[state.level]||0,state.score);save('parhaat',best);level=Math.max(level,state.level+1);save('taso',level);save('kierros',null);AiPelitScores.submit(totalBest());sound('onnistui',{vol:.28});openMenu('Taso läpi! '+state.score+' p')}else if(state.phase==='lose'){save('kierros',null);openMenu('Siirrot loppuivat — yritä uudelleen!')}}function play(a,b){var r=Marjakori.trySwap(state,a,b);if(r.ok){selected=-1;saveRound();sound('valinta',{vol:.12});if(state.phase!=='play')finish()}else selected=-1}
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,W,H);if(!state||state.phase!=='play')return;var side=Math.min(W-20,H-145),bx=(W-side)/2,by=H<520?(H-side)/2+20:Math.max(96,(H-side)/2-20);boardBox=MarjakoriPiirto.draw(ctx,state,{x:bx,y:by,w:side,h:side},selected);ctx.fillStyle='#eff5dc';ctx.font='700 17px system-ui';ctx.textAlign='center';ctx.fillText('Taso '+state.level+' · Siirtoja '+state.moves+' · '+MarjakoriPiirto.names[state.target]+': '+state.left+(state.mossLeft?' · sammal: '+state.mossLeft:''),W/2,by-24);ctx.fillStyle='#d4e9c9';ctx.font='14px system-ui';ctx.fillText('Pisteet '+state.score+(state.chain?' · ketju ×'+Math.min(5,state.chain+1):''),W/2,by+side+25)}draw();
c.addEventListener('pointerdown',function(e){if(!state||state.phase!=='play')return;pointer={x:e.clientX,y:e.clientY,cell:cellAt(e.clientX,e.clientY)};c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',function(e){if(!pointer||pointer.cell<0)return;var dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.max(Math.abs(dx),Math.abs(dy))<boardBox.size*.28)return;var p={x:pointer.cell%7,y:Math.floor(pointer.cell/7)},q=Math.abs(dx)>Math.abs(dy)?p.y*7+p.x+(dx>0?1:-1):(p.y+(dy>0?1:-1))*7+p.x;if(q>=0&&q<49&&Math.abs((q%7)-p.x)+Math.abs(Math.floor(q/7)-p.y)===1)play(pointer.cell,q);pointer=null});c.addEventListener('pointerup',function(e){if(!pointer)return;var q=cellAt(e.clientX,e.clientY);if(q>=0){if(selected<0)selected=q;else if(selected!==q)play(selected,q);else selected=-1}pointer=null});go.onclick=function(){if(!restore())start(level);else{menu.classList.add('hidden');selected=-1}};openMenu('');
</script><script src="../../../back.js"></script></body></html>
