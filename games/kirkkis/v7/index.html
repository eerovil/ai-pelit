const statsP = Object.assign({ kierrokset: 0, selvisit: 0, loydettiin: 0, loysit: 0 }, load('tilasto-piilosta', {}));
const statsH = Object.assign({ kierrokset: 0, selvisit: 0, jait: 0, hippasit: 0 }, load('tilasto-hippa', {}));

// ---------- The places to play, in metres (y grows down the screen) ----------
const BASE_POLE = 0.3, BASE_REACH = 1.4;
const BODY = 0.36;               // a player's radius
const FOV = 110 * Math.PI / 180; // the field of view, and how far it reaches
const RANGE = 10, NEAR = 1.3;    // anyone this close is heard and seen, whichever way you look
const BUSH_SEEN = 2.4;           // someone inside a bush is seen only from this close
const HEAR = 7, LOUD = 2.6;      // running faster than LOUD m/s is heard this far, through walls (v6, #109)

// Sprint (v7, #137): half as fast again, for three seconds on a full breath, which comes back in five.

// Hippa: a touch is this close; the new "it" waits FREEZE s, and cannot tag back the one who tagged them for NO_BACK s.
// Piilosta: the seeker must be this close to tell who it is ("Löysin Ainon!"); farther off it is only a shape.

const TAG = 2 * BODY + 0.2, FREEZE = 1.5, NO_BACK = 3;

// Each map (v6, #109): its size, its base, solid things (which block both walking and sight) and

const row = (n, d, s) => Array.from({ length: n }, (_, i) => Object.assign({}, s, { x: s.x + i * d }));
const MAPS = {

      g.fillRect(17, 16, 2, 14); g.fillRect(17.5, 30, 1, 16); g.fillRect(18, 11, 13, 1.4); g.fillRect(25, 11, 1.4, 6);

};
const MAP_IDS = Object.keys(MAPS);
// The map in play, and what follows from it. loadMap() sets them all.
let mapId = '', MAP, WW, WH, BASE, SOLIDS, BUSHES;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));
const rand = (a, b) => a + Math.random() * (b - a);
function bushAt(px, py) { return BUSHES.find(b => Math.hypot(px - b.x, py - b.y) < b.r - 0.15) || null; }

// ---------- Sight: rays against the solid things ----------
function rayRect(ox, oy, dx, dy, r) {
  let t0 = -Infinity, t1 = Infinity;
  if (dx === 0) { if (ox < r.x || ox > r.x + r.w) return Infinity; }
  else { let a = (r.x - ox) / dx, b = (r.x + r.w - ox) / dx; if (a > b) [a, b] = [b, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, b); }
  if (dy === 0) { if (oy < r.y || oy > r.y + r.h) return Infinity; }
  else { let a = (r.y - oy) / dy, b = (r.y + r.h - oy) / dy; if (a > b) [a, b] = [b, a]; t0 = Math.max(t0, a); t1 = Math.min(t1, b); }
  if (t0 > t1 || t1 < 0) return Infinity;
  return Math.max(0, t0);
}
function rayCirc(ox, oy, dx, dy, s) {
  const px = ox - s.x, py = oy - s.y, b = px * dx + py * dy, d = b * b - (px * px + py * py - s.r * s.r);
  if (d < 0) return Infinity;
  const q = Math.sqrt(d);
  if (-b - q >= 0) return -b - q;
  return -b + q >= 0 ? 0 : Infinity;
}
// How far one can see from (ox, oy) in the direction a.
function castRay(ox, oy, a, max) {
  const dx = Math.cos(a), dy = Math.sin(a);
  let t = max;
  if (dx > 0) t = Math.min(t, (WW - ox) / dx); else if (dx < 0) t = Math.min(t, -ox / dx);
  if (dy > 0) t = Math.min(t, (WH - oy) / dy); else if (dy < 0) t = Math.min(t, -oy / dy);
  for (const s of SOLIDS) t = Math.min(t, s.r ? rayCirc(ox, oy, dx, dy, s) : rayRect(ox, oy, dx, dy, s));
  return t;
}
function clearSight(a, b) { const d = dist(a, b); return castRay(a.x, a.y, Math.atan2(b.y - a.y, b.x - a.x), d) >= d - 0.05; }

// Can o see the point p? The counting seeker has their eyes shut.
function seesPoint(o, p) {
  if (o.st === 'count') return false;
  const d = dist(o, p);
  if (d < NEAR) return true;
  if (d > RANGE) return false;
  if (Math.abs(wrap(Math.atan2(p.y - o.y, p.x - o.x) - o.a)) > FOV / 2) return false;
  return clearSight(o, p);
}
function canSee(o, t) {

  if (R.isHost) {
    const p = people.find(q => q.id === from && q.ctrl === 'remote');
    if (m.t === 'kme' && p && racing() && [m.x, m.y, m.a].every(Number.isFinite)) {
      p.x = Math.max(0, Math.min(WW, m.x)); p.y = Math.max(0, Math.min(WH, m.y)); p.a = m.a; p.moving = +m.m || 0;
    }
    return;
  }
  if (m.t === 'kr') guestStart(m);
  else if (m.t === 'ks' && castRound === rid) guestState(m);
  else if (m.t === 'kfin') guestEnd(m);
});
// The host: a phone in the round is back (a reload, a dropped connection), and gets the round as it is.
R.on('hello', id => { if (phase === 'count' || phase === 'seek') R.send(roundMsg('kr'), id); });
R.on('continue', ids => { for (const p of people) if (p.id && ids.includes(p.id) && p.ctrl === 'remote') botTakes(p); });
R.on('back', id => {
  const p = people.find(q => q.id === id);
  if (p && p.ctrl === 'bot') { p.ctrl = 'remote'; bots = bots.filter(b => b !== p); }
});
R.on('peers', members => {
  // A new room starts from the beginning: nobody seeks next yet.
  if (roomCode !== R.code) { roomCode = R.code; useSolo(); played = false; nextSeeker = null; }
  if (!played) R.note(members.filter(m => m.on).length < 5 ? 'Tyhjät paikat täyttävät tietokonepelaajat.' : '');
});
R.on('lobby', () => { phase = 'room'; letGo(); played = false; castRound = ''; });
R.on('leave', () => {
  useSolo(); played = false; nextSeeker = null; msgT = 0; rid = castRound = roomCode = '';
  showMenu();
});
R.on('menu', showMenu);

// ----- On the host -----
// The cast: the phones in the round, then computer players up to five.
function hostStart(s) {
  const cast = s.players.slice(0, 5).map((m, i) => {
    const p = person(m.name, COLORS[i], m.id === R.me);
    p.id = m.id; p.ctrl = m.id === R.me ? 'me' : 'remote';
    return p;
  });
  const humans = cast.length, taken = new Set(cast.map(p => p.name.toLowerCase()));
  for (const n of BOT_NAMES) if (cast.length < 5 && !taken.has(n.toLowerCase())) cast.push(person(n, COLORS[cast.length]));
  loadMap(roomMap); mode = roomMode;
  people = cast; player = cast.find(p => p.isPlayer); bots = cast.filter(p => p.ctrl === 'bot');
  // The first one caught last round seeks; the first round, a phone picked at random.
  const next = nextSeeker && cast.find(p => (nextSeeker.id ? p.id === nextSeeker.id : !p.id && p.name === nextSeeker.name));
  rid = s.round; events = []; sendT = 0;
  setupRound(next || cast[Math.floor(Math.random() * humans)]);
  R.send(roundMsg('kr'));
}
function hostTick(dt) {
  if ((sendT -= dt) > 0) return;
  sendT = R.paused ? 0.5 : 1 / 12;
  hostSend();
}
function hostSend() { R.send({ t: 'ks', round: rid, sk: people.indexOf(seeker), ph: phase, tm: r2(timer), sl: seekLeft === null ? null : r2(seekLeft), p: stateOf(), ev: events.splice(0) }); }

// ----- On a guest phone -----
function castFrom(m) {
  if (!Array.isArray(m.people) || !Array.isArray(m.p)) return false;
  loadMap(m.map); mode = MODES[m.mode] ? m.mode : 'kirkkis';
  const cast = m.people.map(q => {
    const p = person(q.n, q.c, q.id === R.me);
    p.id = q.id; p.ctrl = q.id === R.me ? 'me' : 'net';
    return p;
  });
  const me = cast.find(p => p.isPlayer);
  if (!me) return false;
  people = cast; player = me; bots = [];
  seeker = people[m.seeker] || people[0];
  people.forEach(p => { p.role = p === seeker ? 'seeker' : 'hider'; });
  firstCaught = null; letGo(); castRound = m.round;
  guestState(m, true);
  return true;
}
function guestStart(m) {
  if ((m.ph !== 'count' && m.ph !== 'seek') || !castFrom(m)) return;
  overStart = false;
  phase = m.ph; timer = m.tm;
  if (m.ph === 'count' && m.tm > M().count - 1) show(['count', 0]);
  menu.classList.add('hidden');
}
// The round is over: this phone saves its result once per round, however many times it hears so.
function guestEnd(m) {
  if (castRound === m.round) guestState(m); else if (!castFrom(m)) return;
  const next = people[m.next] || seeker;
  if (R.once(m.round)) roundOver(next); else { phase = 'end'; endT = 2.2; played = true; nextSeeker = next; lastRes = result(); lastMode = mode; }
  if (overStart) endT = 0; // it ended while this page was away: straight to the room
  menu.classList.add('hidden');
}
function guestState(m, snap) {
  if (!m.p || m.p.length !== people.length) return;
  // Hippa: who is it changes in the round.
  if (Number.isInteger(m.sk) && people[m.sk] && people[m.sk] !== seeker) setIt(people[m.sk]);
  m.p.forEach((q, i) => {
    const p = people[i];
    p.st = q[3];
    if (p === player && !snap) return; // this phone moves its own player
    p.tx = q[0]; p.ty = q[1]; p.a = q[2]; p.moving = q[4];
    if (snap) { p.x = q[0]; p.y = q[1]; }
  });
  if ((m.ph === 'count' || m.ph === 'seek') && (phase === 'count' || phase === 'seek')) phase = m.ph;
  if (Number.isFinite(m.tm)) timer = m.tm;
  seekLeft = Number.isFinite(m.sl) ? m.sl : null;
  for (const ev of m.ev || []) show(ev);
}
function guestStep(dt) {
  if (phase === 'end') { endT -= dt; if (endT <= 0) afterRound(); return; }
  if (R.paused || castRound !== rid) return;
  timer -= dt;
  if (seekLeft !== null) seekLeft = Math.max(0, seekLeft - dt);
  movePlayer(dt);
  // The others glide to where the host last saw them.
  const k = Math.min(1, dt * 12);
  for (const p of people) if (p !== player && p.tx !== undefined) { p.x += (p.tx - p.x) * k; p.y += (p.ty - p.y) * k; }
  if ((meT -= dt) <= 0) {
    meT = 0.1;
    R.send({ t: 'kme', round: rid, x: r2(player.x), y: r2(player.y), a: r2(player.a), m: r2(player.moving) });
  }
}
// The host picks the map under the room's player list; the others are told who picks.
const roomEl = document.createElement('div');
function roomControls() {
  roomEl.replaceChildren();
  roomEl.style.cssText = 'display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px';
  if (!R.inRoom) return;
  if (!R.isHost) { const t = document.createElement('p'); t.style.margin = '0'; t.textContent = 'Huoneen tekijä valitsee pelin ja kentän.'; roomEl.append(t); return; }
  const modesEl = document.createElement('div'), mapsBox = document.createElement('div');
  modesEl.style.cssText = mapsBox.style.cssText = 'display:flex;gap:6px;justify-content:center;flex-wrap:wrap;width:100%';
  modeButtons(modesEl, roomMode, id => { roomMode = id; roomControls(); });
  for (const b of modesEl.children) {
    const on = b.dataset.mode === roomMode;
    b.style.cssText = `font:800 14px system-ui;padding:6px 10px;border-radius:12px;border:2px solid ${on ? '#f2c94c' : 'transparent'};background:${on ? '#7a3b8f' : '#4f2260'};color:#fff`;
  }
  mapButtons(mapsBox, roomMap, id => { roomMap = id; roomControls(); });
  for (const b of mapsBox.children) {
    const on = b.dataset.map === roomMap;
    b.style.cssText = `display:flex;flex-direction:column;align-items:center;width:72px;font:700 13px system-ui;padding:5px 0;border-radius:12px;border:2px solid ${on ? '#f2c94c' : 'transparent'};background:${on ? '#7a3b8f' : '#4f2260'};color:#fff`;
  }
  roomEl.append(modesEl, mapsBox);
}
R.extra(roomEl);
R.on('peers', roomControls);
document.getElementById('multi').addEventListener('click', () => { unlock(); roomMode = soloMode; roomControls(); R.open(); });

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // Once the player is out, the rest of the round plays out faster (alone only: friends still play).
  const out = !R.inRoom && phase === 'seek' && player.role === 'hider' && !active(player);
  for (let i = 0; i < (out ? 3 : 1); i++) step(dt);
  draw();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
</script>
