<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tikanheitto</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1d2733;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100vw;height:100dvh;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 48px) 22px calc(env(safe-area-inset-bottom,0px) + 22px);box-sizing:border-box;background:rgba(16,24,34,.86);text-align:center;touch-action:manipulation}
  #menu.hidden{display:none}
  #menu h1{margin:0;font-size:40px;color:#ffd166;text-shadow:0 3px 0 #8a2d1c}
  #result{margin:0;font-size:21px;font-weight:800}
  #result:empty{display:none}
  #result.win{color:#9be38f}#result.lose{color:#ffb4a2}
  .btn{font:800 20px system-ui,sans-serif;padding:13px 26px;border:0;border-radius:16px;background:#ffd166;color:#3a2600;box-shadow:0 4px 0 #b8860b;min-width:230px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b}
  #go501{background:#7fd1ff;color:#08283a;box-shadow:0 4px 0 #2f7fae}
  #go501:active{box-shadow:0 1px 0 #2f7fae}
  .sub{margin:4px 0 0;font-size:15px;color:#dbe6f0}
  #opps{display:flex;gap:5px;justify-content:center}
  #opps button{font:700 14px system-ui,sans-serif;padding:8px 8px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff}
  #opps button.on{border-color:#7fd1ff;background:#7fd1ff;color:#08283a}
  #stats{margin:0;font-size:14px;color:#c4d2df}
  .help{margin:2px 0 0;font-size:13px;line-height:1.45;color:#c4d2df;max-width:320px}
  /* Sideways (#95): two columns, so the menu fits a 360 px high screen. */
  @media (orientation:landscape) and (max-height:520px) {
    #menu{display:grid;grid-template-columns:minmax(0,320px) minmax(0,320px);grid-template-areas:"t o" "r o2" "k g" "h s";
      align-content:center;justify-content:center;justify-items:center;align-items:center;gap:8px 30px;
      padding:calc(env(safe-area-inset-top,0px) + 36px) calc(env(safe-area-inset-right,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 14px) calc(env(safe-area-inset-left,0px) + 20px)}
    #menu h1{grid-area:t;font-size:34px}
    #result{grid-area:r;font-size:18px}
    #kisa{grid-area:k}
    .sub{grid-area:o;margin:0}
    #opps{grid-area:o2}
    #go501{grid-area:g}
    #stats{grid-area:s}
    #menu .help{grid-area:h;margin:0}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="menu">
  <h1>🎯 Tikanheitto</h1>
  <p id="result"></p>
  <button id="kisa" class="btn">Pistekisa</button>
  <p class="sub">501: pääse tasan nollaan. Vastus:</p>
  <div id="opps">
    <button data-o="helppo">Helppo</button><button data-o="keski">Keskitaso</button><button data-o="kova">Kova</button><button data-o="kaveri">Kaveri</button>
  </div>
  <button id="go501" class="btn">Pelaa 501</button>
  <p id="stats"></p>
  <p class="help">Paina sormi ruutuun ja liikuta tähtäintä. Käsi heiluu: päästä irti oikealla
    hetkellä, niin tikka lentää. Mitä kauemmin pidät, sitä enemmän käsi tärisee.
    Pistekisassa heität 10 kierrosta, 3 tikkaa kerrallaan.</p>
</div>
<script>
'use strict';
const c = document.getElementById('c'), x = c.getContext('2d');
const menu = document.getElementById('menu');
const KEY = 'ai-pelit:tikka:';
function load(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : v; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(KEY + k, String(v)); } catch (e) {} }

// ---- The board, in millimetres from the bull, y down (a real board's sizes) ----
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const R_BULL = 6.35, R_OUTER_BULL = 15.9, R_TRI_IN = 99, R_TRI_OUT = 107, R_DBL_IN = 162, R_DBL_OUT = 170;
const R_ALL = 228;   // the black surround with the numbers
function scoreAt(px, py) {
  const r = Math.hypot(px, py);
  if (r <= R_BULL) return { pts: 50, label: 'Bull' };
  if (r <= R_OUTER_BULL) return { pts: 25, label: '25' };
  if (r > R_DBL_OUT) return { pts: 0, label: 'Ohi' };
  const a = (Math.atan2(px, -py) * 180 / Math.PI + 360) % 360;
  const n = ORDER[Math.floor(((a + 9) % 360) / 18)];
  if (r > R_DBL_IN) return { pts: 2 * n, label: 'D' + n };
  if (r > R_TRI_IN && r <= R_TRI_OUT) return { pts: 3 * n, label: 'T' + n };
  return { pts: n, label: String(n) };
}
// Where to aim for a single, a double or a triple of n, or the bull (n 25 or 50).
function spotOf(n, mult) {
  if (n === 50) return { x: 0, y: 0 };
  if (n === 25) return { x: 0, y: -11 };
  const r = mult === 3 ? 103 : mult === 2 ? 166 : 135;
  const a = ORDER.indexOf(n) * 18 * Math.PI / 180;
  return { x: Math.sin(a) * r, y: -Math.cos(a) * r };
}

// ---- Layout ----
let W, H, DPR, SAFE_T = 0, SAFE_B = 0, SAFE_L = 0, SAFE_R = 0, LAND = false;
let BX = 0, BY = 0, K = 1, PANEL = null;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = W * DPR; c.height = H * DPR;
  const cs = getComputedStyle(document.getElementById('safe'));
  SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
  SAFE_L = parseFloat(cs.paddingLeft) || 0; SAFE_R = parseFloat(cs.paddingRight) || 0;
  LAND = W > H;
  if (LAND) {
    // The board on the left, the score panel on the right under the corner chips.
    const pw = Math.min(260, W * 0.36), bw = W - SAFE_L - SAFE_R - pw - 16;
    const r = Math.min(bw / 2 - 6, (H - SAFE_T - SAFE_B) / 2 - 8);
    K = r / R_ALL; BX = SAFE_L + 8 + bw / 2; BY = SAFE_T + (H - SAFE_T - SAFE_B) / 2;
    PANEL = { x: W - SAFE_R - pw - 8, y: SAFE_T + 52, w: pw, h: H - SAFE_T - SAFE_B - 62 };
  } else {
    // The panel under the corner chips, the board below it, room for the thumb at the bottom.
    PANEL = { x: SAFE_L + 10, y: SAFE_T + 50, w: W - SAFE_L - SAFE_R - 20, h: 108 };
    const top = PANEL.y + PANEL.h + 8, avail = H - top - SAFE_B - 70;
    const r = Math.min((W - 16) / 2, avail / 2);
    K = r / R_ALL; BX = W / 2; BY = top + r;
  }
}
addEventListener('resize', resize);
resize();
const sx = mx => BX + mx * K, sy = my => BY + my * K;

// ---- State ----
let phase = 'menu';      // menu, play
let mode = 'kisa';       // kisa (10 rounds for points) or 501
let opp = load('vastus', 'keski');
const ROUNDS = 10;
const AIM_SIGMA = { helppo: 30, keski: 17, kova: 9 };
let players = [], cur = 0, round = 1, dartsLeft = 3, turnStart = 0, turnDarts = [];
let stuck = [];          // darts in the board this turn: {x, y, p}
let flying = null;       // {x, y, t, p}
let aim = { x: 0, y: 0 };
let hold = null;         // the finger: {id, lx, ly, t}
let wob = 0;             // time for the hand's sway
let pause = 0, banner = null, after = null;
let bot = null;          // the computer's turn: {t, from, to}
let thrown = 0;          // darts the human players threw this game

function newGame(m) {
  mode = m; phase = 'play'; cur = 0; round = 1; thrown = 0;
  if (m === 'kisa') players = [{ name: 'Sinä', score: 0, ai: null }];
  else if (opp === 'kaveri') players = [{ name: 'Pelaaja 1', score: 501, ai: null }, { name: 'Pelaaja 2', score: 501, ai: null }];
  else players = [{ name: 'Sinä', score: 501, ai: null }, { name: 'Tietokone', score: 501, ai: opp }];
  startTurn();
  menu.classList.add('hidden');
}
function startTurn() {
  dartsLeft = 3; turnDarts = []; stuck = []; turnStart = players[cur].score; hold = null; bot = null;
  // Each player's sight starts where they last let go.
  if (!players[cur].ai) aim = Object.assign({}, players[cur].aim || { x: 0, y: 0 });
  if (players[cur].ai) botNext();
}

// ---- Throwing ----
// The sway of the hand, in mm: small at first, growing after 1.4 s of holding.
function sway(heldFor) {
  const a = 5 + Math.min(20, Math.max(0, heldFor - 1.4) * 10);
  return { x: a * (Math.sin(wob * 2.3) + 0.5 * Math.sin(wob * 5.3 + 1)) / 1.5,
           y: a * (Math.cos(wob * 1.9) + 0.5 * Math.sin(wob * 4.1 + 2)) / 1.5 };
}
function gauss() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
function throwAt(tx, ty) {
  flying = { x: tx, y: ty, t: 0, p: cur };
  dartsLeft--;
  if (!players[cur].ai) { thrown++; players[cur].aim = { x: aim.x, y: aim.y }; }
  sound('whoosh');
}
function land() {
  const f = flying; flying = null;
  const s = scoreAt(f.x, f.y);
  stuck.push({ x: f.x, y: f.y, p: f.p });
  turnDarts.push(s);
  sound(s.pts ? 'thunk' : 'miss');
  const p = players[cur];
  if (mode === 'kisa') {
    p.score += s.pts;
    if (!dartsLeft) endTurn(turnSum() === 180 ? '180!' : turnSum() + ' p');
  } else {
    const left = p.score - s.pts;
    if (left < 0) { p.score = turnStart; sound('bust'); endTurn('Yli! ' + turnStart + ' jää'); }
    else if (left === 0) { p.score = 0; endGame(cur); }
    else { p.score = left; if (!dartsLeft) endTurn(turnSum() === 180 ? '180!' : turnSum() + ' p'); }
  }
  // The computer aims again for what is left.
  if (pause <= 0 && dartsLeft && p.ai) botNext();
}
function turnSum() { return turnDarts.reduce((a, d) => a + d.pts, 0); }
function endTurn(text) {
  banner = { text, t: 0 };
  if (text === '180!') sound('cheer');
  pause = 1.3;
  after = () => {
    banner = null;
    if (mode === 'kisa') {
      if (round >= ROUNDS) return endGame(0);
      round++;
    } else {
      cur = (cur + 1) % players.length;
      if (cur === 0) round++;
    }
    startTurn();
  };
}
function endGame(winner) {
  pause = 1.4; banner = { text: mode === 'kisa' ? players[0].score + ' p' : 'Tasan nolla!', t: 0 };
  sound('win');
  after = () => { banner = null; finish(winner); };
}
function finish(winner) {
  phase = 'menu';
  const res = document.getElementById('result');
  if (mode === 'kisa') {
    const sc = players[0].score, best = +load('ennatys', 0);
    if (sc > best) save('ennatys', sc);
    res.textContent = 'Pistekisa: ' + sc + ' p' + (sc > best ? ', uusi ennätys!' : '');
    res.className = sc > best ? 'win' : '';
    if (window.AiPelitScores) AiPelitScores.submit(sc);
  } else if (players[winner].ai) {
    res.textContent = 'Tietokone voitti. Sinulle jäi ' + players[0].score + '.';
    res.className = 'lose';
  } else if (opp === 'kaveri') {
    res.textContent = players[winner].name + ' voitti!';
    res.className = 'win';
  } else {
    save('voitot', +load('voitot', 0) + 1);
    res.textContent = 'Voitit! Heitit ' + thrown + (thrown === 1 ? ' tikan.' : ' tikkaa.');
    res.className = 'win';
  }
  showMenu();
}

// ---- The computer ----
const NAMES = { helppo: 'helppo', keski: 'keskitaso', kova: 'kova', kaveri: 'kaveri' };
function botTarget(left) {
  if (left === 50) return spotOf(50);
  if (left === 25) return spotOf(25);
  if (left <= 20) return spotOf(left, 1);
  if (left <= 40 && left % 2 === 0) return spotOf(left / 2, 2);
  if (left <= 60 && left % 3 === 0) return spotOf(left / 3, 3);
  if (left > 40 && left - 40 <= 20) return spotOf(left - 40, 1);
  return left >= 62 ? spotOf(20, 3) : spotOf(20, 1);
}
function botNext() {
  const to = botTarget(players[cur].score);
  bot = { t: 0, from: { x: aim.x, y: aim.y }, to };
}

// ---- Touch: the finger moves the sight like a touchpad, letting go throws ----
c.addEventListener('pointerdown', e => {
  if (phase !== 'play' || hold || pause > 0 || flying || players[cur].ai) return;
  audio();
  hold = { id: e.pointerId, lx: e.clientX, ly: e.clientY, t: 0 };
  try { c.setPointerCapture(e.pointerId); } catch (err) {}
});
c.addEventListener('pointermove', e => {
  if (!hold || e.pointerId !== hold.id) return;
  aim.x = Math.max(-R_ALL, Math.min(R_ALL, aim.x + (e.clientX - hold.lx) / K * 0.8));
  aim.y = Math.max(-R_ALL, Math.min(R_ALL, aim.y + (e.clientY - hold.ly) / K * 0.8));
  hold.lx = e.clientX; hold.ly = e.clientY;
});
function letGo(e) {
  if (!hold || e.pointerId !== hold.id) return;
  const h = hold; hold = null;
  if (h.t < 0.12 || e.type === 'pointercancel') return;   // a brush of the screen does not throw
  const w = sway(h.t);
  throwAt(aim.x + w.x + gauss() * 2.5, aim.y + w.y + gauss() * 2.5);
}
c.addEventListener('pointerup', letGo);
c.addEventListener('pointercancel', letGo);

// ---- Step ----
function step(dt) {
  wob += dt;
  if (banner) banner.t += dt;
  if (phase !== 'play') return;
  if (pause > 0) { pause -= dt; if (pause <= 0 && after) { const f = after; after = null; f(); } return; }
  if (flying) { flying.t += dt / 0.28; if (flying.t >= 1) land(); return; }
  if (hold) hold.t += dt;
  if (bot) {
    bot.t += dt;
    const k = Math.min(1, bot.t / 0.7), e = k * k * (3 - 2 * k);
    aim.x = bot.from.x + (bot.to.x - bot.from.x) * e; aim.y = bot.from.y + (bot.to.y - bot.from.y) * e;
    if (bot.t >= 1.0) {
      const sg = AIM_SIGMA[players[cur].ai];
      bot = null;
      throwAt(aim.x + gauss() * sg, aim.y + gauss() * sg);
    }
  }
}

// ---- Draw ----
const RED = '#d23a2f', GREEN = '#1f8a4c', DARK = '#1b1b1b', CREAM = '#f1e2bd';
const PCOL = ['#ffd166', '#7fd1ff'];
function drawBoard() {
  x.save();
  x.translate(BX, BY);
  // The cabinet's shadow and the surround.
  x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.arc(4, 7, R_ALL * K, 0, 7); x.fill();
  x.fillStyle = '#121212'; x.beginPath(); x.arc(0, 0, R_ALL * K, 0, 7); x.fill();
  const ring = (r0, r1, a0, a1, col) => {
    x.fillStyle = col; x.beginPath(); x.arc(0, 0, r1 * K, a0, a1); x.arc(0, 0, r0 * K, a1, a0, true); x.closePath(); x.fill();
  };
  for (let i = 0; i < 20; i++) {
    const a0 = (i * 18 - 9 - 90) * Math.PI / 180, a1 = a0 + 18 * Math.PI / 180;
    const even = i % 2 === 0;
    ring(R_OUTER_BULL, R_DBL_OUT, a0, a1, even ? DARK : CREAM);
    ring(R_TRI_IN, R_TRI_OUT, a0, a1, even ? RED : GREEN);
    ring(R_DBL_IN, R_DBL_OUT, a0, a1, even ? RED : GREEN);
  }
  x.fillStyle = GREEN; x.beginPath(); x.arc(0, 0, R_OUTER_BULL * K, 0, 7); x.fill();
  x.fillStyle = RED; x.beginPath(); x.arc(0, 0, R_BULL * K, 0, 7); x.fill();
  // The wires.
  x.strokeStyle = 'rgba(200,200,200,.55)'; x.lineWidth = Math.max(0.5, K * 1.2);
  for (const r of [R_OUTER_BULL, R_TRI_IN, R_TRI_OUT, R_DBL_IN, R_DBL_OUT]) { x.beginPath(); x.arc(0, 0, r * K, 0, 7); x.stroke(); }
  x.beginPath();
  for (let i = 0; i < 20; i++) {
    const a = (i * 18 - 9 - 90) * Math.PI / 180;
    x.moveTo(Math.cos(a) * R_OUTER_BULL * K, Math.sin(a) * R_OUTER_BULL * K);
    x.lineTo(Math.cos(a) * R_DBL_OUT * K, Math.sin(a) * R_DBL_OUT * K);
  }
  x.stroke();
  // The numbers.
  x.fillStyle = '#f4f4f4'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 ' + Math.round(26 * K) + 'px system-ui,sans-serif';
  for (let i = 0; i < 20; i++) {
    const a = (i * 18 - 90) * Math.PI / 180;
    x.fillText(ORDER[i], Math.cos(a) * 198 * K, Math.sin(a) * 198 * K);
  }
  x.restore();
}
function drawDart(px, py, p, scale) {
  // Seen from the thrower: the barrel and flights point back towards them, down and right.
  const s = Math.max(0.6, K * 2.6) * scale, dx = 5 * s, dy = 13 * s;
  x.strokeStyle = '#d9dde3'; x.lineWidth = 2.6 * s; x.lineCap = 'round';
  x.beginPath(); x.moveTo(px, py); x.lineTo(px + dx, py + dy); x.stroke();
  x.fillStyle = PCOL[p] || PCOL[0];
  x.beginPath(); x.moveTo(px + dx, py + dy); x.lineTo(px + dx - 5 * s, py + dy + 9 * s); x.lineTo(px + dx + 7 * s, py + dy + 7 * s); x.closePath(); x.fill();
  x.fillStyle = '#222'; x.beginPath(); x.arc(px, py, 1.4 * s, 0, 7); x.fill();
}
function drawSight() {
  const w = hold ? sway(hold.t) : bot ? sway(0) : { x: 0, y: 0 };
  const px = sx(aim.x + w.x), py = sy(aim.y + w.y), r = 13;
  x.strokeStyle = hold && hold.t > 1.4 ? '#ff8a6b' : '#fff'; x.lineWidth = 2;
  x.beginPath(); x.arc(px, py, r, 0, 7); x.stroke();
  x.beginPath(); x.moveTo(px - r - 6, py); x.lineTo(px - 4, py); x.moveTo(px + 4, py); x.lineTo(px + r + 6, py);
  x.moveTo(px, py - r - 6); x.lineTo(px, py - 4); x.moveTo(px, py + 4); x.lineTo(px, py + r + 6); x.stroke();
}
function roundRect(rx, ry, rw, rh, rr) { x.beginPath(); if (x.roundRect) x.roundRect(rx, ry, rw, rh, rr); else x.rect(rx, ry, rw, rh); }
// Draws one line of the panel and keeps its box in panelTexts, so the tests can see nothing overlaps.
let panelTexts = [];
function label(str, tx, ty, size, weight, col, align) {
  str = String(str);
  x.font = weight + ' ' + size + 'px system-ui,sans-serif'; x.fillStyle = col; x.textAlign = align;
  x.fillText(str, tx, ty);
  if (!str) return;
  const w = x.measureText(str).width, x0 = align === 'right' ? tx - w : tx;
  panelTexts.push({ text: str, x0, x1: x0 + w, y0: ty - size / 2, y1: ty + size / 2 });
}
function drawPanel() {
  const P = PANEL;
  panelTexts = [];
  x.fillStyle = 'rgba(0,0,0,.35)'; roundRect(P.x, P.y, P.w, P.h, 12); x.fill();
  x.textBaseline = 'middle';
  const dots = (dx, dy) => { for (let i = 0; i < 3; i++) { x.fillStyle = i < dartsLeft ? '#fff' : 'rgba(255,255,255,.2)'; x.beginPath(); x.arc(dx + i * 14, dy, 4.5, 0, 7); x.fill(); } };
  const last = turnDarts.map(d => d.label).join(' · ');
  if (mode === 'kisa') {
    // Round and darts on top, the points below, and this turn's darts on a row of their own.
    label('Kierros ' + round + '/' + ROUNDS, P.x + 14, P.y + 20, 15, 600, '#c4d2df', 'left');
    dots(P.x + P.w - 46, P.y + 20);
    label(players[0].score + ' p', P.x + 14, P.y + 54, 32, 800, '#ffd166', 'left');
    label(last, P.x + 14, P.y + 88, 15, 700, '#fff', 'left');
    const best = +load('ennatys', 0);
    if (LAND && best) label('Ennätys ' + best + ' p', P.x + 14, P.y + 116, 14, 600, '#c4d2df', 'left');
    return;
  }
  // 501: one card a player, side by side upright and one above the other sideways. In each card
  // the name, then the score, then this turn's darts, each on its own row.
  const n = players.length, bh = LAND ? 88 : P.h - 16;
  for (let i = 0; i < n; i++) {
    const bw = LAND ? P.w - 16 : (P.w - 24) / 2;
    const bx = LAND ? P.x + 8 : P.x + 8 + i * (bw + 8), by = LAND ? P.y + 8 + i * (bh + 8) : P.y + 8;
    x.fillStyle = i === cur ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.04)';
    roundRect(bx, by, bw, bh, 10); x.fill();
    if (i === cur) { x.strokeStyle = PCOL[i]; x.lineWidth = 2; roundRect(bx, by, bw, bh, 10); x.stroke(); }
    label(players[i].name, bx + 10, by + 16, 14, 700, PCOL[i], 'left');
    label(players[i].score, bx + 10, by + 46, 30, 800, '#fff', 'left');
    if (i === cur) {
      dots(bx + bw - 40, by + 16);
      label(last, bx + 10, by + bh - 13, 13, 700, '#e8eef4', 'left');
    }
  }
  if (LAND) label('Kierros ' + round, P.x + 14, P.y + 8 + n * (bh + 8) + 14, 14, 600, '#c4d2df', 'left');
}
function drawHint() {
  if (phase !== 'play' || hold || flying || pause > 0 || players[cur].ai) return;
  x.fillStyle = turnDarts.length || round > 1 ? 'rgba(255,255,255,.4)' : 'rgba(255,255,255,.75)'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '600 15px system-ui,sans-serif';
  const hy = LAND ? H - SAFE_B - 18 : H - SAFE_B - 34;
  x.fillText('Paina ja liikuta tähtäintä, päästä irti = heitto', LAND ? BX : W / 2, hy);
}
function draw() {
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2b3a4a'); g.addColorStop(1, '#141c25');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // A spotlight on the board.
  const sp = x.createRadialGradient(BX, BY, R_ALL * K * 0.6, BX, BY, R_ALL * K * 1.7);
  sp.addColorStop(0, 'rgba(255,240,200,.18)'); sp.addColorStop(1, 'rgba(255,240,200,0)');
  x.fillStyle = sp; x.fillRect(0, 0, W, H);
  drawBoard();
  for (const d of stuck) drawDart(sx(d.x), sy(d.y), d.p, 1);
  if (phase === 'play') {
    if (flying) {
      const k = flying.t, tx = sx(flying.x), ty = sy(flying.y);
      const fy = H + 40;
      const px = tx, py = fy + (ty - fy) * k - Math.sin(k * Math.PI) * 60;
      drawDart(px, py, flying.p, 1 + (1 - k) * 2.2);
    } else if (pause <= 0 && (hold || bot || !players[cur].ai)) drawSight();
    drawPanel();
    drawHint();
  }
  if (banner) {
    const a = Math.min(1, banner.t * 5), big = banner.text === '180!';
    x.globalAlpha = a; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '900 ' + (big ? 64 : 42) + 'px system-ui,sans-serif';
    x.lineWidth = 7; x.strokeStyle = 'rgba(0,0,0,.6)'; x.strokeText(banner.text, BX, BY);
    x.fillStyle = big ? '#ffd166' : '#fff'; x.fillText(banner.text, BX, BY);
    x.globalAlpha = 1;
  }
}

// ---- Menu ----
function pickOpp(o) {
  opp = o; save('vastus', o);
  for (const b of document.querySelectorAll('#opps button')) b.classList.toggle('on', b.dataset.o === o);
}
function showMenu() {
  phase = 'menu';
  pickOpp(NAMES[opp] ? opp : 'keski');
  const best = +load('ennatys', 0), wins = +load('voitot', 0);
  const parts = [];
  if (best) parts.push('Ennätys ' + best + ' p');
  if (wins) parts.push('Voittoja tietokoneesta ' + wins);
  document.getElementById('stats').textContent = parts.join(' · ');
  menu.classList.remove('hidden');
}
document.getElementById('kisa').onclick = () => { audio(); newGame('kisa'); };
document.getElementById('go501').onclick = () => { audio(); newGame('501'); };
for (const b of document.querySelectorAll('#opps button')) b.onclick = () => pickOpp(b.dataset.o);

// ---- Sound: short Web Audio tones, only after the first tap ----
let ac = null;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f0, f1, dur, type, vol, delay = 0) {
  if (!ac) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sound(k) {
  if (k === 'whoosh') tone(700, 300, 0.18, 'sine', 0.05);
  else if (k === 'thunk') { tone(180, 70, 0.07, 'square', 0.12); tone(1200, 600, 0.03, 'triangle', 0.05); }
  else if (k === 'miss') tone(140, 90, 0.12, 'sine', 0.1);
  else if (k === 'bust') tone(300, 110, 0.4, 'sawtooth', 0.1, 0.1);
  else if (k === 'cheer') [659, 784, 988, 1319].forEach((f, i) => tone(f, f, 0.16, 'square', 0.07, i * 0.08));
  else if (k === 'win') [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.18, 0.1 + i * 0.1));
}

// ---- Loop: fixed 1/60 s steps ----
let lastT = performance.now(), acc = 0;
function frame(t) {
  acc += Math.min(0.1, (t - lastT) / 1000); lastT = t;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  draw();
  requestAnimationFrame(frame);
}
showMenu();
requestAnimationFrame(frame);
</script>
