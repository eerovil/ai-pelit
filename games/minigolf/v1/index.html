<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#153c32"><title>Minigolf</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#153c32;color:#fff8df;font:16px system-ui,sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:46px;padding:11px 18px;background:#f3cf77;color:#193c32;font-weight:750;touch-action:manipulation}button.secondary{background:#294e43;color:#fff8df;border:1px solid #688676}button:disabled{opacity:.5}#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none}#hud{position:fixed;top:calc(env(safe-area-inset-top) + 12px);right:16px;text-align:right;pointer-events:none;font-size:13px}#hud strong{display:block;font-size:17px}#bottom{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 18px);left:18px;right:112px;pointer-events:none;font-size:13px;color:#e0ebd6}#power{height:5px;margin:8px 0;background:#426754;border-radius:4px;overflow:hidden}#power i{display:block;height:100%;width:0;background:#f5d477}#notice{position:fixed;top:calc(env(safe-area-inset-top) + 68px);left:16px;right:16px;text-align:center;pointer-events:none;color:#ffe09a;font-size:14px}.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 52px) 22px calc(env(safe-area-inset-bottom) + 36px);background:#12392eed;overflow:hidden}.panel{width:100%;max-width:470px}.eyebrow{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#b5cdb0}h1{font-size:48px;letter-spacing:-2px;margin:8px 0 12px}h2{font-size:27px;margin:4px 0 8px}p{line-height:1.5;color:#d2dfc7}.actions{display:grid;gap:10px;margin-top:22px}.flag{font-size:42px}.best{margin-top:20px;font-size:14px;color:#f6d487}#card{display:none}#scoreRows{width:100%;border-collapse:collapse;table-layout:fixed;margin:12px 0;font-size:13px}#scoreRows td,#scoreRows th{padding:3px 2px;text-align:center;border-bottom:1px solid #426653}#scoreRows th:first-child,#scoreRows td:first-child{text-align:left;width:30%}#scoreRows th{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#scoreRows tfoot{font-weight:bold;color:#ffdb88}#scoreRows caption{text-align:left;font-size:12px;color:#b5cdb0;margin-bottom:8px}#board{font-size:12px;max-height:50px;overflow:auto}#board:empty{display:none}#card .actions{margin-top:8px;gap:8px}#card h2{font-size:25px}#summary{margin:4px 0;font-size:14px}#cardNames{font-size:12px;color:#d2dfc7}.hidden{display:none!important}
#who{position:fixed;top:calc(env(safe-area-inset-top) + 86px);left:12px;right:12px;display:flex;justify-content:center;gap:4px;font-size:11px;text-align:left}#who span{display:flex;align-items:center;gap:3px;min-width:0;flex:0 1 auto;max-width:17%;padding:1px 4px;border-radius:7px;opacity:.75}#who span.on{opacity:1;background:#294e43;font-weight:750}#who i{flex:none;width:9px;height:9px;border-radius:50%}#who b{font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (orientation:landscape){#who{top:58px;left:auto;right:6px;width:76px;flex-direction:column;gap:2px}#who span{max-width:none}.overlay{padding:42px 60px 20px}.panel{max-width:900px;display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;align-items:center}h1{font-size:40px;margin:2px 0 6px}.flag{font-size:27px}.actions{margin-top:8px}.best{margin-top:10px}p{margin:6px 0;font-size:14px}#card .panel{grid-template-columns:1.2fr 1fr}#scoreRows{margin:0;font-size:12px}#scoreRows td,#scoreRows th{padding:3px 2px}#cardInfo{grid-column:2;grid-row:1}#cardTable{grid-column:1;grid-row:1}#board{max-height:60px}#notice{top:50px;left:22%;right:22%;font-size:12px}#bottom{bottom:8px}#hud{font-size:12px}#hud strong{font-size:15px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Minigolfrata. Vedä taaksepäin ja päästä irti lyödäksesi."></canvas>
<div id="hud" class="hidden"></div><div id="notice"></div>
<div id="bottom" class="hidden"><span id="hint"></span><div id="power"><i></i></div></div>
<section id="menu" class="overlay"><div class="panel"><div><div class="flag">⛳</div><div class="eyebrow">Pieni rata · tarkka lyönti</div><h1>Minigolf</h1><p>Yhdeksän reikää, yksi tavoite:<br>mahdollisimman vähän lyöntejä.</p><p>Vedä mistä tahansa taaksepäin ja päästä irti. Lyhyt veto on kevyt putti.</p><div id="best" class="best"></div></div><div class="actions"><button id="play">Pelaa</button><button id="resume" class="secondary hidden">Jatka kierrosta</button><button id="friends" class="secondary">👥 Pelaa kavereiden kanssa</button><button id="scores" class="secondary">🏆 Tuloslista</button><p>Enintään 6 lyöntiä / reikä.<br>Jos pallo ei uppoa, tulos on 7.</p></div></div></section>
<section id="card" class="overlay"><div class="panel"><div id="cardInfo"><div class="eyebrow" id="cardTag"></div><h2 id="cardTitle"></h2><p id="summary"></p><div id="cardNames"></div><div class="actions"><button id="next"></button><button id="toMenu" class="secondary">Valikkoon</button></div><div id="board"></div></div><div id="cardTable"><table id="scoreRows"></table></div></div></section>
<script src="../../../rooms.js" data-game="minigolf" data-min="2" data-max="6" data-voice-corner="left"></script>
<script src="../../../scores.js" data-game="minigolf" data-order="low" data-corner="bottom-right"></script>
<script src="../../../lib/aanet-5/aanet.js"></script>
<script src="holes.js"></script><script src="golf.js"></script><script src="game.js"></script><script src="draw.js"></script>
<script src="../../../back.js"></script>
</body></html>
