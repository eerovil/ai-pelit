<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hiihto</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfdcea;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
  #g{pointer-events:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
</style>
</head>
<body>
<canvas id="g"></canvas>
<canvas id="c"></canvas>
<div id="safe"></div>
<script src="../../../rooms.js" data-game="hiihto" data-min="2" data-max="6"></script>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
let W, H, DPR, SAFE_T = 0, SAFE_B = 0, SAFE_L = 0, SAFE_R = 0, LAND = false;
// v6 (#93): the game is drawn for the canvas's own box on the screen, and a finger is read
// against that box. v5 drew for innerWidth × innerHeight but stretched the canvas to 100dvh; on a
// phone where those differ, everything showed lower than where a tap landed.
function resize() {
  // v7: at most twice the screen's pixels, as for the 3D under it: a phone at three times spent
  // most of its frame on this canvas.
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = c.getBoundingClientRect();
  W = r.width || innerWidth; H = r.height || innerHeight;
  c.width = W * DPR; c.height = H * DPR;
  const cs = getComputedStyle(document.getElementById('safe'));
  SAFE_T = parseFloat(cs.paddingTop) || 0; SAFE_B = parseFloat(cs.paddingBottom) || 0;
  SAFE_L = parseFloat(cs.paddingLeft) || 0; SAFE_R = parseFloat(cs.paddingRight) || 0;
  // v8 (#95): a phone turned sideways. The menus and end screens go into two columns, the buttons
  // to the lower corners, and the 3D view simply shows wider. Only the drawing changes: a rotation
  // mid-race keeps the race as it is.
  LAND = W > H;
}
addEventListener('resize', resize); resize();
if (window.visualViewport) visualViewport.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(c);
// A finger on the screen, in the game's own coordinates.
function at(e) { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * W / (r.width || W), (e.clientY - r.top) * H / (r.height || H)]; }

// ---- Saves (shared by every version) ----
const KEY = 'ai-pelit:hiihto:';
function load(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
let maxLevel = Math.max(1, Math.floor(load('taso', 1)) || 1);   // the highest level open
let stars = load('tahdet', {}) || {};                            // level -> best stars
let bests = load('ajat', {}) || {};                              // level -> best time, seconds
// Skating (v3) keeps its own stars and times: a skate is faster, so the lists stay apart. The
// levels opened ('taso') are shared by both styles.
let sStars = load('luistelu-tahdet', {}) || {}, sBests = load('luistelu-ajat', {}) || {};
const savedStyle = () => load('tyyli', 'perinteinen') === 'luistelu' ? 'luistelu' : 'perinteinen';
let style = savedStyle();                                        // 'perinteinen' (classic) or 'luistelu'
let level = maxLevel;
const skating = () => style === 'luistelu';
const starsOf = () => skating() ? sStars : stars;
const bestsOf = () => skating() ? sBests : bests;
const STYLE_NAME = { perinteinen: 'Perinteinen', luistelu: 'Luistelu' };
// One online list per course and style: classic keeps v1-v2's 'taso-N'.
function setBoard() {
  if (window.AiPelitScores) AiPelitScores.board(skating() ? `luistelu-${level}` : `taso-${level}`, skating() ? `Luistelu · taso ${level}` : `Taso ${level}`);
}

const TAU = 2 * Math.PI, G = 9.81;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const fmt = (v, d) => v.toFixed(d).replace('.', ',').replace('-', '−');
function fmtTime(t) { const m = Math.floor(t / 60), s = t - 60 * m; return `${m}.${s < 10 ? '0' : ''}${fmt(Math.floor(s * 10) / 10, 1)}`; }

// ---- Weather and grip wax ----
// A wax grips in its own temperature range. Too hard a wax for the weather (colder wax, warmer day)
// slips; too soft a wax (warmer wax, colder day) grips, but snow sticks to it and it glides badly.
const WAXES = [
  { name: 'Vihreä', col: '#2e9e4f', lo: -20, hi: -10, range: '−10…−20 °C' },
  { name: 'Sininen', col: '#2f6fd0', lo: -10, hi: -2, range: '−2…−10 °C' },
  { name: 'Violetti', col: '#8a4fc4', lo: -3, hi: 0, range: '0…−3 °C' },
  { name: 'Klisteri', col: '#d6403a', lo: 0, hi: 5, range: '0…+5 °C, nuoska' },
];
const TEMPS = [-6, -14, -1.5, 1.5, -8, -2.5, -17, 0.5, -4, -11];
function weatherFor(n) {
  const T = n <= TEMPS.length ? TEMPS[n - 1] : Math.round((rng(n * 31)() * 21 - 18) * 2) / 2;
  const desc = T <= -10 ? 'Kireä pakkanen, kuiva ja kova lumi' : T < -3 ? 'Pakkaskeli, kuiva lumi'
    : T <= 0 ? 'Nollakeli, kosteaa uutta lunta' : 'Suojakeli, märkää nuoskaa';
  return { T, desc, snowing: T > -4.5, grey: T > -3 };
}
function waxFit(w, T) {
  if (T > w.hi) return { grip: clamp(1 - 0.14 * (T - w.hi), 0.35, 1), drag: 0 };
  if (T < w.lo) return { grip: 1, drag: Math.min(0.06, 0.02 * (w.lo - T)) };
  return { grip: 1, drag: 0 };
}
function bestWax(T) { let b = 0, s = -1e9; WAXES.forEach((w, i) => { const f = waxFit(w, T), v = f.grip - 4 * f.drag; if (v > s) { s = v; b = i; } }); return b; }
// A skate pushes off the edge, so skating wants no grip wax, only a glide wax for the snow: one
// made for other weather drags a little more for each degree it is off.
const GLIDES = [
  { name: 'Pakkanen', col: '#2e9e4f', lo: -20, hi: -8, range: '−8…−20 °C' },
  { name: 'Keskikeli', col: '#2f6fd0', lo: -10, hi: -3, range: '−3…−10 °C' },
  { name: 'Nollakeli', col: '#8a4fc4', lo: -4, hi: 0.5, range: '0…−4 °C' },
  { name: 'Suojakeli', col: '#d6403a', lo: 0, hi: 6, range: '0…+6 °C, märkä' },
];
function glideFit(w, T) { const d = T > w.hi ? T - w.hi : T < w.lo ? w.lo - T : 0; return { grip: 1, drag: Math.min(0.05, 0.012 * d) }; }
function bestGlide(T) { let b = 0, s = 1e9; GLIDES.forEach((w, i) => { const d = glideFit(w, T).drag; if (d < s) { s = d; b = i; } }); return b; }
const waxList = st => (st || style) === 'luistelu' ? GLIDES : WAXES;
const fitOf = (st, i, T) => st === 'luistelu' ? glideFit(GLIDES[i], T) : waxFit(WAXES[i], T);
const bestFor = (st, T) => st === 'luistelu' ? bestGlide(T) : bestWax(T);

// ---- The course: 2 m segments, each with its own grade and curve ----
const SEG = 2, ROAD_W = 8;
const LX = [-1.25, 0, 1.7];                     // oncoming classic track, own classic track, skating lane
const LS = [0, 1.15, 2.25];                     // a skater's lanes: the classic track, the skating lane's two halves
const laneX = (st, lane) => (st === 'luistelu' ? LS : LX)[lane];
const TRAIL_L = -2.05, TRAIL_R = 2.85, SKATE_L = 0.62;
let course;

function buildCourse(n) {
  const r = rng(n * 7919 + 101);
  const len = Math.min(1500, 500 + 100 * (n - 1));
  const total = Math.ceil((len + 320) / SEG);
  const raw = new Float32Array(total), curve = new Float32Array(total);
  let i = 0, hills = 0;
  const put = (m, g, cv) => { const k = Math.max(1, Math.round(m / SEG));
    for (let j = 0; j < k && i < total; j++, i++) { raw[i] = g; curve[i] = cv * Math.sin(Math.PI * (j + 0.5) / k); } };
  put(50, 0, 0);
  while (i * SEG < len - 150) {
    put(30 + r() * 50, (r() - 0.5) * 0.02, (r() - 0.5) * 0.014);
    // The second hill is always steep, so every course needs the V step at least once.
    const steep = hills === 1 || (hills > 1 && r() < Math.min(0.75, 0.4 + 0.04 * n));
    const up = steep ? 0.1 + r() * 0.03 : 0.035 + r() * 0.025;
    put(steep ? 28 + r() * 20 : 40 + r() * 40, up, (r() - 0.5) * 0.006);
    put(10, up * 0.25, 0);
    put(50 + r() * 60, -(0.05 + r() * 0.06), (r() - 0.5) * 0.016);
    hills++;
  }
  put(total * SEG, 0, 0);
  // A road across the trail (v4) on levels 3, 5, 7…, a little before half way, on the flat.
  const road = n >= 3 && n % 2 === 1 ? { z0: Math.round(len * 0.45 / SEG) * SEG } : null;
  if (road) {
    road.z1 = road.z0 + ROAD_W;
    for (let j = Math.floor((road.z0 - 30) / SEG); j < Math.ceil((road.z1 + 30) / SEG); j++) { raw[j] = 0; curve[j] = 0; }
  }
  const grade = new Float32Array(total), y = new Float32Array(total + 1), xs = new Float32Array(total + 1), dir = new Float32Array(total + 1);
  for (let s = 0; s < total; s++) { let a = 0, k = 0; for (let j = -4; j <= 4; j++) { const q = s + j; if (q >= 0 && q < total) { a += raw[q]; k++; } } grade[s] = a / k; }
  for (let s = 0; s < total; s++) { y[s + 1] = y[s] + grade[s] * SEG; dir[s + 1] = dir[s] + curve[s]; xs[s + 1] = xs[s] + dir[s] * SEG; }
  // Spruces beside the trail, a start and a finish banner, and distance posts.
  const spr = Array.from({ length: total }, () => []);
  for (let s = 0; s < total; s++) for (const side of [-1, 1]) {
    if (r() < 0.42) spr[s].push({ kind: 'tree', l: side < 0 ? TRAIL_L - 1.4 - r() * 12 : TRAIL_R + 1.4 + r() * 12, h: 3.5 + r() * 5, z: s * SEG + r() * SEG });
  }
  const at = (z, o) => spr[Math.floor(z / SEG)].push({ z, ...o });
  at(4, { kind: 'banner', text: 'LÄHTÖ' });
  at(len, { kind: 'banner', text: 'MAALI' });
  if (road) at(road.z0 - 16, { kind: 'post', text: '⚠ TIE', l: TRAIL_R + 0.5 });
  for (let d = 250; d < len - 50; d += 250) at(len - d, { kind: 'post', text: `${d} m`, l: TRAIL_R + 0.5 });
  course = { n, len, total, grade, y, xs, dir, spr, road, weather: weatherFor(n) };
  course.ideal = idealTime();
  course.par = Math.round(course.ideal * 1.5);
  return course;
}
function segAt(z) { return clamp(Math.floor(z / SEG), 0, course.total - 1); }
function gradeAt(z) { return course.grade[segAt(z)]; }
function heightAt(z) { const i = segAt(z), t = clamp(z / SEG - i, 0, 1); return lerp(course.y[i], course.y[i + 1], t); }
function centreAt(z) { const i = segAt(z), t = clamp(z / SEG - i, 0, 1); return [lerp(course.xs[i], course.xs[i + 1], t), lerp(course.dir[i], course.dir[i + 1], t)]; }

// ---- The skier ----
// Diagonal stride: each tap is one kick. It grips only when the wax grips well enough for the
// slope, so a steep hill wants the V step (haarakäynti), which always grips but is slow on the flat
// and brakes downhill. Holding a finger down is the tuck, which glides fastest down a hill.
const MU = 0.035, K_STRIDE = 0.75, VMAX_STRIDE = 7.2, K_V = 1.0, VMAX_V = 4.6, K_DOWN = 0.35;
function newSkier(st) {
  st = st || style;
  return { style: st, z: 0, v: 0, lane: 1, x: laneX(st, 1), vMode: false, hold: false, lastKick: -9, t: 0, fallT: 0, invT: 0, slipT: 0, sameT: 0, kickAnim: 1, side: 1, grip: 1, drag: 0 };
}
let P = newSkier();

function kickNeed(g, vMode) { return vMode ? 0.25 : 0.3 + 10 * Math.max(0, g); }
function kick(p) {
  if (p.fallT > 0) return 0;
  const g = gradeAt(p.z), since = p.t - p.lastKick;
  p.lastKick = p.t; p.kickAnim = 0; p.side = -p.side;
  // A kick too soon after the last is weaker, down to nothing: mashing the screen never beats the
  // rhythm (v4; earlier versions kept 30 % of every kick, so very fast taps were the fastest).
  const rate = clamp((since - 0.12) / 0.25, 0, 1);
  p.earlyT = rate < 0.85 ? 0.6 : 0;
  const eff = clamp(1 - (kickNeed(g, p.vMode) - p.grip) * 2.5, 0, 1);
  let K = p.vMode ? K_V : K_STRIDE, vmax = p.vMode ? VMAX_V : VMAX_STRIDE;
  if (g < -0.03) K = p.vMode ? 0 : K_DOWN;
  const dv = K * rate * eff * Math.max(0, 1 - p.v / vmax);
  p.v += dv;
  if (eff < 0.5 && K > 0) p.slipT = 0.9;
  return dv;
}
// Skating (v3): a tap on the left half of the screen pushes off the left ski, on the right half
// the right one. Pushes on alternate skis drive the skier on, uphill too, as the edge always
// grips; the same ski twice is a weak push. Faster than the stride, and no V step is needed.
const K_SKATE = 0.8, VMAX_SKATE = 9.2;
function push(p, side) {
  if (p.fallT > 0) return 0;
  const g = gradeAt(p.z), since = p.t - p.lastKick, alt = side !== p.side;
  p.lastKick = p.t; p.kickAnim = 0; p.side = side;
  const timing = clamp((since - 0.1) / 0.22, 0, 1), rate = timing * (alt ? 1 : 0.35);
  p.earlyT = timing < 0.85 ? 0.6 : 0;
  const K = g < -0.03 ? K_SKATE * 0.4 : K_SKATE;
  const dv = K * rate * Math.max(0, 1 - p.v / VMAX_SKATE);
  p.v += dv;
  if (!alt) p.sameT = 0.9;
  return dv;
}
// The rhythm (v4): how far the skier is from the next full-strength kick or push. A tap before it
// is weaker (above), a tap long after it wastes time, so tapping as the meter turns green is the
// fastest rhythm: 0.37 s a kick in classic, 0.32 s a push when skating.
const BEAT = { perinteinen: 0.37, luistelu: 0.32 };
const beatLen = p => p.road === 'walk' ? WALK_BEAT : BEAT[p.style];
function beat(p) { return clamp((p.t - p.lastKick) / beatLen(p), 0, 1); }
// What the meter shows: red after a tap that came too soon, until the next full-strength moment;
// then green; yellow while it fills.
function meter(p) { const f = beat(p); return f >= 1 ? 'ready' : p.earlyT > 0 ? 'early' : 'filling'; }
function physics(p, dt) {
  p.t += dt;
  const g = gradeAt(p.z);
  p.kickAnim = Math.min(1, p.kickAnim + dt * 2.6);
  p.slipT = Math.max(0, p.slipT - dt); p.invT = Math.max(0, p.invT - dt); p.sameT = Math.max(0, p.sameT - dt); p.earlyT = Math.max(0, (p.earlyT || 0) - dt);
  if (p.fallT > 0) { p.fallT = Math.max(0, p.fallT - dt); p.v *= Math.exp(-8 * dt); }
  if (roadStep(p, dt)) return;
  let mu = MU + p.drag;
  if (p.vMode) mu += g < -0.01 ? 0.22 : 0.03;              // a V downhill is a snowplough
  const k = p.hold && !p.vMode ? 0.0018 : 0.0055;
  p.v += (-G * g - (mu * G + k * p.v * p.v)) * dt;
  if (p.v < 0) p.v = 0;
  p.z += p.v * dt;
  const tx = laneX(p.style, p.lane);
  p.x += clamp(tx - p.x, -9 * dt, 9 * dt);
}
// ---- The road crossing (v4) ----
// At the road's edge the skier stops (one who comes in fast falls over), takes the skis off,
// steps across the icy road (a step before the meter is green slips), and puts the skis back on;
// when snow has got into the bindings, it has to be knocked out first, a tap for each knock.
const STEP = 0.9, WALK_BEAT = 0.45;
const onRoad = p => !!(p.road && p.road !== 'done');
function roadStep(p, dt) {
  const r = course.road;
  if (!r || p.road === 'done') return false;
  if (!p.road) {
    if (p.z + p.v * dt < r.z0 - 1.2) return false;
    // Already across (put back there after a reload in a room, or by the computer): ski on.
    if (p.z > r.z1) { p.road = 'done'; return false; }
    if (p.v > 4.5 && p.fallT <= 0) { p.fallT = 1.6; p.hitRoad = true; }
    p.z = r.z0 - 1.2; p.road = 'edge'; p.roadT = 0;
  }
  p.v = 0; p.roadT += dt;
  if (p.road === 'off' && p.roadT >= 0.8) { p.road = 'walk'; p.roadT = 0; p.lastKick = p.t - 1; }
  if (p.road === 'on' && p.roadT >= 0.8) { p.road = 'done'; p.lastKick = p.t - 1; }
  if (p.road === 'walk' && p.z >= r.z1 + 0.6) { p.road = 'skison'; p.roadT = 0; }
  p.x += clamp(laneX(p.style, p.lane) - p.x, -9 * dt, 9 * dt);
  return true;
}
// A tap at the road: skis off, a step, skis on, or a knock at the snow in the bindings.
function roadTap(p) {
  if (p.fallT > 0) return null;
  if (p.road === 'edge') { p.road = 'off'; p.roadT = 0; return 'off'; }
  if (p.road === 'walk') {
    const since = p.t - p.lastKick;
    p.lastKick = p.t; p.side = -p.side; p.kickAnim = 0;
    // Ice: a step before the meter is green slips. The same moment the meter turns green.
    if (since < WALK_BEAT) { p.fallT = 1.0; p.earlyT = 0.6; return 'slip'; }
    p.z += STEP;
    return 'step';
  }
  if (p.road === 'skison') {
    if (p.clog > 0) { p.road = 'clog'; return 'clog'; }
    p.road = 'on'; p.roadT = 0; return 'on';
  }
  if (p.road === 'clog') {
    p.clog--;
    if (p.clog <= 0) { p.road = 'on'; p.roadT = 0; }
    return 'knock';
  }
  return null;
}
// A good skier: V on the steep climbs (classic), the tuck down the hills, a kick every `gap`
// seconds, a push on alternate skis when skating. Sets the par, and skis for a friend who left.
function botStep(p, dt, gap) {
  if (onRoad(p) || (course.road && !p.road && p.z > course.road.z0 - 25)) {
    // The road: slow down to it, then the same taps as a person, in the meter's rhythm.
    p.vMode = false; p.hold = false;
    if (onRoad(p) && p.t >= (p.next || 0)) { roadTap(p); p.next = p.t + (p.road === 'walk' ? WALK_BEAT + 0.02 : 0.3); }
    else if (!onRoad(p) && p.v < 2.5 && p.t >= (p.next || 0)) { if (p.style === 'luistelu') push(p, -p.side); else kick(p); p.next = p.t + gap; }
    physics(p, dt);
    return;
  }
  const g = gradeAt(p.z + 2);
  p.vMode = p.style !== 'luistelu' && g > 0.075; p.hold = g < -0.02;
  if (!p.hold && p.t >= (p.next || 0)) {
    if (p.style === 'luistelu') push(p, -p.side); else kick(p);
    p.next = p.t + gap;
  }
  physics(p, dt);
}
// The time a good skier needs with the right wax and nobody on the trail; it sets the par.
function idealTime() {
  const p = newSkier(), gap = skating() ? 0.34 : 0.4;
  for (let i = 0; i < 60 * 1200 && p.z < course.len; i++) botStep(p, 1 / 60, gap);
  return p.t;
}

// ---- Others on the trail ----
const GRANNY_COATS = ['#8e3b6b', '#b5533c', '#5b6b3a', '#6a4b8c', '#3b6b8e'], GRANNY_HATS = ['#d13b3b', '#f0f0f0', '#e2b53b', '#3bb0d1'];
const GRANNY_LINES = ['Kylläpä on kiire!', 'Hyvää päivänjatkoa!', 'Nuoret ne menee…', 'Hyvä keli tänään!', 'Muista voidella!', 'No hei vaan!'];
const OTHER_COATS = ['#2d7d46', '#c0392b', '#2c3e50', '#d35400', '#16a085', '#7f8c8d'];
const SKATE_SUITS = ['#e0302f', '#f2b705', '#18a0a0', '#1d1d1d', '#e05aa0'];
let npcs, nextVasta, nextSkate, bubbles, popups, passes, falls, mode, countT, resultT, result, clock = 0, snow, R;

function slopeFactor(g) { return g > 0 ? Math.max(0.35, 1 - 6 * g) : Math.min(2.5, 1 - 9 * g); }
function pick(a) { return a[Math.floor(R() * a.length)]; }
function addGranny(z) { npcs.push({ kind: 'mummo', z, lane: 1, x: LX[1], base: 1.7 + R() * 0.6, v: 0, coat: pick(GRANNY_COATS), hat: pick(GRANNY_HATS), ph: R(), passed: false }); }
function addVasta(z) { npcs.push({ kind: 'vasta', z, lane: 0, x: LX[0], base: 3 + R() * 1.6, v: 0, coat: pick(OTHER_COATS), hat: pick(GRANNY_HATS), ph: R(), passed: false }); }
function addSkater(z) { npcs.push({ kind: 'luistelija', z, lane: 2, x: LX[2], base: 6.6 + R() * 1.6, v: 0, coat: pick(SKATE_SUITS), hat: pick(SKATE_SUITS), ph: R(), passed: false, shout: false }); }
// Skating (v3): slower fitness skaters in the skating lane, on either half, to overtake.
function addSlow(z) { const lane = 1 + Math.floor(R() * 2); npcs.push({ kind: 'luistelija', slow: true, z, lane, x: LS[lane], base: 3.6 + R() * 1.4, v: 0, coat: pick(SKATE_SUITS), hat: pick(GRANNY_HATS), ph: R(), passed: false }); }
const SLOW_LINES = ['Hyvin menee!', 'Vauhtia riittää!', 'Hei hei!', 'Mennään, mennään!'];

    sky.addColorStop(0, wx.grey ? '#8f9cab' : '#5e9ad8'); sky.addColorStop(0.3, '#dee7f1'); sky.addColorStop(1, '#f2f6fb');
    x.fillStyle = sky; x.fillRect(0, 0, W, H);
    if (no3d && mode !== 'wax') shadowText('Tämä puhelin ei osaa piirtää 3D-kuvaa.', W / 2, H * 0.52, 15, '#ffffff', 'center', 700);
  }
  // Friends' names over their heads, while near enough to read.
  if (net) for (const k of net.skiers) {
    if (k.kind === 'me' || k.z < P.z - 2 || k.z > P.z + 60) continue;
    const p = screenOf(Math.min(k.z, course.len + 30), k.x, 2.15);
    if (p) shadowText(k.name, p.x, p.y, clamp(150 / p.d, 10, 14), '#ffffff', 'center', 800);
  }
  for (const b of bubbles) {
    const o = b.o; if (o.z < P.z - CAM_BACK3 + 1) continue;
    const p = screenOf(o.z, o.x, 2.0);
    if (p) bubble(b.text, p.x, p.y - 6, Math.min(1, (2 - b.t) * 3));
  }
  if (wx.snowing) {
    x.fillStyle = 'rgba(255,255,255,0.85)';
    for (const s of snow) {
      const sy = ((s[1] * H + clock * 40 * s[2] + P.z * 6 * s[2]) % H), sx = ((s[0] * W + Math.sin(clock + s[1] * 9) * 12) % W + W) % W;
      x.beginPath(); x.arc(sx, sy, 1.2 * s[2] + 0.5, 0, TAU); x.fill();
    }
  }
  drawHud();
  if (mode === 'wax') drawWax();
  if (mode === 'ready' || mode === 'netwait') drawWait();
  if (mode === 'done') drawResult();
}

function text(t, px, py, size, col, align, weight) {
  x.font = `${weight || 600} ${size}px system-ui,sans-serif`;
  x.fillStyle = col; x.textAlign = align || 'center'; x.textBaseline = 'middle';
  x.fillText(t, px, py);
}
function bubble(t, px, py, a) {
  x.globalAlpha = clamp(a, 0, 1);
  x.font = '700 13px system-ui,sans-serif';
  const w = x.measureText(t).width + 14, bx = clamp(px - w / 2, 4, W - w - 4), by = Math.max(SAFE_T + 4, py - 26);
  x.fillStyle = '#fff'; x.strokeStyle = '#33415c'; x.lineWidth = 1.5;
  x.beginPath(); x.roundRect(bx, by, w, 22, 9); x.fill(); x.stroke();
  text(t, bx + w / 2, by + 11, 13, '#1b2240', 'center', 700);
  x.globalAlpha = 1;
}
function shadowText(t, px, py, size, col, align, weight) {
  x.save(); x.shadowColor = 'rgba(0,0,0,0.55)'; x.shadowBlur = 4; text(t, px, py, size, col, align, weight); x.restore();
}

// The hint for what the trail asks of the skier right now.
function hint() {
  if (mode !== 'race') return null;
  const g = gradeAt(P.z), ahead = gradeAt(P.z + 6);
  if (P.fallT > 0) return ['Kaatuminen! Noustaan ylös…', '#ffb0b0'];
  if (onRoad(P)) return ({
    edge: ['Tie! Napauta: sukset pois', '#ffd45c'], off: ['Sukset pois…', '#ffffff'],
    walk: meter(P) === 'early' ? ['Liukas tie! Odota vihreää', '#ffb0b0'] : ['Jäinen tie: askel, kun palkki on vihreä', '#ffd45c'],
    skison: ['Napauta: sukset jalkaan', '#ffd45c'], clog: [`Lunta siteissä! Kopistele: ${P.clog} ×`, '#9fd8ff'], on: ['Sukset jalkaan…', '#ffffff'],
  })[P.road];
  if (course.road && !P.road && course.road.z0 - P.z < 45) return ['Tie edessä: hidasta!', '#ffd45c'];
  if (skating()) {
    if (P.sameT > 0) return ['Vuorotellen: vasen, oikea, vasen…', '#ffd45c'];
    if (meter(P) === 'early') return ['Liian tiheään: odota vihreää', '#ffb0b0'];
    if (P.lane === 0) return ['Perinteisen latu: pyyhkäise oikealle', '#ffd45c'];
    if (g < -0.025) return [P.hold ? 'Laskuasento, luistaa!' : 'Alamäki: pidä sormea ruudulla', '#ffffff'];
    return ['Napauta vuorotellen vasen ja oikea puoli', '#ffffff'];
  }
  const behind = npcs.find(o => o.kind === 'luistelija' && !o.slow && P.lane === 2 && o.z < P.z && o.z > P.z - 25 && o.v > P.v);
  if (behind) return ['Takaa tulee luistelija!', '#ffb0b0'];
  if (P.slipT > 0 && !P.vMode) return ['Lipsuu! Paina V ja tee V-käyntiä', '#ffd45c'];
  if (meter(P) === 'early') return ['Liian tiheään: odota vihreää', '#ffb0b0'];
  if (!P.vMode && Math.max(g, ahead) > 0.075) return ['Jyrkkä ylämäki: paina V', '#ffd45c'];
  if (P.vMode && g < -0.02) return ['Alamäki: V pois, niin luistaa', '#ffd45c'];
  if (P.vMode && Math.max(g, ahead) < 0.03) return ['Mäki loppui: V pois', '#ffd45c'];
  if (g < -0.025) return [P.hold ? 'Laskuasento, luistaa!' : 'Alamäki: pidä sormea ruudulla', '#ffffff'];
  return ['Napauta tahdissa · pyyhkäise: kaista', '#ffffff'];
}

// My place among friends right now: finished ones by time, the rest by how far they are.
function livePlace() {
  const me = synced(meK());
  return 1 + net.skiers.filter(k => k !== me && (k.fin !== null ? me.fin === null || finOrder(k) < finOrder(me) : me.fin === null && k.z > me.z)).length;
}

function drawHud() {
  const top = SAFE_T + 18;
  if (mode === 'race' || mode === 'done' || mode === 'count') {
    shadowText(fmtTime(P.t), W - 12, top, 20, '#ffffff', 'right', 800);
    shadowText(`Maaliin ${Math.max(0, Math.ceil(course.len - P.z))} m`, W - 12, top + 20, 12, '#ffffff', 'right');
    // The speed (v4) at the top in the middle, where the eye is, with the level or place under it.
    shadowText(`${Math.round((mode === 'race' ? P.v : 0) * 3.6)} km/h`, W / 2 - 6, top, 22, '#ffffff', 'center', 900);
    const head = net ? `sija ${livePlace()}/${net.skiers.length}` : `Taso ${level} · raja ${fmtTime(course.par)}`;
    shadowText(head, W / 2 - 6, top + 21, 12, '#ffffff', 'center');
  }
  // The trail ahead: the next 300 m from the side, steep climbs in red.
  const pw = LAND ? Math.min(W - 24, 460) : W - 24, px0 = (W - pw) / 2, py0 = top + 34, ph = 34, z0 = P.z - 20, z1 = P.z + 280;
  let lo = 1e9, hi = -1e9;
  for (let z = z0; z <= z1; z += 4) { const h = heightAt(z); lo = Math.min(lo, h); hi = Math.max(hi, h); }
  const span = Math.max(8, hi - lo), mid = (hi + lo) / 2;
  const sxz = z => px0 + (z - z0) / (z1 - z0) * pw, syh = h => py0 + ph / 2 - (h - mid) / span * (ph - 6);
  x.fillStyle = 'rgba(20,30,55,0.35)'; x.beginPath(); x.roundRect(px0 - 4, py0 - 4, pw + 8, ph + 8, 8); x.fill();
  x.lineWidth = 2.5; x.lineCap = 'round';
  for (let z = z0; z < z1; z += 4) {
    if (z > course.len + 4) break;
    const g = gradeAt(z);
    x.strokeStyle = g > 0.075 ? '#ff6b6b' : g > 0.03 ? '#ffd45c' : g < -0.03 ? '#7fd4ff' : '#ffffff';
    x.beginPath(); x.moveTo(sxz(z), syh(heightAt(z))); x.lineTo(sxz(z + 4), syh(heightAt(z + 4))); x.stroke();
  }
  if (course.road && course.road.z1 > z0 && course.road.z0 < z1) { x.fillStyle = '#5c6572'; x.fillRect(sxz(course.road.z0), py0 - 2, Math.max(4, sxz(course.road.z1) - sxz(course.road.z0)), ph + 4); }
  if (course.len < z1) { x.fillStyle = '#d62845'; x.fillRect(sxz(course.len) - 1, py0 - 2, 3, ph + 4); }
  // Friends on the profile, in their colours.
  if (net) for (const k of net.skiers) {
    if (k.kind === 'me' || k.z < z0 || k.z > z1) continue;
    x.fillStyle = k.color; x.strokeStyle = '#fff'; x.lineWidth = 1.5;
    x.beginPath(); x.arc(sxz(Math.min(k.z, course.len)), syh(heightAt(k.z)), 4, 0, TAU); x.fill(); x.stroke();
  }
  x.fillStyle = net ? meK().color : '#1f4fa8'; x.strokeStyle = '#fff'; x.lineWidth = 2;
  x.beginPath(); x.arc(sxz(P.z), syh(heightAt(P.z)), 5, 0, TAU); x.fill(); x.stroke();
  const hn = hint();
  if (hn) shadowText(hn[0], W / 2, py0 + ph + 20, 15, hn[1], 'center', 700);
  // The rhythm meter (v4): fills after each tap and turns green when the next one is at full strength.
  if (mode === 'race' && !(P.hold && P.fallT <= 0 && !onRoad(P)) && (!onRoad(P) || P.road === 'walk')) {
    const r = rhythmBar(), f = beat(P), m = meter(P), ready = m === 'ready', early = m === 'early';
    x.fillStyle = 'rgba(20,30,55,0.45)'; x.beginPath(); x.roundRect(r.x, r.y, r.w, r.h, r.h / 2); x.fill();
    x.fillStyle = early ? '#ff8a8a' : ready ? '#7ef0a0' : '#ffd45c';
    x.beginPath(); x.roundRect(r.x, r.y, Math.max(r.h, r.w * f), r.h, r.h / 2); x.fill();
    x.strokeStyle = '#fff'; x.lineWidth = 1.5; x.beginPath(); x.roundRect(r.x, r.y, r.w, r.h, r.h / 2); x.stroke();
    shadowText(ready ? 'Nyt!' : 'Tahti', r.x + r.w + 8, r.y + r.h / 2, 13, ready ? '#7ef0a0' : '#ffffff', 'left', 800);
  }
  for (const p of popups) { x.globalAlpha = 1 - p.t / 1.3; shadowText(p.text, W / 2, H * 0.42 - p.t * 30, 24, p.col, 'center', 800); x.globalAlpha = 1; }
  if (mode === 'count') shadowText(countT > 0.2 ? String(Math.ceil(countT)) : 'Hiihdä!', W / 2, H * 0.4, 64, '#ffd45c', 'center', 900);
  if (mode === 'count') shadowText(skating() ? 'Vuorotellen vasen ja oikea puoli,' : 'Napauta tahdissa,', W / 2, H * 0.4 + 52, 14, '#ffffff', 'center', 700);
  if (mode === 'count') shadowText('aina kun tahtipalkki on vihreä', W / 2, H * 0.4 + 72, 14, '#ffffff', 'center', 700);
  const ask = mode === 'race' && P.fallT <= 0 && { edge: '👟 Sukset pois', skison: '⛷ Sukset jalkaan', clog: `❄ Kopistele (${P.clog})` }[P.road];
  if (ask) {
    // The road's one action, big in the middle: a tap anywhere does it.
    // Landscape (v8): low on the right, under the thumb, clear of the skier in the middle.
    const w = 230, h = 54, bx = LAND ? W - SAFE_R - w - 16 : (W - w) / 2, by = LAND ? H - SAFE_B - h - 46 : H * 0.6;
    x.fillStyle = '#ffd45c'; x.strokeStyle = '#fff'; x.lineWidth = 3;
    x.beginPath(); x.roundRect(bx, by, w, h, h / 2); x.fill(); x.stroke();
    text(ask, bx + w / 2, by + h / 2 + 1, 20, '#1b2240', 'center', 900);
  }
  if ((mode === 'race' || mode === 'count') && !onRoad(P)) {
    if (skating()) {
      // Which ski pushed last: the next push is on the other one. Each pad sits in the half of the
      // screen that pushes that ski, so a tap on it pushes the ski it names.
      for (const r of skatePads()) {
        const next = P.side !== r.side;
        x.fillStyle = next ? '#ffd45c' : 'rgba(20,30,55,0.55)'; x.strokeStyle = '#fff'; x.lineWidth = 2;
        x.beginPath(); x.roundRect(r.x, r.y, r.w, r.h, r.h / 2); x.fill(); x.stroke();
        text(r.side < 0 ? '‹ vasen' : 'oikea ›', r.x + r.w / 2, r.y + r.h / 2, 13, next ? '#1b2240' : '#fff', 'center', 800);
      }
    } else {
      const b = vButton();
      x.fillStyle = P.vMode ? '#ffd45c' : 'rgba(20,30,55,0.55)'; x.strokeStyle = '#fff'; x.lineWidth = 3;
      x.beginPath(); x.arc(b.x, b.y, b.r, 0, TAU); x.fill(); x.stroke();
      text('V', b.x, b.y - 5, 30, P.vMode ? '#1b2240' : '#fff', 'center', 900);
      text(P.vMode ? 'päällä' : 'V-käynti', b.x, b.y + 20, 10, P.vMode ? '#1b2240' : '#fff', 'center', 700);
    }
    const w = waxList()[P.wax ?? 0];
    const wy = H - SAFE_B - (LAND ? 58 : 50);
    x.fillStyle = w.col; x.beginPath(); x.roundRect(W - SAFE_R - 92, wy, 78, 22, 11); x.fill();
    text(w.name, W - SAFE_R - 53, wy + 11, 12, '#fff', 'center', 700);
  }
}

function panel(px, py, pw, ph) {
  x.fillStyle = 'rgba(14,22,44,0.92)'; x.strokeStyle = '#ffd45c'; x.lineWidth = 2;
  x.beginPath(); x.roundRect(px, py, pw, ph, 14); x.fill(); x.stroke();
}
function pill(r, label, on, col) {
  x.fillStyle = on ? (col || '#ffd45c') : 'rgba(255,255,255,0.1)'; x.strokeStyle = on ? (col || '#ffd45c') : 'rgba(255,255,255,0.35)'; x.lineWidth = 1.5;
  x.beginPath(); x.roundRect(r.x, r.y, r.w, r.h, r.h / 2); x.fill(); x.stroke();
  text(label, r.x + r.w / 2, r.y + r.h / 2 + 1, 15, on ? '#1b2240' : '#ffffff', 'center', 800);
}

// Before the start: the style (alone), the course and its weather, and the wax for it.
function drawWax() {
  if (LAND) return drawWaxLand();
  const wx = course.weather, solo = !net, S = starsOf(), B = bestsOf(), st = S[level] || 0;
  const ph = Math.min(H - SAFE_T - SAFE_B - 70, 372 + (st ? 18 : 0) + (solo ? 100 : 0)), pw = Math.min(W - 24, 360);
  const px = (W - pw) / 2, py = SAFE_T + 50 + Math.max(0, (H - SAFE_T - SAFE_B - 70 - ph) / 2);
  panel(px, py, pw, ph);
  let y = py + 14;
  ui.styles = [];
  if (solo) {
    const gap = 10, bw = (pw - 32 - gap) / 2;
    ui.styles = ['perinteinen', 'luistelu'].map((s, i) => ({ x: px + 16 + i * (bw + gap), y, w: bw, h: 36, style: s }));
    ui.styles.forEach(r => pill(r, STYLE_NAME[r.style], r.style === style));
    y += 36 + 28;
  } else y += 14;
  ui.prev = solo && level > 1 ? { x: px + 6, y: y - 20, w: 44, h: 40 } : null;
  ui.next = solo && level < maxLevel ? { x: px + pw - 50, y: y - 20, w: 44, h: 40 } : null;
  if (ui.prev) text('‹', px + 28, y, 28, '#ffd45c', 'center', 800);
  if (ui.next) text('›', px + pw - 28, y, 28, '#ffd45c', 'center', 800);
  text(solo ? `Taso ${level}` : `👥 Taso ${level} · ${STYLE_NAME[style]}`, W / 2, y, solo ? 22 : 19, '#ffd45c', 'center', 800);
  y += 24;
  text(`${course.len} m · aikaraja ${fmtTime(course.par)}${B[level] !== undefined ? ' · paras ' + fmtTime(B[level]) : ''}`, W / 2, y, 12, '#b8c2e0');
  if (st) { y += 18; text('★'.repeat(st) + '☆'.repeat(3 - st), W / 2, y, 16, '#ffd45c'); }
  y += 40;
  text(`${wx.T > 0 ? '+' : ''}${fmt(wx.T, Number.isInteger(wx.T) ? 0 : 1)} °C`, W / 2, y, 34, wx.T > 0 ? '#ffb0b0' : '#9fd8ff', 'center', 800);
  y += 30;
  text(wx.desc, W / 2, y, 14, '#ffffff');
  if (course.road) { text('Radalla tie: sukset pois ja varovasti yli', W / 2, y + 19, 12, '#ffd45c', 'center', 700); y += 14; }
  y += 32;
  text(skating() ? 'Valitse luistovoide' : 'Valitse pitovoide', W / 2, y, 16, '#ffd45c', 'center', 700);
  y += 16;
  // Alone, the friends button sits well clear of the wax buttons (v5: 30 px, was 8 px).
  const foot = solo ? 44 + 58 + 22 : 44;
  const gap = 10, bw = (pw - 32 - gap) / 2, bh = Math.max(52, Math.min(70, (py + ph - foot - y - gap) / 2));
  ui.wax = waxList().map((w, i) => {
    const r = { x: px + 16 + (i % 2) * (bw + gap), y: y + Math.floor(i / 2) * (bh + gap), w: bw, h: bh };
    x.fillStyle = w.col; x.beginPath(); x.roundRect(r.x, r.y, r.w, r.h, 10); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.85)'; x.beginPath(); x.roundRect(r.x + 8, r.y + 8, 14, r.h - 16, 4); x.fill();
    text(w.name, r.x + r.w / 2 + 8, r.y + r.h / 2 - 9, 16, '#fff', 'center', 800);
    text(w.range, r.x + r.w / 2 + 8, r.y + r.h / 2 + 11, 11, '#fff', 'center', 600);
    return r;
  });
  ui.friends = null;
  if (solo && RM) {
    ui.friends = { x: px + 16, y: py + ph - 44 - 50, w: pw - 32, h: 44 };
    pill(ui.friends, '👥 Pelaa kavereiden kanssa', true, '#8ecae6');
  }
  text(skating() ? 'Vuorotellen vasen ja oikea, alamäkeen sormi ruudulle' : 'Ylämäkeen V, alamäkeen sormi ruudulle', W / 2, py + ph - 18, 12, '#b8c2e0');
}

// Waxed, and waiting for the others (or for the host to say which course).
function drawWait() {
  const pw = Math.min(W - 24, 320), ph = 150, px = (W - pw) / 2, py = SAFE_T + Math.max(60, (H - SAFE_T - SAFE_B - ph) / 2);
  panel(px, py, pw, ph);
  if (mode === 'netwait' || !net) { text('Odotetaan kisan alkua…', W / 2, py + ph / 2, 18, '#ffd45c', 'center', 800); return; }
  text('Voideltu!', W / 2, py + 34, 22, '#7ef0a0', 'center', 800);
  const left = net.skiers.filter(k => k.wax < 0).map(k => k.name);
  text('Odotetaan, että kaikki voitelevat:', W / 2, py + 72, 14, '#ffffff');
  // v6: with many friends still waxing, as many names as fit and how many more.
  let line = left.length ? left.join(', ') : 'lähtö tulee!';
  x.font = '700 15px system-ui,sans-serif';
  for (let n = left.length - 1; n > 0 && x.measureText(line).width > pw - 24; n--) line = `${left.slice(0, n).join(', ')} +${left.length - n}`;
  text(line, W / 2, py + 98, 15, '#ffd45c', 'center', 700);
  text(`${STYLE_NAME[style]} · taso ${level}`, W / 2, py + ph - 20, 12, '#b8c2e0');
}

function drawResult() {
  if (net) return LAND ? drawNetResultLand() : drawNetResult();
  if (LAND) return drawResultLand();
  const r = result, pw = Math.min(W - 24, 340), ph = 300;
  const px = (W - pw) / 2, py = SAFE_T + Math.max(60, (H - SAFE_T - SAFE_B - ph) / 2);
  panel(px, py, pw, ph);
  let y = py + 32;
  text(r.passed ? 'Maalissa!' : 'Aikaraja ylittyi', W / 2, y, 24, r.passed ? '#7ef0a0' : '#ff8a8a', 'center', 800);
  y += 44;
  text(fmtTime(r.t), W / 2, y, 36, '#ffd45c', 'center', 800);
  y += 30;
  text(r.stars ? '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : `aikaraja ${fmtTime(course.par)}`, W / 2, y, r.stars ? 24 : 14, '#ffd45c');
  y += 32;
  text(`Ohitukset: ${passes}`, W / 2, y, 15, '#ffffff'); y += 22;
  text(`Kaatumiset: ${falls}`, W / 2, y, 15, falls ? '#ffb0b0' : '#ffffff'); y += 22;
  text(r.note, W / 2, y, 13, '#b8c2e0'); y += 22;
  if (r.record) text('Uusi ennätys!', W / 2, y, 15, '#7ef0a0');
  if (resultT > 0.8) text(r.passed ? 'Napauta: seuraava taso' : 'Napauta: yritä uudestaan', W / 2, py + ph - 20, 14, '#ffd45c');
}
// With friends: everyone's place, live until the race ends.
function drawNetResult() {
  const list = net.res || standings(), n = list.length, r = result;
  const pw = Math.min(W - 24, 340), ph = 168 + 26 * n, px = (W - pw) / 2, py = SAFE_T + Math.max(60, (H - SAFE_T - SAFE_B - ph) / 2);
  panel(px, py, pw, ph);
  const i = placeOf(list, RM.me);
  let y = py + 32;
  const title = r.t === null ? 'Et ehtinyt maaliin' : r.cpu ? (net.res ? `${i}. sija` : 'Maalissa') : net.res ? (i === 1 ? 'Voitit! 🏆' : `${i}. sija`) : 'Maalissa!';
  text(title, W / 2, y, 24, r.t !== null && i === 1 ? '#7ef0a0' : r.t === null ? '#ff8a8a' : '#ffffff', 'center', 800);
  y += 38;
  if (r.t !== null) text(fmtTime(r.t) + (r.stars ? '  ' + '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : ''), W / 2, y, 22, '#ffd45c', 'center', 800);
  y += 34;
  list.forEach((o, j) => {
    const me = o.id === RM.me, col = net.skiers.find(k => k.id === o.id)?.color || o.color;
    x.fillStyle = col; x.beginPath(); x.arc(px + 28, y, 6, 0, TAU); x.fill();
    text(`${j + 1}. ${me ? 'Sinä' : o.name}`, px + 42, y, 15, me ? '#ffd45c' : '#ffffff', 'left', me ? 800 : 600);
    text(o.fin !== null ? fmtTime(o.fin) : `${o.z} m`, px + pw - 18, y, 15, o.fin !== null ? '#ffffff' : '#b8c2e0', 'right', 700);
    y += 26;
  });
  if (r.note) text(r.note, W / 2, y + 8, 12, '#b8c2e0');
  const foot = net.res ? (resultT > 0.8 ? 'Napauta: takaisin huoneeseen' : '') : 'Odotetaan muita maaliin…';
  if (foot) text(foot, W / 2, py + ph - 20, 14, '#ffd45c');
}

// ---- Landscape (v8): the same screens, side by side in two columns ----
// The box a landscape panel may use: under the back chip, above the Tulokset chip.
function landBox(pw, ph) {
  const top = SAFE_T + 38, bot = H - SAFE_B - 36, room = bot - top;
  ph = Math.min(ph, room);
  return { px: SAFE_L + (W - SAFE_L - SAFE_R - pw) / 2, py: top + Math.max(0, (room - ph) / 2), pw, ph };
}
function drawWaxLand() {
  const wx = course.weather, solo = !net, S = starsOf(), B = bestsOf(), st = S[level] || 0;
  const { px, py, pw, ph } = landBox(Math.min(W - SAFE_L - SAFE_R - 24, 640), 266);
  panel(px, py, pw, ph);
  const cw = (pw - 48) / 2, lx = px + 16, rx = lx + cw + 16, lc = lx + cw / 2, rc = rx + cw / 2;
  // Left: the style, the course and its weather.
  let y = py + 14;
  ui.styles = [];
  if (solo) {
    const gap = 10, bw = (cw - gap) / 2;
    ui.styles = ['perinteinen', 'luistelu'].map((s, i) => ({ x: lx + i * (bw + gap), y, w: bw, h: 36, style: s }));
    ui.styles.forEach(r => pill(r, STYLE_NAME[r.style], r.style === style));
    y += 36 + 26;
  } else y += 18;
  ui.prev = solo && level > 1 ? { x: lx - 10, y: y - 20, w: 44, h: 40 } : null;
  ui.next = solo && level < maxLevel ? { x: lx + cw - 34, y: y - 20, w: 44, h: 40 } : null;
  if (ui.prev) text('‹', lx + 12, y, 28, '#ffd45c', 'center', 800);
  if (ui.next) text('›', lx + cw - 12, y, 28, '#ffd45c', 'center', 800);
  text(solo ? `Taso ${level}` : `👥 Taso ${level} · ${STYLE_NAME[style]}`, lc, y, solo ? 22 : 19, '#ffd45c', 'center', 800);
  y += 24;
  text(`${course.len} m · aikaraja ${fmtTime(course.par)}${B[level] !== undefined ? ' · paras ' + fmtTime(B[level]) : ''}`, lc, y, 12, '#b8c2e0');
  if (st) { y += 18; text('★'.repeat(st) + '☆'.repeat(3 - st), lc, y, 16, '#ffd45c'); }
  y += 38;
  text(`${wx.T > 0 ? '+' : ''}${fmt(wx.T, Number.isInteger(wx.T) ? 0 : 1)} °C`, lc, y, 34, wx.T > 0 ? '#ffb0b0' : '#9fd8ff', 'center', 800);
  y += 30;
  text(wx.desc, lc, y, 14, '#ffffff');
  if (course.road) text('Radalla tie: sukset pois ja varovasti yli', lc, y + 20, 12, '#ffd45c', 'center', 700);
  // Right: the wax, and friends under it.
  text(skating() ? 'Valitse luistovoide' : 'Valitse pitovoide', rc, py + 26, 16, '#ffd45c', 'center', 700);
  const gap = 10, bw = (cw - gap) / 2, top = py + 44, foot = solo && RM ? 12 + 44 : 0;
  const bh = clamp((py + ph - 34 - foot - top - gap) / 2, 44, 60);
  ui.wax = waxList().map((w, i) => {
    const r = { x: rx + (i % 2) * (bw + gap), y: top + Math.floor(i / 2) * (bh + gap), w: bw, h: bh };
    x.fillStyle = w.col; x.beginPath(); x.roundRect(r.x, r.y, r.w, r.h, 10); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.85)'; x.beginPath(); x.roundRect(r.x + 8, r.y + 8, 14, r.h - 16, 4); x.fill();
    text(w.name, r.x + r.w / 2 + 8, r.y + r.h / 2 - 9, 16, '#fff', 'center', 800);
    text(w.range, r.x + r.w / 2 + 8, r.y + r.h / 2 + 11, 11, '#fff', 'center', 600);
    return r;
  });
  ui.friends = null;
  if (solo && RM) {
    ui.friends = { x: rx, y: top + 2 * bh + gap + 12, w: cw, h: 44 };
    pill(ui.friends, '👥 Pelaa kavereiden kanssa', true, '#8ecae6');
  }
  text(skating() ? 'Vuorotellen vasen ja oikea, alamäkeen sormi ruudulle' : 'Ylämäkeen V, alamäkeen sormi ruudulle', px + pw / 2, py + ph - 16, 12, '#b8c2e0');
}
function drawResultLand() {
  const r = result, { px, py, pw, ph } = landBox(Math.min(W - SAFE_L - SAFE_R - 24, 560), 206);
  panel(px, py, pw, ph);
  const lc = px + pw * 0.3, rc = px + pw * 0.72;
  text(r.passed ? 'Maalissa!' : 'Aikaraja ylittyi', lc, py + 34, 24, r.passed ? '#7ef0a0' : '#ff8a8a', 'center', 800);
  text(fmtTime(r.t), lc, py + 78, 36, '#ffd45c', 'center', 800);
  text(r.stars ? '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : `aikaraja ${fmtTime(course.par)}`, lc, py + 112, r.stars ? 24 : 14, '#ffd45c');
  text(`Ohitukset: ${passes}`, rc, py + 46, 15, '#ffffff');
  text(`Kaatumiset: ${falls}`, rc, py + 72, 15, falls ? '#ffb0b0' : '#ffffff');
  if (r.record) text('Uusi ennätys!', rc, py + 98, 15, '#7ef0a0');
  text(r.note, px + pw / 2, py + 146, 13, '#b8c2e0');
  if (resultT > 0.8) text(r.passed ? 'Napauta: seuraava taso' : 'Napauta: yritä uudestaan', px + pw / 2, py + ph - 20, 14, '#ffd45c');
}
function drawNetResultLand() {
  const list = net.res || standings(), n = list.length, r = result;
  const { px, py, pw, ph } = landBox(Math.min(W - SAFE_L - SAFE_R - 24, 600), Math.max(170, 44 + 26 * n));
  panel(px, py, pw, ph);
  const i = placeOf(list, RM.me), lw = pw * 0.44, lc = px + lw / 2 + 8;
  const title = r.t === null ? 'Et ehtinyt maaliin' : r.cpu ? (net.res ? `${i}. sija` : 'Maalissa') : net.res ? (i === 1 ? 'Voitit! 🏆' : `${i}. sija`) : 'Maalissa!';
  text(title, lc, py + 34, 24, r.t !== null && i === 1 ? '#7ef0a0' : r.t === null ? '#ff8a8a' : '#ffffff', 'center', 800);
  if (r.t !== null) text(fmtTime(r.t) + (r.stars ? '  ' + '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars) : ''), lc, py + 72, 22, '#ffd45c', 'center', 800);
  if (r.note) text(r.note, lc, py + 104, 12, '#b8c2e0');
  const foot = net.res ? (resultT > 0.8 ? 'Napauta: takaisin huoneeseen' : '') : 'Odotetaan muita maaliin…';
  if (foot) text(foot, lc, py + ph - 22, 14, '#ffd45c');
  // Right: everyone's place.
  const l0 = px + lw + 16, top = py + (ph - 26 * (n - 1)) / 2;
  list.forEach((o, j) => {
    const me = o.id === RM.me, col = net.skiers.find(k => k.id === o.id)?.color || o.color, y = top + 26 * j;
    x.fillStyle = col; x.beginPath(); x.arc(l0 + 8, y, 6, 0, TAU); x.fill();
    text(`${j + 1}. ${me ? 'Sinä' : o.name}`, l0 + 22, y, 15, me ? '#ffd45c' : '#ffffff', 'left', me ? 800 : 600);
    text(o.fin !== null ? fmtTime(o.fin) : `${o.z} m`, px + pw - 18, y, 15, o.fin !== null ? '#ffffff' : '#b8c2e0', 'right', 700);
  });
}

// ---- Loop ----
newRace();
let lastT = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000); tune(t - lastT); lastT = t;
  step(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
