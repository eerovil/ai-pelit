<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lattia on laavaa</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1a0a06;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  body.playing #ai-pelit-tulokset-nappi{display:none}
  .screen{position:fixed;top:0;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    padding:calc(env(safe-area-inset-top,0px) + 52px) calc(env(safe-area-inset-right,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 18px) calc(env(safe-area-inset-left,0px) + 18px);
    box-sizing:border-box;background:linear-gradient(rgba(40,8,0,.62),rgba(40,8,0,.2) 40%,rgba(40,8,0,.7))}
  .screen[hidden]{display:none}
  .head{display:flex;flex-direction:column;align-items:center;gap:8px}
  h1{margin:0;font-size:38px;font-weight:900;letter-spacing:.5px;text-align:center;line-height:1.05;text-shadow:0 3px 0 #b8300a,0 6px 14px rgba(0,0,0,.45)}
  h1 span{color:#ff7a1a}
  .sub{margin:-2px 0 2px;font-size:14px;opacity:.92;text-align:center;max-width:320px;line-height:1.35}
  .col{display:flex;flex-direction:column;gap:9px;align-items:stretch;width:100%;max-width:330px}
  button{font:700 17px system-ui,sans-serif;border:0;border-radius:14px;padding:13px 16px;color:#fff;background:rgba(255,255,255,.17);touch-action:manipulation}
  button.big{background:#ff5a1f;font-size:21px;padding:15px;box-shadow:0 4px 0 #a8300a}
  button.room{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:10px 14px}
  button.room small{font-weight:500;font-size:13px;opacity:.85;text-align:right}
  button.room.on{background:rgba(255,209,102,.28);outline:2px solid #ffd166}
  button:disabled{opacity:.55}
  #endTitle{font-size:32px;font-weight:900;margin:0;text-align:center}
  #endNote,#endOpen{margin:0;font-size:16px;font-weight:700;color:#ffd166;text-align:center}
  #endList{list-style:none;margin:0;padding:0;width:100%;max-width:330px;max-height:42vh;overflow:auto}
  #endList li{display:flex;justify-content:space-between;align-items:center;padding:5px 10px;border-radius:10px;font-size:16px}
  #endList li.me{background:rgba(255,209,102,.22);font-weight:700}
  #endList li i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
  #endList li b{color:#ffd166;letter-spacing:.5px}
  body.land .screen{flex-direction:row;flex-wrap:wrap;align-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 12px);gap:8px 28px}
  body.land .screen>.head{flex:0 0 260px}
  body.land h1{font-size:30px}
  body.land #rooms{gap:5px}
  body.land button.room{padding:6px 12px}
  body.land button.big{padding:11px}
  body.land .col{gap:6px}
  body.land #menu .col button:not(.room){padding:9px 14px}
  body.land #endList{max-height:56vh}
</style>
</head>
<body>
<canvas id="g" style="pointer-events:none"></canvas>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="menu" class="screen" hidden>
  <div class="head">
    <h1>Lattia on <span>laavaa!</span></h1>
    <p class="sub">Hypi huonekalulta toiselle. Huonekalut uppoavat yksi kerrallaan ja laava nousee. Viimeinen kuivilla jaloilla voittaa.</p>
  </div>
  <div class="col">
    <div id="rooms" class="col"></div>
    <button id="go" class="big">Pelaa!</button>
    <button id="friends">👥 Pelaa kavereiden kanssa</button>
    <button id="asu">👕 Asu</button>
  </div>
</div>
<div id="end" class="screen" hidden>
  <div class="head">
    <p id="endTitle"></p>
    <p id="endNote"></p>
    <p id="endOpen" hidden></p>
  </div>
  <div class="col">
    <ol id="endList"></ol>
    <button id="again" class="big">Uusi kierros</button>
    <button id="toMenu">Valitse huone</button>
  </div>
</div>
<script src="../../../rooms.js" data-game="lattia-on-laavaa" data-min="2" data-max="8"></script>
<script src="../../../outfits.js" data-game="lattia-on-laavaa" data-share="3d"></script>
<script src="../../../lib/asut3d-1/asut3d.js"></script>
<script src="../../../lib/aanet-5/aanet.js"></script>
<script src="../../../lib/sulava-1/sulava.js"></script>
<script src="world.js"></script>
<script src="talo.js"></script>
<script src="ai.js"></script>
<script>
// three.js for the 3D picture (#488), from the site's shared folder.
window.L3D_LIB = import('../../../lib/three-r187/three.module.js');
</script>
<script src="draw3d.js"></script>
<script src="ui.js"></script>
<script src="net.js"></script>
<script src="../../../scores.js" data-game="lattia-on-laavaa" data-order="high" data-corner="bottom-right"></script>
<script src="../../../back.js"></script>
</body>
</html>
