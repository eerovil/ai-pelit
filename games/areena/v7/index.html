<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Areena</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1712;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100vw;height:100dvh;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 48px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;background:rgba(20,16,12,.86);text-align:center;touch-action:manipulation}
  #menu.hidden{display:none}
  #menu h1{margin:0;font-size:40px;letter-spacing:2px;color:#ffd166;text-shadow:0 3px 0 #7a4b12}
  #result{margin:0;font-size:26px;font-weight:800;min-height:0}
  #result.win{color:#7ee081}#result.lose{color:#ff7a6b}
  label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:#e8dcc8;width:100%;max-width:280px}
  #name{font:600 20px system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid #8a6a3c;background:#2b241b;color:#fff;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
  #name:focus{border-color:#ffd166}
  #foe{margin:4px 0 0;font-size:17px;color:#ffb4a8}
  #go{font:800 22px system-ui,sans-serif;padding:14px 34px;border:0;border-radius:16px;background:#e0a82e;color:#2a1a05;box-shadow:0 4px 0 #8a5d10}
  #go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d10}
  #multi{font:700 17px system-ui,sans-serif;padding:11px 22px;border:2px solid #8a6a3c;border-radius:14px;background:#2b241b;color:#ffd166}
  #stats{margin:0;font-size:14px;color:#bfae93}
  .help{margin:6px 0 0;font-size:13px;line-height:1.45;color:#a99878;max-width:300px}
  /* Portrait: the two columns are not boxes, and each item's order keeps the one-column menu. */
  .col{display:contents}
  #menu h1{order:1}#result{order:2}#menu label{order:3}#foe{order:4}#go{order:5}#multi{order:6}#stats{order:7}.help{order:8}
  /* A phone turned sideways: the title and record on the left, the name and buttons on the right. */
  @media (orientation:landscape) and (max-height:560px){
    #menu{flex-direction:row;gap:36px;padding:calc(env(safe-area-inset-top,0px) + 12px) calc(env(safe-area-inset-right,0px) + 24px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 24px)}
    .col{display:flex;flex-direction:column;align-items:center;gap:10px;flex:0 1 300px;min-width:0}
    #menu h1{font-size:34px}
    #result{font-size:22px}
    #foe{margin:0}
    .help{margin:2px 0 0;font-size:12px;line-height:1.4}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="menu">
  <div class="col">
  <h1>⚔️ Areena</h1>
  <p id="result"></p>
  <p id="foe"></p>
  <p id="stats"></p>
  <p class="help">Vasen peukalo liikuttaa. 🗡️ Miekka lyö lähelle, 🏹 jousi ampuu nuolen kauas. 💨 Väistön aikana mikään ei osu. 👥 Kavereiden kanssa 2–8 pelaajaa: yksi luo huoneen, muut liittyvät sen koodilla. Kaikki vastaan kaikki, viimeinen pystyssä voittaa.</p>
  </div>
  <div class="col">
  <label>Hahmosi nimi
    <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Sankari">
  </label>
  <button id="go">Taisteluun!</button>
  <button id="multi">👥 Pelaa kavereiden kanssa</button>
  </div>
</div>
<!-- v7 (#369): a room takes 2-8 phones; with more than two it is everyone against everyone -->
<script src="../../../rooms.js" data-game="areena" data-min="2" data-max="8"></script>
<!-- v6 (#337): aanet-4, without the crowd sounds (applause, shouting, "ooh", the cheer)
     and with the loudest sounds quieter -->
<script src="../../../lib/aanet-4/aanet.js"></script>
<script>
'use strict';
const c = document.getElementById('c'), x = c.getContext('2d');
const menu = document.getElementById('menu'), nameIn = document.getElementById('name');

// Saves: shared by every version of this game.
const KEY = 'ai-pelit:areena:';
function load(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
let playerName = load('nimi', '');
let level = load('taso', 1), wins = load('voitot', 0), losses = load('haviot', 0);

const FOES = ['Rautakoura', 'Kivisilmä', 'Varjokettu', 'Myrskyhammas', 'Raudanpurija', 'Lohikäärmekuningas'];
function foeName(l) { return l <= FOES.length ? FOES[l - 1] : FOES[FOES.length - 1] + ' ' + (l - FOES.length + 1); }

// Arena in world units; drawn scaled to fit between the HUD and the controls.
const AW = 340, AH = 440, PR = 14, ARROW_V = 320;
const PILLARS = [{ x: 82, y: 220, r: 22 }, { x: 258, y: 220, r: 22 }];
const SWING = 0.26, HP = 100;
// v7: where each phone's fighter starts, in the room's order: the first two as in the duel, then
// the corners, then one more each side of the middle. Every spot is in the arena's lower or upper
// part, never its middle row, so each phone (turned round for the upper ones) sees its own fighter
// start near the bottom. An online round lasts at most ROUND seconds.
const SPOTS = [[170, 380], [170, 60], [40, 380], [300, 60], [300, 380], [40, 60], [235, 330], [105, 110]];
const COLORS = [['#3d8bfd', '#1f4fa8'], ['#e5484d', '#8f1d22'], ['#3fb950', '#1f6f2c'], ['#f0883e', '#9a4a12'],
  ['#a371f7', '#5b2fa8'], ['#2bb3c0', '#146a73'], ['#f778ba', '#9c2f6a'], ['#e3b341', '#8a6512']];
const ROUND = 90;

// Portrait: HUD on top, arena, controls below. Landscape (a phone turned sideways): the arena
// fills the height in the middle, with the player's bar and stick on the left and the opponent's
// bar and the buttons on the right, where the thumbs rest. Only the drawing moves: the world
// stays the same, so turning the phone mid-fight changes nothing in the fight.
let W, H, DPR, safeT = 0, safeB = 0, safeL = 0, safeR = 0, scale, ox, oy, ctrlTop, land = false, sideW = 0;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = W * DPR; c.height = H * DPR;
  const cs = getComputedStyle(document.getElementById('safe'));
  safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
  safeL = parseFloat(cs.paddingLeft) || 0; safeR = parseFloat(cs.paddingRight) || 0;
  land = W > H;
  if (land) {
    const top = safeT + 8, bot = H - safeB - 8;
    // Leave each side at least 170 px for the bars, the stick and the buttons.
    scale = Math.min((bot - top) / AH, (W - safeL - safeR - 2 * 170) / AW);
    ox = safeL + (W - safeL - safeR - AW * scale) / 2; oy = top + (bot - top - AH * scale) / 2;
    ctrlTop = H - safeB;
    sideW = ox - 10 - safeL;
    return;
  }
  const hudB = safeT + 92, ctrlH = Math.max(170, Math.min(230, H * 0.3));
  ctrlTop = H - safeB - ctrlH;
  scale = Math.min((W - 12) / AW, (ctrlTop - hudB - 6) / AH);
  ox = (W - AW * scale) / 2; oy = hudB + (ctrlTop - hudB - AH * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- Sound (only after the first tap) ----------
let ac = null;
function tone(f, d, type = 'square', vol = 0.08, to = 0) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
// Recorded sounds from the shared library (#205); a game beep only when one cannot play.
const S = AiPelitAanet;
S.load(['gongi', 'suhahdus', 'osuma', 'potku', 'tomahdys', 'voitto', 'tappio']);
const sfx = {
  start: () => S.play('gongi', { vol: 0.7 }) || tone(660, 0.25, 'square', 0.07),
  swing: () => S.play('suhahdus', { vol: 0.55, rate: 1.1 }) || tone(700, 0.09, 'triangle', 0.05, 250),
  shot: () => S.play('suhahdus', { vol: 0.45, rate: 1.6 }) || tone(900, 0.07, 'square', 0.04, 400),
  dash: () => S.play('suhahdus', { vol: 0.25, rate: 0.8 }) || tone(500, 0.12, 'triangle', 0.05, 900),
  // Sword hits (16-20) are the big ones, arrows (8-10) the light ones.
  hit: big => S.play(big ? 'potku' : 'osuma', { vol: big ? 0.9 : 0.7 }) || tone(big ? 140 : 220, 0.12, 'sawtooth', 0.09, 70),
  ko: () => { S.play('tomahdys') || tone(110, 0.6, 'triangle', 0.12, 40); },
  end: won => S.play(won ? 'voitto' : 'tappio', { vol: 0.8 }),
};
function unlock() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }

// ---------- Fighters ----------
// v7: any number of fighters. Each one turns to and aims at the nearest one still standing; a
// knocked-out fighter (out) lies where it fell and takes no part. Alone it is the player and one
// computer opponent, as before.
function brain() { return { mode: 'melee', modeT: 1.5, think: 0, mx: 0, my: 0, strafe: 1, retreat: 0, wait: -1, seenSwing: false }; }
function fighter(px, py, name, col) {
  return { x: px, y: py, r: PR, vx: 0, vy: 0, kx: 0, ky: 0, fx: 0, fy: py < AH / 2 ? 1 : -1, name, color: col[0], dark: col[1],
    hp: HP, max: HP, speed: 125, swing: 0, swingHit: false, swordCd: 0, bowCd: 0, ammo: 5, ammoT: 0,
    dash: 0, dashCd: 0, dx: 0, dy: 0, flash: 0, shot: 0, side: 1, out: false, ai: brain() };
}
let me, foe, fighters = [], arrows, puffs, texts, state = 'menu', stateT = 0, shake = 0, slow = 1;

function rivals(f) { return fighters.filter(o => o !== f && !o.out); }
function nearest(f) {
  let best = null, bd = Infinity;
  for (const o of rivals(f)) { const d = Math.hypot(o.x - f.x, o.y - f.y); if (d < bd) { bd = d; best = o; } }
  return best;
}

function newFight() {
  me = fighter(AW / 2, AH - 60, playerName || 'Sankari', COLORS[0]);
  foe = fighter(AW / 2, 60, foeName(level), COLORS[1]);
  fighters = [me, foe];
  foe.speed = Math.min(125, 92 + 5 * (level - 1));
  // Later opponents are tougher, as well as quicker and smarter.
  foe.hp = foe.max = Math.min(150, 75 + 10 * (level - 1));
  arrows = []; puffs = []; texts = []; shake = 0; slow = 1;
  // One second each for 3, 2 and 1, then TAISTELE! for the last 0.7 s.
  state = 'count'; stateT = 3.7;
}

function hitWall(f) {
  f.x = Math.max(f.r, Math.min(AW - f.r, f.x));
  f.y = Math.max(f.r, Math.min(AH - f.r, f.y));
  for (const p of PILLARS) {
    const dx = f.x - p.x, dy = f.y - p.y, d = Math.hypot(dx, dy), m = f.r + p.r;
    if (d < m && d > 0) { f.x = p.x + dx / d * m; f.y = p.y + dy / d * m; }
  }
}
// True when nothing stands between two points.
function clear(ax, ay, bx, by) {
  for (const p of PILLARS) {
    const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
    const t = Math.max(0, Math.min(1, ((p.x - ax) * vx + (p.y - ay) * vy) / l2));
    if (Math.hypot(ax + vx * t - p.x, ay + vy * t - p.y) < p.r + 4) return false;
  }
  return true;
}

function damage(t, n, fromX, fromY, push) {
  if (t.out) return;
  if (t.dash > 0) { texts.push({ x: t.x, y: t.y, dy: -26, s: 'Väisti!', c: '#cfe8ff', t: 0.8 }); return; }
  // Sword or arrow, decided before the player's hits are made lighter.
  const big = n > 12;
  // The opponent's hits hurt the player less than the player's hurt it.
  if (t === me && !net) n = Math.max(1, Math.round(n * 0.7));
  t.hp = Math.max(0, t.hp - n); t.flash = 0.18;
  const dx = t.x - fromX, dy = t.y - fromY, d = Math.hypot(dx, dy) || 1;
  t.kx += dx / d * push; t.ky += dy / d * push;
  texts.push({ x: t.x, y: t.y, dy: -26, s: '-' + n, c: t === me ? '#ff8a80' : '#ffe08a', t: 0.8 });
  shake = Math.max(shake, n > 12 ? 7 : 4);
  sfx.hit(big);
  if (t.hp <= 0 && state === 'fight') {
    t.out = true; sfx.ko();
    if (net) net.outs.push(t.id);
    // The last one standing wins: the fight ends in slow motion.
    if (fighters.filter(f => !f.out).length <= 1) { state = 'ko'; stateT = 1.6; slow = 0.3; }
    else texts.push({ x: t.x, y: t.y, dy: -44, s: 'Tyrmätty!', c: '#ff7a6b', t: 1.4 });
  }
}

function act(f, o, inp, dt) {
  if (o) { const ax = o.x - f.x, ay = o.y - f.y, d = Math.hypot(ax, ay) || 1; f.fx = ax / d; f.fy = ay / d; }
  f.swordCd -= dt; f.bowCd -= dt; f.dashCd -= dt; f.flash -= dt; f.shot -= dt;
  if (f.ammo < 5 && (f.ammoT += dt) > 1.4) { f.ammo++; f.ammoT = 0; }
  const live = state === 'fight';
  if (live && inp.dash && f.dashCd <= 0) {
    let dx = inp.mx, dy = inp.my, m = Math.hypot(dx, dy);
    if (m < 0.2) { dx = -f.fx; dy = -f.fy; m = 1; }
    f.dx = dx / m; f.dy = dy / m; f.dash = 0.2; f.dashCd = 1.1;
    sfx.dash();
  }
  if (live && inp.sword && f.swordCd <= 0 && f.swing <= 0 && f.dash <= 0) {
    f.swing = SWING; f.swingHit = false; f.swordCd = 0.6; f.side = -f.side;
    sfx.swing();
  }
  if (live && o && inp.bow && f.bowCd <= 0 && f.ammo > 0 && f.swing <= 0 && f.dash <= 0) {
    // Aim where the opponent will be when the arrow gets there.
    const t = Math.hypot(o.x - f.x, o.y - f.y) / ARROW_V, lead = inp.lead;
    const tx = o.x + o.vx * t * lead, ty = o.y + o.vy * t * lead;
    const sx = tx - f.x, sy = ty - f.y, sd = Math.hypot(sx, sy) || 1;
    arrows.push({ x: f.x + sx / sd * 18, y: f.y + sy / sd * 18, vx: sx / sd * ARROW_V, vy: sy / sd * ARROW_V, from: f, life: 2 });
    f.ammo--; f.ammoT = 0; f.bowCd = 0.7; f.shot = 0.25;
    sfx.shot();
  }
  const px = f.x, py = f.y;
  if (f.dash > 0) {
    f.dash -= dt; f.x += f.dx * 420 * dt; f.y += f.dy * 420 * dt;
  } else {
    let mx = inp.mx, my = inp.my; const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    const sp = live ? f.speed * (f.swing > 0 ? 0.45 : 1) : 0;
    f.x += mx * sp * dt; f.y += my * sp * dt;
  }
  f.x += f.kx * dt; f.y += f.ky * dt;
  const k = Math.exp(-9 * dt); f.kx *= k; f.ky *= k;
  hitWall(f);
  f.vx = (f.x - px) / dt; f.vy = (f.y - py) / dt;
  if (f.swing > 0) {
    f.swing -= dt;
    // The blade connects in the middle of the swing, with everyone in reach in front of it.
    if (!f.swingHit && f.swing < SWING * 0.55) {
      f.swingHit = true;
      if (live) for (const t of rivals(f)) {
        const dx = t.x - f.x, dy = t.y - f.y, d = Math.hypot(dx, dy) || 1;
        if (d < f.r + t.r + 34 && dx * f.fx + dy * f.fy > 0) damage(t, 16 + Math.floor(Math.random() * 5), f.x, f.y, 260);
      }
    }
  }
}

// ---------- The computer's head ----------
// Each computer fighter thinks for itself (f.ai): the opponent alone, and in a room the fighter of
// a phone that is away once the host lets the computer take over.
const IDLE = { mx: 0, my: 0, sword: false, bow: false, dash: false, lead: 0 };
function aiInput(f, p, dt) {
  const ai = f.ai, L = level, inp = { mx: ai.mx, my: ai.my, sword: false, bow: false, dash: false, lead: Math.min(0.6, (L - 1) * 0.15) };
  if (!p) return IDLE;
  const react = Math.max(0.18, 0.45 - 0.03 * (L - 1)), dodge = Math.min(0.5, 0.1 + 0.06 * (L - 1));
  const dx = p.x - f.x, dy = p.y - f.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const los = clear(f.x, f.y, p.x, p.y);
  ai.modeT -= dt; ai.retreat -= dt; ai.think -= dt;
  if (ai.modeT <= 0) {
    const hurt = f.hp < 35 && p.hp > f.hp;
    ai.mode = Math.random() < (hurt ? 0.7 : 0.45) ? 'ranged' : 'melee';
    ai.modeT = 2 + Math.random() * 3; ai.strafe = Math.random() < 0.5 ? 1 : -1;
  }
  if (ai.think <= 0) {
    ai.think = react * (0.7 + Math.random() * 0.6);
    let mx = 0, my = 0;
    const sx = -uy * ai.strafe, sy = ux * ai.strafe;
    if (ai.retreat > 0) { mx = -ux + sx * 0.6; my = -uy + sy * 0.6; }
    else if (ai.mode === 'melee' || f.ammo === 0) { mx = ux + sx * 0.35; my = uy + sy * 0.35; }
    else if (!los) { mx = ux * 0.5 + sx; my = uy * 0.5 + sy; }
    else if (d < 130) { mx = -ux + sx * 0.7; my = -uy + sy * 0.7; }
    else if (d > 210) { mx = ux + sx * 0.5; my = uy + sy * 0.5; }
    else { mx = sx; my = sy; }
    // Stuck on a wall: turn the other way round.
    if ((f.x < 22 || f.x > AW - 22 || f.y < 22 || f.y > AH - 22) && Math.random() < 0.3) ai.strafe = -ai.strafe;
    const m = Math.hypot(mx, my) || 1; ai.mx = mx / m; ai.my = my / m;
    inp.mx = ai.mx; inp.my = ai.my;
  }
  // Dodge an arrow flying at it, decided once per arrow.
  for (const s of arrows) {
    if (s.from === f || (s.judged || (s.judged = new Set())).has(f)) continue;
    const rx = f.x - s.x, ry = f.y - s.y, t = (rx * s.vx + ry * s.vy) / (ARROW_V * ARROW_V);
    if (t < 0 || t > 0.45) continue;
    s.judged.add(f);
    const cx = s.x + s.vx * t - f.x, cy = s.y + s.vy * t - f.y;
    if (Math.hypot(cx, cy) < f.r + 8 && Math.random() < dodge) {
      if (f.dashCd <= 0 && Math.random() < 0.6) { inp.dash = true; inp.mx = -s.vy / ARROW_V; inp.my = s.vx / ARROW_V; if (Math.random() < 0.5) { inp.mx *= -1; inp.my *= -1; } }
      else { ai.mx = -s.vy / ARROW_V * ai.strafe; ai.my = s.vx / ARROW_V * ai.strafe; inp.mx = ai.mx; inp.my = ai.my; ai.think = 0.35; }
    }
  }
  // Dodge a sword swing, decided once per swing.
  if (p.swing > 0 && !ai.seenSwing) {
    ai.seenSwing = true;
    if (d < 70 && f.dashCd <= 0 && Math.random() < dodge * 0.75) { inp.dash = true; inp.mx = -ux; inp.my = -uy; }
  }
  if (p.swing <= 0) ai.seenSwing = false;
  // Sword when close, after a short think.
  if (d < f.r + p.r + 30 && f.swordCd <= 0) {
    if (ai.wait < 0) ai.wait = Math.max(0.12, 0.5 - 0.04 * (L - 1)) * (0.6 + Math.random() * 0.8);
    ai.wait -= dt;
    if (ai.wait <= 0) { inp.sword = true; ai.wait = -1; if (Math.random() < 0.5) ai.retreat = 0.3 + Math.random() * 0.3; }
  } else ai.wait = -1;
  // Bow from range when the line is clear.
  if (los && d > 90 && f.ammo > 0 && f.bowCd <= 0 && Math.random() < dt * (ai.mode === 'ranged' ? 2 : 0.5) * (1 + 0.1 * (L - 1))) inp.bow = true;
  return inp;
}

// ---------- Touch controls ----------
const pad = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const held = {};
function buttons() {
  if (land) {
    const s = Math.min(1.1, (sideW - 6) / 190), R0 = W - safeR, cy = H - safeB - 100 * s;
    return [
      { k: 'sword', x: R0 - 64 * s, y: cy + 8 * s, r: 42 * s, icon: '🗡️', label: 'Miekka' },
      { k: 'bow', x: R0 - 156 * s, y: cy + 40 * s, r: 32 * s, icon: '🏹', label: 'Jousi' },
      { k: 'dash', x: R0 - 150 * s, y: cy - 54 * s, r: 27 * s, icon: '💨', label: 'Väistö' },
    ];
  }
  const cy = ctrlTop + (H - safeB - ctrlTop) / 2;
  const s = Math.min(1.15, W / 360);
  return [

  if (state === 'ko') { stateT -= dt / slow; if (stateT <= 0) return net ? endOnline() : endFight(); }

function standing(X, Y) {
  x.font = '800 15px system-ui'; x.fillStyle = '#ffd166'; x.textAlign = 'right';
  x.fillText(`Pystyssä ${fighters.filter(f => !f.out).length}/${fighters.length}`, X, Y + 13);
}
function hudLabel() {
  if (!net) return 'Taso ' + level;
  const s = Math.ceil(net.left), clock = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  return (foe ? 'Kaksintaistelu' : 'Kaikki vastaan kaikki') + ' · ' + clock;
}

function drawHud() {
  if (land) {
    // Below the back chip, one bar on each side of the arena.
    const y = safeT + 66, w = sideW - 16;
    bar(me, safeL + 12, y, w, false);
    if (foe) bar(foe, W - safeR - 12 - w, y, w, true); else standing(W - safeR - 12, y);
    x.font = '600 12px system-ui'; x.fillStyle = '#bfae93'; x.textAlign = 'right';
    x.fillText(hudLabel(), W - safeR - 12, safeT + 22);
    return;
  }
  const y = safeT + 64, w = (W - 36) / 2;
  bar(me, 12, y, w, false);
  if (foe) {
    bar(foe, W - 12 - w, y, w, true);
    x.textAlign = 'center'; x.font = '800 15px system-ui'; x.fillStyle = '#ffd166';
    x.fillText('VS', W / 2, y + 13);
  } else standing(W - 12, y);
  x.font = '600 12px system-ui'; x.fillStyle = '#bfae93'; x.textAlign = 'right';
  x.fillText(hudLabel(), W - 12, safeT + 22);
}

function drawControls() {
  if (!land) { x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(0, ctrlTop, W, H - ctrlTop); }
  const home = padHome(), on = pad.id !== null;
  const bx = on ? pad.ox : home.x, by = on ? pad.oy : home.y;
  x.fillStyle = 'rgba(255,255,255,.08)'; x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 2;
  x.beginPath(); x.arc(bx, by, 50, 0, 7); x.fill(); x.stroke();
  let kx = bx, ky = by;
  if (on) { const dx = pad.x - pad.ox, dy = pad.y - pad.oy, d = Math.hypot(dx, dy), m = Math.min(d, 50); if (d > 0) { kx += dx / d * m; ky += dy / d * m; } }
  x.fillStyle = on ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.3)'; x.beginPath(); x.arc(kx, ky, 22, 0, 7); x.fill();
  if (!on) { x.font = '600 11px system-ui'; x.fillStyle = 'rgba(255,255,255,.5)'; x.textAlign = 'center'; x.fillText('Liiku', bx, by + 68); }
  for (const b of buttons()) {
    const cd = b.k === 'sword' ? me.swordCd / 0.6 : b.k === 'bow' ? (me.ammo ? me.bowCd / 0.7 : 1) : me.dashCd / 1.1;
    const pressed = held[b.k] !== undefined;
    x.fillStyle = pressed ? 'rgba(255,209,102,.55)' : 'rgba(255,255,255,.14)';
    x.strokeStyle = 'rgba(255,255,255,.4)'; x.lineWidth = 2;
    x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill(); x.stroke();
    if (cd > 0) { x.fillStyle = 'rgba(0,0,0,.4)'; x.beginPath(); x.moveTo(b.x, b.y); x.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, cd)); x.fill(); }
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `${Math.round(b.r * 0.8)}px system-ui`; x.fillStyle = '#fff';
    x.fillText(b.icon, b.x, b.y - 2); x.textBaseline = 'alphabetic';
    x.font = '600 11px system-ui'; x.fillStyle = 'rgba(255,255,255,.75)'; x.fillText(b.label, b.x, b.y + b.r + 13);
    if (b.k === 'bow') for (let i = 0; i < 5; i++) {
      x.fillStyle = i < me.ammo ? '#d9d2c3' : 'rgba(255,255,255,.15)';
      x.beginPath(); x.arc(b.x - 16 + i * 8, b.y - b.r - 7, 3, 0, 7); x.fill();
    }
  }
}

function countText() { const n = Math.ceil(stateT - 0.7); return n > 0 ? String(n) : 'TAISTELE!'; }

function draw() {
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  x.fillStyle = '#1b1712'; x.fillRect(0, 0, W, H);
  if (!me) { drawArena(); return; }
  x.save();
  if (shake > 0.3) x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawArena();
  // The fallen first, then front to back as the screen shows them.
  const sy = f => (f.out ? -1e4 : 0) + W2(f.x, f.y)[1];
  for (const f of fighters.slice().sort((a, b) => sy(a) - sy(b))) drawFighter(f);
  for (const s of arrows) {
    const [sx, sy] = W2(s.x, s.y);
    x.save(); x.translate(sx, sy); x.rotate(Math.atan2(s.vy, s.vx) + (flip() ? Math.PI : 0)); x.scale(scale, scale);
    x.strokeStyle = '#6b4423'; x.lineWidth = 2; x.beginPath(); x.moveTo(-14, 0); x.lineTo(4, 0); x.stroke();
    x.fillStyle = '#cfd6dd'; x.beginPath(); x.moveTo(8, 0); x.lineTo(2, -3.5); x.lineTo(2, 3.5); x.fill();
    // The fletching in the shooter's colour.
    x.fillStyle = s.from ? s.from.color : '#e5484d'; x.beginPath(); x.moveTo(-14, 0); x.lineTo(-18, -3.5); x.lineTo(-11, 0); x.lineTo(-18, 3.5); x.fill();
    x.restore();
  }
  for (const p of puffs) {
    const [px, py] = W2(p.x, p.y);
    x.fillStyle = `rgba(230,215,185,${p.t * 2})`; x.beginPath(); x.arc(px, py, (1 - p.t / 0.3) * 12 * scale + 3, 0, 7); x.fill();
  }
  x.textAlign = 'center'; x.font = '800 16px system-ui';
  for (const t of texts) {
    const [tx0, ty0] = W2(t.x, t.y), ty = Math.max(oy + 16, ty0 + t.dy * scale);
    // Kept on the screen when it is over a fighter at the edge.
    const hw = x.measureText(t.s).width / 2 + 4, tx = Math.max(hw, Math.min(W - hw, tx0));
    x.globalAlpha = Math.min(1, t.t * 2); x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.6)';
    x.strokeText(t.s, tx, ty); x.fillStyle = t.c; x.fillText(t.s, tx, ty);
  }
  x.globalAlpha = 1;
  x.restore();
  drawHud(); drawControls();
  const cx = W / 2, cy = oy + AH * scale / 2;
  x.textAlign = 'center'; x.lineWidth = 5; x.strokeStyle = 'rgba(0,0,0,.6)';
  if (state === 'count') {
    const s = countText(), n = s.length === 1 ? 1 : 0;
    x.font = `900 ${n > 0 ? 64 : 40}px system-ui`; x.strokeText(s, cx, cy); x.fillStyle = '#ffd166'; x.fillText(s, cx, cy);
  } else if (state === 'ko') {
    const s = net && net.timeUp ? 'AIKA!' : 'K.O.!';
    x.font = '900 52px system-ui'; x.strokeText(s, cx, cy); x.fillStyle = '#ff7a6b'; x.fillText(s, cx, cy);
  } else if (state === 'fight' && net && me.out) {
    // Knocked out before the end: this phone watches the rest of the round.
    x.font = '800 20px system-ui'; x.lineWidth = 4;
    x.strokeText('Tyrmätty – katso loppuun', cx, oy + 40); x.fillStyle = '#ffd166'; x.fillText('Tyrmätty – katso loppuun', cx, oy + 40);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt > 0) step(dt); draw();
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
</script>
<script src="../../../back.js"></script>
</body>
</html>
