<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Areena</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#1b1712;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100vw;height:100dvh;touch-action:none}
  #safe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px) 0}
  #menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 48px) 24px calc(env(safe-area-inset-bottom,0px) + 24px);box-sizing:border-box;background:rgba(20,16,12,.86);text-align:center;touch-action:manipulation}
  #menu.hidden{display:none}
  #menu h1{margin:0;font-size:40px;letter-spacing:2px;color:#ffd166;text-shadow:0 3px 0 #7a4b12}
  #result{margin:0;font-size:26px;font-weight:800;min-height:0}
  #result.win{color:#7ee081}#result.lose{color:#ff7a6b}
  label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:#e8dcc8;width:100%;max-width:280px}
  #name{font:600 20px system-ui,sans-serif;padding:10px 12px;border-radius:12px;border:2px solid #8a6a3c;background:#2b241b;color:#fff;text-align:center;outline:none;-webkit-user-select:text;user-select:text}
  #name:focus{border-color:#ffd166}
  #foe{margin:4px 0 0;font-size:17px;color:#ffb4a8}
  #go{font:800 22px system-ui,sans-serif;padding:14px 34px;border:0;border-radius:16px;background:#e0a82e;color:#2a1a05;box-shadow:0 4px 0 #8a5d10}
  #go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d10}
  #stats{margin:0;font-size:14px;color:#bfae93}
  .help{margin:6px 0 0;font-size:13px;line-height:1.45;color:#a99878;max-width:300px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="safe"></div>
<div id="menu">
  <h1>⚔️ Areena</h1>
  <p id="result"></p>
  <label>Hahmosi nimi
    <input id="name" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Sankari">
  </label>
  <p id="foe"></p>
  <button id="go">Taisteluun!</button>
  <p id="stats"></p>
  <p class="help">Vasen peukalo liikuttaa. 🗡️ Miekka lyö lähelle, 🏹 jousi ampuu nuolen kauas. 💨 Väistön aikana mikään ei osu.</p>
</div>
<script>
'use strict';
const c = document.getElementById('c'), x = c.getContext('2d');
const menu = document.getElementById('menu'), nameIn = document.getElementById('name');

// Saves: shared by every version of this game.
const KEY = 'ai-pelit:areena:';
function load(k, d) { try { const v = localStorage.getItem(KEY + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) {} }
let playerName = load('nimi', '');
let level = load('taso', 1), wins = load('voitot', 0), losses = load('haviot', 0);

const FOES = ['Rautakoura', 'Kivisilmä', 'Varjokettu', 'Myrskyhammas', 'Raudanpurija', 'Lohikäärmekuningas'];
function foeName(l) { return l <= FOES.length ? FOES[l - 1] : FOES[FOES.length - 1] + ' ' + (l - FOES.length + 1); }

// Arena in world units; drawn scaled to fit between the HUD and the controls.
const AW = 340, AH = 440, PR = 14, ARROW_V = 320;
const PILLARS = [{ x: 82, y: 220, r: 22 }, { x: 258, y: 220, r: 22 }];
const SWING = 0.26, HP = 100;

let W, H, DPR, safeT = 0, safeB = 0, scale, ox, oy, ctrlTop;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  c.width = W * DPR; c.height = H * DPR;
  const cs = getComputedStyle(document.getElementById('safe'));
  safeT = parseFloat(cs.paddingTop) || 0; safeB = parseFloat(cs.paddingBottom) || 0;
  const hudB = safeT + 92, ctrlH = Math.max(170, Math.min(230, H * 0.3));
  ctrlTop = H - safeB - ctrlH;
  scale = Math.min((W - 12) / AW, (ctrlTop - hudB - 6) / AH);
  ox = (W - AW * scale) / 2; oy = hudB + (ctrlTop - hudB - AH * scale) / 2;
}
addEventListener('resize', resize); resize();

// ---------- Sound (only after the first tap) ----------
let ac = null;
function tone(f, d, type = 'square', vol = 0.08, to = 0) {
  if (!ac) return;
  const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
function unlock() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }

// ---------- Fighters ----------
function fighter(px, py, name, color, dark, ai) {
  return { x: px, y: py, r: PR, vx: 0, vy: 0, kx: 0, ky: 0, fx: 0, fy: ai ? 1 : -1, name, color, dark, ai,
    hp: HP, max: HP, speed: 125, swing: 0, swingHit: false, swordCd: 0, bowCd: 0, ammo: 5, ammoT: 0,
    dash: 0, dashCd: 0, dx: 0, dy: 0, flash: 0, shot: 0, side: 1 };
}
let me, foe, arrows, puffs, texts, state = 'menu', stateT = 0, shake = 0, slow = 1;

function newFight() {
  me = fighter(AW / 2, AH - 60, playerName || 'Sankari', '#3d8bfd', '#1f4fa8', false);
  foe = fighter(AW / 2, 60, foeName(level), '#e5484d', '#8f1d22', true);
  foe.speed = Math.min(138, 100 + 7 * (level - 1));
  // Later opponents are tougher, as well as quicker and smarter.
  foe.hp = foe.max = Math.min(180, 90 + 15 * (level - 1));
  arrows = []; puffs = []; texts = []; shake = 0; slow = 1;
  ai.mode = 'melee'; ai.modeT = 1.5; ai.think = 0; ai.retreat = 0; ai.wait = -1;
  // One second each for 3, 2 and 1, then TAISTELE! for the last 0.7 s.
  state = 'count'; stateT = 3.7;
}

function hitWall(f) {
  f.x = Math.max(f.r, Math.min(AW - f.r, f.x));
  f.y = Math.max(f.r, Math.min(AH - f.r, f.y));
  for (const p of PILLARS) {
    const dx = f.x - p.x, dy = f.y - p.y, d = Math.hypot(dx, dy), m = f.r + p.r;
    if (d < m && d > 0) { f.x = p.x + dx / d * m; f.y = p.y + dy / d * m; }
  }
}
// True when nothing stands between two points.
function clear(ax, ay, bx, by) {
  for (const p of PILLARS) {
    const vx = bx - ax, vy = by - ay, l2 = vx * vx + vy * vy || 1;
    const t = Math.max(0, Math.min(1, ((p.x - ax) * vx + (p.y - ay) * vy) / l2));
    if (Math.hypot(ax + vx * t - p.x, ay + vy * t - p.y) < p.r + 4) return false;
  }
  return true;
}

function damage(t, n, fromX, fromY, push) {
  if (t.dash > 0) { texts.push({ x: t.x, y: t.y - 26, s: 'Väisti!', c: '#cfe8ff', t: 0.8 }); return; }
  t.hp = Math.max(0, t.hp - n); t.flash = 0.18;
  const dx = t.x - fromX, dy = t.y - fromY, d = Math.hypot(dx, dy) || 1;
  t.kx += dx / d * push; t.ky += dy / d * push;
  texts.push({ x: t.x, y: t.y - 26, s: '-' + n, c: t.ai ? '#ffe08a' : '#ff8a80', t: 0.8 });
  shake = Math.max(shake, n > 12 ? 7 : 4);
  tone(n > 12 ? 140 : 220, 0.12, 'sawtooth', 0.09, 70);
  if (t.hp <= 0 && state === 'fight') { state = 'ko'; stateT = 1.6; slow = 0.3; tone(110, 0.6, 'triangle', 0.12, 40); }
}

function act(f, o, inp, dt) {
  const ax = o.x - f.x, ay = o.y - f.y, d = Math.hypot(ax, ay) || 1;
  f.fx = ax / d; f.fy = ay / d;
  f.swordCd -= dt; f.bowCd -= dt; f.dashCd -= dt; f.flash -= dt; f.shot -= dt;
  if (f.ammo < 5 && (f.ammoT += dt) > 1.4) { f.ammo++; f.ammoT = 0; }
  const live = state === 'fight';
  if (live && inp.dash && f.dashCd <= 0) {
    let dx = inp.mx, dy = inp.my, m = Math.hypot(dx, dy);
    if (m < 0.2) { dx = -f.fx; dy = -f.fy; m = 1; }
    f.dx = dx / m; f.dy = dy / m; f.dash = 0.2; f.dashCd = 1.1;
    tone(500, 0.12, 'triangle', 0.05, 900);
  }
  if (live && inp.sword && f.swordCd <= 0 && f.swing <= 0 && f.dash <= 0) {
    f.swing = SWING; f.swingHit = false; f.swordCd = 0.6; f.side = -f.side;
    tone(700, 0.09, 'triangle', 0.05, 250);
  }
  if (live && inp.bow && f.bowCd <= 0 && f.ammo > 0 && f.swing <= 0 && f.dash <= 0) {
    // Aim where the opponent will be when the arrow gets there.
    const t = d / ARROW_V, lead = inp.lead;
    const tx = o.x + o.vx * t * lead, ty = o.y + o.vy * t * lead;
    const sx = tx - f.x, sy = ty - f.y, sd = Math.hypot(sx, sy) || 1;
    arrows.push({ x: f.x + sx / sd * 18, y: f.y + sy / sd * 18, vx: sx / sd * ARROW_V, vy: sy / sd * ARROW_V, from: f, life: 2 });
    f.ammo--; f.ammoT = 0; f.bowCd = 0.7; f.shot = 0.25;
    tone(900, 0.07, 'square', 0.04, 400);
  }
  const px = f.x, py = f.y;
  if (f.dash > 0) {
    f.dash -= dt; f.x += f.dx * 420 * dt; f.y += f.dy * 420 * dt;
  } else {
    let mx = inp.mx, my = inp.my; const m = Math.hypot(mx, my);
    if (m > 1) { mx /= m; my /= m; }
    const sp = live ? f.speed * (f.swing > 0 ? 0.45 : 1) : 0;
    f.x += mx * sp * dt; f.y += my * sp * dt;
  }
  f.x += f.kx * dt; f.y += f.ky * dt;
  const k = Math.exp(-9 * dt); f.kx *= k; f.ky *= k;
  hitWall(f);
  f.vx = (f.x - px) / dt; f.vy = (f.y - py) / dt;
  if (f.swing > 0) {
    f.swing -= dt;
    // The blade connects in the middle of the swing.
    if (!f.swingHit && f.swing < SWING * 0.55) {
      f.swingHit = true;
      if (d < f.r + o.r + 34 && live) damage(o, 16 + Math.floor(Math.random() * 5), f.x, f.y, 260);
    }
  }
}

// ---------- The opponent's head ----------
const ai = { mode: 'melee', modeT: 0, think: 0, mx: 0, my: 0, strafe: 1, retreat: 0, wait: -1, seenSwing: false };
function aiInput(f, p, dt) {
  const L = level, inp = { mx: ai.mx, my: ai.my, sword: false, bow: false, dash: false, lead: Math.min(1, (L - 1) * 0.3) };
  const react = Math.max(0.1, 0.32 - 0.04 * (L - 1)), dodge = Math.min(0.8, 0.22 + 0.1 * (L - 1));
  const dx = p.x - f.x, dy = p.y - f.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const los = clear(f.x, f.y, p.x, p.y);
  ai.modeT -= dt; ai.retreat -= dt; ai.think -= dt;
  if (ai.modeT <= 0) {
    const hurt = f.hp < 35 && p.hp > f.hp;
    ai.mode = Math.random() < (hurt ? 0.7 : 0.45) ? 'ranged' : 'melee';
    ai.modeT = 2 + Math.random() * 3; ai.strafe = Math.random() < 0.5 ? 1 : -1;
  }
  if (ai.think <= 0) {
    ai.think = react * (0.7 + Math.random() * 0.6);
    let mx = 0, my = 0;
    const sx = -uy * ai.strafe, sy = ux * ai.strafe;
    if (ai.retreat > 0) { mx = -ux + sx * 0.6; my = -uy + sy * 0.6; }
    else if (ai.mode === 'melee' || f.ammo === 0) { mx = ux + sx * 0.35; my = uy + sy * 0.35; }
    else if (!los) { mx = ux * 0.5 + sx; my = uy * 0.5 + sy; }
    else if (d < 130) { mx = -ux + sx * 0.7; my = -uy + sy * 0.7; }
    else if (d > 210) { mx = ux + sx * 0.5; my = uy + sy * 0.5; }
    else { mx = sx; my = sy; }
    // Stuck on a wall: turn the other way round.
    if ((f.x < 22 || f.x > AW - 22 || f.y < 22 || f.y > AH - 22) && Math.random() < 0.3) ai.strafe = -ai.strafe;
    const m = Math.hypot(mx, my) || 1; ai.mx = mx / m; ai.my = my / m;
    inp.mx = ai.mx; inp.my = ai.my;
  }
  // Dodge an arrow flying at it, decided once per arrow.
  for (const s of arrows) {
    if (s.from !== p || s.judged) continue;
    const rx = f.x - s.x, ry = f.y - s.y, t = (rx * s.vx + ry * s.vy) / (ARROW_V * ARROW_V);
    if (t < 0 || t > 0.45) continue;
    s.judged = true;
    const cx = s.x + s.vx * t - f.x, cy = s.y + s.vy * t - f.y;
    if (Math.hypot(cx, cy) < f.r + 8 && Math.random() < dodge) {
      if (f.dashCd <= 0 && Math.random() < 0.6) { inp.dash = true; inp.mx = -s.vy / ARROW_V; inp.my = s.vx / ARROW_V; if (Math.random() < 0.5) { inp.mx *= -1; inp.my *= -1; } }
      else { ai.mx = -s.vy / ARROW_V * ai.strafe; ai.my = s.vx / ARROW_V * ai.strafe; inp.mx = ai.mx; inp.my = ai.my; ai.think = 0.35; }
    }
  }
  // Dodge a sword swing, decided once per swing.
  if (p.swing > 0 && !ai.seenSwing) {
    ai.seenSwing = true;
    if (d < 70 && f.dashCd <= 0 && Math.random() < dodge * 0.75) { inp.dash = true; inp.mx = -ux; inp.my = -uy; }
  }
  if (p.swing <= 0) ai.seenSwing = false;
  // Sword when close, after a short think.
  if (d < f.r + p.r + 30 && f.swordCd <= 0) {
    if (ai.wait < 0) ai.wait = Math.max(0.04, 0.34 - 0.05 * (L - 1)) * (0.6 + Math.random() * 0.8);
    ai.wait -= dt;
    if (ai.wait <= 0) { inp.sword = true; ai.wait = -1; if (Math.random() < 0.5) ai.retreat = 0.3 + Math.random() * 0.3; }
  } else ai.wait = -1;
  // Bow from range when the line is clear.
  if (los && d > 90 && f.ammo > 0 && f.bowCd <= 0 && Math.random() < dt * (ai.mode === 'ranged' ? 3 : 0.7) * (1 + 0.15 * (L - 1))) inp.bow = true;
  return inp;
}

// ---------- Touch controls ----------
const pad = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
const held = {};
function buttons() {
  const cy = ctrlTop + (H - safeB - ctrlTop) / 2;
  const s = Math.min(1.15, W / 360);
  return [
    { k: 'sword', x: W - 64 * s, y: cy + 8, r: 42 * s, icon: '🗡️', label: 'Miekka' },
    { k: 'bow', x: W - 156 * s, y: cy + 40, r: 32 * s, icon: '🏹', label: 'Jousi' },
    { k: 'dash', x: W - 150 * s, y: cy - 54, r: 27 * s, icon: '💨', label: 'Väistö' },
  ];
}
function padHome() { return { x: Math.max(80, W * 0.22), y: ctrlTop + (H - safeB - ctrlTop) / 2 }; }
c.addEventListener('pointerdown', e => {
  e.preventDefault(); unlock();
  if (state === 'over' || state === 'menu') return;
  for (const b of buttons()) {
    if (Math.hypot(e.clientX - b.x, e.clientY - b.y) < b.r + 12) { held[b.k] = e.pointerId; if (b.k === 'dash') held.dashTap = true; return; }
  }
  if (e.clientX < W * 0.5 && pad.id === null) {
    pad.id = e.pointerId; pad.ox = e.clientX; pad.oy = e.clientY; pad.x = e.clientX; pad.y = e.clientY;
  }
}, { passive: false });
c.addEventListener('pointermove', e => { if (e.pointerId === pad.id) { pad.x = e.clientX; pad.y = e.clientY; } });
function up(e) {
  if (e.pointerId === pad.id) pad.id = null;
  for (const k in held) if (held[k] === e.pointerId) delete held[k];
}
c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);

function playerInput() {
  let mx = 0, my = 0;
  if (pad.id !== null) {
    const dx = pad.x - pad.ox, dy = pad.y - pad.oy, d = Math.hypot(dx, dy), R = 50;
    if (d > 6) { const m = Math.min(1, d / R); mx = dx / d * m; my = dy / d * m; }
    // Follow a thumb that slides far past the ring.
    if (d > R * 1.4) { pad.ox = pad.x - dx / d * R * 1.4; pad.oy = pad.y - dy / d * R * 1.4; }
  }
  const dash = !!held.dashTap; held.dashTap = false;
  return { mx, my, sword: held.sword !== undefined, bow: held.bow !== undefined, dash, lead: 1 };
}

// ---------- Game step ----------
function step(dt) {
  if (state === 'menu' || state === 'over') return;
  texts.forEach(t => { t.t -= dt; t.y -= 30 * dt; }); texts = texts.filter(t => t.t > 0);
  puffs.forEach(p => p.t -= dt); puffs = puffs.filter(p => p.t > 0);
  shake *= Math.exp(-10 * dt);
  if (state === 'count') { stateT -= dt; if (stateT <= 0) { state = 'fight'; tone(660, 0.25, 'square', 0.07); } }
  if (state === 'ko') { stateT -= dt / slow; if (stateT <= 0) return endFight(); }
  dt *= slow;
  const pi = playerInput(), fi = state === 'fight' ? aiInput(foe, me, dt) : { mx: 0, my: 0, lead: 0 };
  act(me, foe, pi, dt); act(foe, me, fi, dt);
  // Fighters push each other apart.
  const dx = foe.x - me.x, dy = foe.y - me.y, d = Math.hypot(dx, dy) || 1, m = me.r + foe.r;
  if (d < m) { const p = (m - d) / 2; me.x -= dx / d * p; me.y -= dy / d * p; foe.x += dx / d * p; foe.y += dy / d * p; hitWall(me); hitWall(foe); }
  for (const s of arrows) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    const t = s.from === me ? foe : me;
    let hit = s.x < 0 || s.x > AW || s.y < 0 || s.y > AH || s.life <= 0 || PILLARS.some(p => Math.hypot(s.x - p.x, s.y - p.y) < p.r + 3);
    if (!hit && Math.hypot(s.x - t.x, s.y - t.y) < t.r + 4 && t.dash <= 0) { hit = true; if (state === 'fight') damage(t, 8 + Math.floor(Math.random() * 3), s.x - s.vx, s.y - s.vy, 120); }
    if (hit) { s.dead = true; puffs.push({ x: s.x, y: s.y, t: 0.3 }); }
  }
  arrows = arrows.filter(s => !s.dead);
}

function endFight() {
  const won = foe.hp <= 0 && me.hp > 0;
  if (won) { wins++; level++; } else losses++;
  save('taso', level); save('voitot', wins); save('haviot', losses);
  state = 'over';
  showMenu(won ? `🏆 ${me.name} voitti!` : `💀 ${foe.name} voitti`, won ? 'win' : 'lose');
}

function showMenu(result, cls) {
  const r = document.getElementById('result');
  r.textContent = result || ''; r.className = cls || ''; r.style.display = result ? '' : 'none';
  nameIn.value = playerName;
  document.getElementById('foe').textContent = `Vastassa: ${foeName(level)} (taso ${level})`;
  document.getElementById('stats').textContent = wins + losses ? `Voitot ${wins} · Häviöt ${losses}` : '';
  document.getElementById('go').textContent = cls === 'win' ? 'Seuraava ottelu!' : cls === 'lose' ? 'Uudestaan!' : 'Taisteluun!';
  menu.classList.remove('hidden');
}
document.getElementById('go').addEventListener('click', () => {
  unlock();
  nameIn.blur();
  playerName = nameIn.value.trim().slice(0, 14);
  save('nimi', playerName);
  menu.classList.add('hidden');
  pad.id = null; for (const k in held) delete held[k];
  newFight();
});
nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('go').click(); });

// ---------- Drawing ----------
function W2(px, py) { return [ox + px * scale, oy + py * scale]; }
const SPECKS = Array.from({ length: 70 }, (_, i) => ({ x: (i * 97.3) % AW, y: (i * 151.7) % AH, r: 1 + (i % 3) }));

function drawArena() {
  x.save(); x.translate(ox, oy); x.scale(scale, scale);
  x.fillStyle = '#5b4630'; x.beginPath(); x.roundRect(-8, -8, AW + 16, AH + 16, 18); x.fill();
  const g = x.createRadialGradient(AW / 2, AH / 2, 40, AW / 2, AH / 2, AH * 0.7);
  g.addColorStop(0, '#e8cf9a'); g.addColorStop(1, '#c9a66b');
  x.fillStyle = g; x.beginPath(); x.roundRect(0, 0, AW, AH, 12); x.fill();
  x.fillStyle = 'rgba(120,85,45,.25)';
  for (const s of SPECKS) { x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); }
  x.strokeStyle = 'rgba(120,85,45,.35)'; x.lineWidth = 2; x.setLineDash([6, 8]);
  x.beginPath(); x.arc(AW / 2, AH / 2, 54, 0, 7); x.stroke(); x.setLineDash([]);
  for (const p of PILLARS) {
    x.fillStyle = 'rgba(0,0,0,.22)'; x.beginPath(); x.ellipse(p.x + 4, p.y + 6, p.r, p.r * 0.8, 0, 0, 7); x.fill();
    const pg = x.createRadialGradient(p.x - 7, p.y - 7, 3, p.x, p.y, p.r);
    pg.addColorStop(0, '#b9b2a6'); pg.addColorStop(1, '#6f685d');
    x.fillStyle = pg; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7); x.fill();
    x.strokeStyle = '#4d473f'; x.lineWidth = 2; x.stroke();
  }
  x.restore();
}

function drawFighter(f) {
  x.save(); x.translate(ox + f.x * scale, oy + f.y * scale); x.scale(scale, scale);
  const a = Math.atan2(f.fy, f.fx);
  x.fillStyle = 'rgba(0,0,0,.25)'; x.beginPath(); x.ellipse(2, 5, f.r + 2, f.r * 0.8, 0, 0, 7); x.fill();
  if (f.dash > 0) { x.globalAlpha = 0.55; }
  x.rotate(a);
  // Bow in the left hand, its string pulled back for a moment after a shot.
  x.save(); x.translate(6, -f.r + 2); x.lineCap = 'round';
  x.strokeStyle = '#7a4a1e'; x.lineWidth = 3;
  x.beginPath(); x.arc(0, 0, 11, -1.15, 1.15); x.stroke();
  const pull = f.shot > 0 ? 7 * f.shot / 0.25 : 0;
  x.strokeStyle = '#eee'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(11 * Math.cos(1.15), -11 * Math.sin(1.15)); x.lineTo(4.5 - pull, 0); x.lineTo(11 * Math.cos(1.15), 11 * Math.sin(1.15)); x.stroke();
  x.restore();
  // Sword in the right hand: resting forward, or sweeping across.
  let sa = 0.35;
  if (f.swing > 0) { const p = 1 - f.swing / SWING; sa = f.side * (-1.25 + 2.5 * p); }
  x.save(); x.translate(2, f.r - 2); x.rotate(sa - 0.15);
  if (f.swing > 0) {
    x.fillStyle = 'rgba(255,255,255,.35)'; x.beginPath(); x.moveTo(0, 0);
    x.arc(0, 0, 36, -0.15 - f.side * 0.6, -0.15, f.side < 0); x.fill();
  }
  x.fillStyle = '#5c3a1a'; x.fillRect(-3, -1.5, 8, 3);
  x.fillStyle = '#c9a227'; x.fillRect(4, -5, 3, 10);
  x.fillStyle = '#e9eef3'; x.beginPath(); x.moveTo(7, -2.5); x.lineTo(32, -1.5); x.lineTo(36, 0); x.lineTo(32, 1.5); x.lineTo(7, 2.5); x.fill();
  x.restore();
  // Body, shoulders and helmet.
  x.fillStyle = f.flash > 0 ? '#fff' : f.color; x.strokeStyle = f.dark; x.lineWidth = 2.5;
  x.beginPath(); x.ellipse(0, 0, f.r * 0.85, f.r, 0, 0, 7); x.fill(); x.stroke();
  x.fillStyle = f.flash > 0 ? '#fff' : '#f1c27d'; x.beginPath(); x.arc(2, 0, 7.5, 0, 7); x.fill();
  x.fillStyle = f.dark; x.beginPath(); x.arc(0, 0, 7.5, Math.PI * 0.55, Math.PI * 1.45); x.fill();
  x.restore();
  x.globalAlpha = 1;
  const [nx, ny] = W2(f.x, f.y - f.r - 10);
  x.font = '700 12px system-ui'; x.textAlign = 'center'; x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.6)';
  x.strokeText(f.name, nx, ny); x.fillStyle = f.ai ? '#ffd0cc' : '#d6e6ff'; x.fillText(f.name, nx, ny);
}

function bar(f, X, Y, w, right) {
  x.fillStyle = 'rgba(0,0,0,.45)'; x.beginPath(); x.roundRect(X, Y, w, 16, 8); x.fill();
  const p = f.hp / f.max, bw = (w - 4) * p;
  x.fillStyle = p > 0.5 ? '#5fd068' : p > 0.25 ? '#f2c14e' : '#ef5b4c';
  if (bw > 0) { x.beginPath(); x.roundRect(right ? X + w - 2 - bw : X + 2, Y + 2, bw, 12, 6); x.fill(); }
  x.font = '700 14px system-ui'; x.fillStyle = '#fff'; x.textAlign = right ? 'right' : 'left';
  x.fillText(f.name, right ? X + w : X, Y - 6);
}

function drawHud() {
  const y = safeT + 64, w = (W - 36) / 2;
  bar(me, 12, y, w, false); bar(foe, W - 12 - w, y, w, true);
  x.textAlign = 'center'; x.font = '800 15px system-ui'; x.fillStyle = '#ffd166';
  x.fillText('VS', W / 2, y + 13);
  x.font = '600 12px system-ui'; x.fillStyle = '#bfae93'; x.textAlign = 'right';
  x.fillText('Taso ' + level, W - 12, safeT + 22);
}

function drawControls() {
  x.fillStyle = 'rgba(0,0,0,.18)'; x.fillRect(0, ctrlTop, W, H - ctrlTop);
  const home = padHome(), on = pad.id !== null;
  const bx = on ? pad.ox : home.x, by = on ? pad.oy : home.y;
  x.fillStyle = 'rgba(255,255,255,.08)'; x.strokeStyle = 'rgba(255,255,255,.25)'; x.lineWidth = 2;
  x.beginPath(); x.arc(bx, by, 50, 0, 7); x.fill(); x.stroke();
  let kx = bx, ky = by;
  if (on) { const dx = pad.x - pad.ox, dy = pad.y - pad.oy, d = Math.hypot(dx, dy), m = Math.min(d, 50); if (d > 0) { kx += dx / d * m; ky += dy / d * m; } }
  x.fillStyle = on ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.3)'; x.beginPath(); x.arc(kx, ky, 22, 0, 7); x.fill();
  if (!on) { x.font = '600 11px system-ui'; x.fillStyle = 'rgba(255,255,255,.5)'; x.textAlign = 'center'; x.fillText('Liiku', bx, by + 68); }
  for (const b of buttons()) {
    const cd = b.k === 'sword' ? me.swordCd / 0.6 : b.k === 'bow' ? (me.ammo ? me.bowCd / 0.7 : 1) : me.dashCd / 1.1;
    const pressed = held[b.k] !== undefined;
    x.fillStyle = pressed ? 'rgba(255,209,102,.55)' : 'rgba(255,255,255,.14)';
    x.strokeStyle = 'rgba(255,255,255,.4)'; x.lineWidth = 2;
    x.beginPath(); x.arc(b.x, b.y, b.r, 0, 7); x.fill(); x.stroke();
    if (cd > 0) { x.fillStyle = 'rgba(0,0,0,.4)'; x.beginPath(); x.moveTo(b.x, b.y); x.arc(b.x, b.y, b.r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, cd)); x.fill(); }
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `${Math.round(b.r * 0.8)}px system-ui`; x.fillStyle = '#fff';
    x.fillText(b.icon, b.x, b.y - 2); x.textBaseline = 'alphabetic';
    x.font = '600 11px system-ui'; x.fillStyle = 'rgba(255,255,255,.75)'; x.fillText(b.label, b.x, b.y + b.r + 13);
    if (b.k === 'bow') for (let i = 0; i < 5; i++) {
      x.fillStyle = i < me.ammo ? '#d9d2c3' : 'rgba(255,255,255,.15)';
      x.beginPath(); x.arc(b.x - 16 + i * 8, b.y - b.r - 7, 3, 0, 7); x.fill();
    }
  }
}

function countText() { const n = Math.ceil(stateT - 0.7); return n > 0 ? String(n) : 'TAISTELE!'; }

function draw() {
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  x.fillStyle = '#1b1712'; x.fillRect(0, 0, W, H);
  if (!me) { drawArena(); return; }
  x.save();
  if (shake > 0.3) x.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawArena();
  for (const f of [foe, me].sort((a, b) => a.y - b.y)) drawFighter(f);
  for (const s of arrows) {
    const [sx, sy] = W2(s.x, s.y);
    x.save(); x.translate(sx, sy); x.rotate(Math.atan2(s.vy, s.vx)); x.scale(scale, scale);
    x.strokeStyle = '#6b4423'; x.lineWidth = 2; x.beginPath(); x.moveTo(-14, 0); x.lineTo(4, 0); x.stroke();
    x.fillStyle = '#cfd6dd'; x.beginPath(); x.moveTo(8, 0); x.lineTo(2, -3.5); x.lineTo(2, 3.5); x.fill();
    x.fillStyle = '#e5484d'; x.beginPath(); x.moveTo(-14, 0); x.lineTo(-18, -3.5); x.lineTo(-11, 0); x.lineTo(-18, 3.5); x.fill();
    x.restore();
  }
  for (const p of puffs) {
    const [px, py] = W2(p.x, p.y);
    x.fillStyle = `rgba(230,215,185,${p.t * 2})`; x.beginPath(); x.arc(px, py, (1 - p.t / 0.3) * 12 * scale + 3, 0, 7); x.fill();
  }
  x.textAlign = 'center'; x.font = '800 16px system-ui';
  for (const t of texts) {
    const [tx, ty] = W2(t.x, t.y);
    x.globalAlpha = Math.min(1, t.t * 2); x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.6)';
    x.strokeText(t.s, tx, ty); x.fillStyle = t.c; x.fillText(t.s, tx, ty);
  }
  x.globalAlpha = 1;
  x.restore();
  drawHud(); drawControls();
  const cx = W / 2, cy = oy + AH * scale / 2;
  x.textAlign = 'center'; x.lineWidth = 5; x.strokeStyle = 'rgba(0,0,0,.6)';
  if (state === 'count') {
    const s = countText(), n = s.length === 1 ? 1 : 0;
    x.font = `900 ${n > 0 ? 64 : 40}px system-ui`; x.strokeText(s, cx, cy); x.fillStyle = '#ffd166'; x.fillText(s, cx, cy);
  } else if (state === 'ko') {
    x.font = '900 52px system-ui'; x.strokeText('K.O.!', cx, cy); x.fillStyle = '#ff7a6b'; x.fillText('K.O.!', cx, cy);
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (dt > 0) step(dt); draw();
  requestAnimationFrame(loop);
}
showMenu();
requestAnimationFrame(loop);
</script>
<script src="../../../back.js"></script>
</body>
