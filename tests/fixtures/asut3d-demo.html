<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asut 3D</title>
<style>
  html, body { margin: 0; background: #123; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #valikko { position: fixed; left: 0; right: 0; bottom: 30px; text-align: center; }
  button { font: 700 18px system-ui; padding: 12px 18px; border: 0; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="valikko"></div>
<!-- A test-only game (#568): the smallest whole use of lib/asut3d-1, a person dressed in the
     outfit picked in any 3D game, redressed on a pick. docs/agents/3d-games.md points here. -->
<script src="../../../outfits.js" data-game="asudemo" data-share="3d"></script>
<script src="../../../lib/asut3d-1/asut3d.js"></script>
<script>
// The picker and its button; `change` redresses the person.
let outfit = AiPelitAsut3d.setup({ default: 'sankari', button: 'valikko', change(o) { outfit = o; window.dress && dress(); } });
</script>
<script type="module">
import * as THREE from '../../../lib/three-r187/three.module.js';
const c = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: c, antialias: true }); } catch (e) { window.noWebgl = true; }
if (renderer) {
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x112233);
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
  camera.position.set(0, 1.1, 4.2); camera.lookAt(0, 0.95, 0);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(2, 4, 5); scene.add(sun);
  let fig = null;
  window.dress = () => {
    if (fig) scene.remove(fig);
    fig = AiPelitAsut3d.figure(THREE, outfit);
    scene.add(fig);
    window.fig = fig;
  };
  dress();
  function resize() { renderer.setSize(c.clientWidth, c.clientHeight, false); camera.aspect = c.clientWidth / c.clientHeight; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  renderer.setAnimationLoop(t => {
    // A wave of the right arm: the joints are groups the game turns.
    fig.userData.joints.armR.rotation.z = 2.4 + Math.sin(t / 200) * 0.3;
    renderer.render(scene, camera);
    window.drawn = true;
  });
  window.THREE = THREE;
}
</script>
<script src="../../../back.js"></script>
</body>
</html>
