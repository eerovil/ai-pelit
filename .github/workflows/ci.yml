name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests only: a merge to main is not tested again (#65), every test already ran on the
  # pull request's head.
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server tests (server/api.js on SQLite)
        run: npm test
      - name: No published version changed
        run: python scripts/check_immutable.py origin/${{ github.base_ref }}
      # A game's own browser tests run only when the pull request touches that game (#37); a change
      # outside games/ runs only the shared tests. The full suite never runs (#65).
      - name: Browser tests
        run: python -m pytest -q --changed-since origin/${{ github.base_ref }}
      - run: python scripts/build.py

  # A merge to main is the release: Cloudflare Pages serves it at pelit.vilpponen.fi (a CNAME
  # to ai-pelit.pages.dev at hostingpalvelu.fi).
  # Main runs no browser tests (#65): every test already passed on the pull request's own head,
  # and the deck re-tests that head after bringing it up to main, so running them again only
  # delayed each release by about 6 minutes. Before deploying it runs only what takes seconds:
  # the server tests and the build (which checks every game).
  deploy-cloudflare:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Until the CLOUDFLARE_* secrets are added there is nowhere to deploy to: say so and stop green.
      - name: Is Cloudflare set up?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Not deploying to Cloudflare: add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # The checkout brings functions/ and server/: wrangler bundles them as the site's /api/.
      - uses: actions/checkout@v4
        if: steps.ready.outputs.ready == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Build the site
        if: steps.ready.outputs.ready == 'true'
        run: python scripts/build.py
      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Server tests (server/api.js on SQLite)
        if: steps.ready.outputs.ready == 'true'
        run: npm test
      # The live game rooms' Worker (#27) first, so the site never calls a room that is not there.
      - name: Deploy the rooms Worker
        if: steps.ready.outputs.ready == 'true'
        run: npx -y wrangler@4 deploy -c rooms/wrangler.toml
      - name: Deploy
        if: steps.ready.outputs.ready == 'true'
        run: npx -y wrangler@4 pages deploy _site --project-name ai-pelit --branch main --commit-hash "$GITHUB_SHA"
      - name: Check what is live
        if: steps.ready.outputs.ready == 'true'
        run: |
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://ai-pelit.pages.dev/catalog.json > /dev/null
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors 'https://ai-pelit.pages.dev/api/scores?game=hiihto&board=taso-1' > /dev/null
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors https://ai-pelit.pages.dev/api/plays > /dev/null
          # A room answers a plain GET with 426 (WebSocket only) once ROOMS is bound; 503 if not.
          test "$(curl -sS -o /dev/null -w '%{http_code}' https://ai-pelit.pages.dev/api/rooms/TEST)" = 426
